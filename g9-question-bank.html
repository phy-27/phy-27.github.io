hip between heat and mechanical work.\", \"Temperature in the Celsius scale is an example of an interval scale.\", \"An interval scale has a true zero point.\", \"The second (s) is the SI unit of time.\", \"One kilometer is equal to 100 meters.\", \"There are seven fundamental (basic) physical quantities.\", \"Density is a fundamental physical quantity.\", \"A scalar quantity has both magnitude and direction.\", \"Velocity is a vector quantity.\", \"The prefix “kilo” represents 10⁶.\", \"The number 2000.0 has five significant figures.\", \"It is safe to taste chemicals in the laboratory if the teacher is absent.\"], \"mc\": [[\"The Greek word phusis, from which “physics” comes, means:\", [\"life\", \"nature\", \"matter\", \"light\"]], [\"Which branch of physics studies sound?\", [\"Thermodynamics\", \"Optics\", \"Nuclear physics\", \"Acoustics\"]], [\"Which branch of physics studies the behavior and properties of light?\", [\"Optics\", \"Acoustics\", \"Thermodynamics\", \"Mechanics\"]], [\"Thermal energy and the transfer of heat are studied in:\", [\"Mechanics\", \"Optics\", \"Thermodynamics\", \"Acoustics\"]], [\"Which science applies physics to astronomical objects and phenomena?\", [\"Geology\", \"Astrophysics\", \"Biophysics\", \"Acoustics\"]], [\"The two aspects of electromagnetism are:\", [\"electricity and magnetism\", \"heat and sound\", \"light and sound\", \"force and motion\"]], [\"Quantum mechanics deals with the behavior of:\", [\"cars and trains\", \"planets\", \"smallest particles such as electrons\", \"sound waves\"]], [\"Which field applies physics to study biological phenomena?\", [\"Geophysics\", \"Medical physics\", \"Chemistry\", \"Biophysics\"]], [\"X-rays and MRI are applications of:\", [\"Geophysics\", \"Medical physics\", \"Biophysics\", \"Astrophysics\"]], [\"Who first studied the solar system with a telescope?\", [\"Galileo Galilei\", \"Isaac Newton\", \"Michael Faraday\", \"James Joule\"]], [\"Who is famous for the laws of motion and gravity?\", [\"Galileo\", \"Faraday\", \"Isaac Newton\", \"Marie Curie\"]], [\"Who carried out pioneering research on radioactivity?\", [\"Einstein\", \"Joule\", \"Faraday\", \"Marie Curie\"]], [\"The theory of relativity was developed by:\", [\"Newton\", \"Albert Einstein\", \"Curie\", \"Joule\"]], [\"Which is NOT a branch of physics?\", [\"Optics\", \"Acoustics\", \"Thermodynamics\", \"Evolution\"]], [\"Which scientist discovered electromagnetic induction?\", [\"Galileo\", \"Newton\", \"Michael Faraday\", \"Einstein\"]], [\"Which measurement scale has a true zero and allows addition, subtraction, multiplication and division?\", [\"Nominal\", \"Ordinal\", \"Interval\", \"Ratio\"]], [\"Hair colour (black, brown) is an example of which scale?\", [\"Nominal\", \"Ordinal\", \"Interval\", \"Ratio\"]], [\"Your class rank is an example of which scale?\", [\"Nominal\", \"Ordinal\", \"Interval\", \"Ratio\"]], [\"Temperature in °C is measured on which scale?\", [\"Ratio\", \"Nominal\", \"Interval\", \"Ordinal\"]], [\"How many fundamental physical quantities are there?\", [\"5\", \"7\", \"6\", \"9\"]], [\"The SI unit of mass is the:\", [\"gram\", \"tonne\", \"kilogram\", \"quintal\"]], [\"The second is defined using the radiation of which atom?\", [\"Cesium-133\", \"Hydrogen\", \"Uranium\", \"Carbon-12\"]], [\"The SI unit of temperature is the:\", [\"Celsius\", \"Fahrenheit\", \"Joule\", \"Kelvin\"]], [\"Which is NOT a fundamental quantity?\", [\"Mass\", \"Speed\", \"Time\", \"Length\"]], [\"Mass is measured with a:\", [\"ruler\", \"stopwatch\", \"beam balance\", \"thermometer\"]], [\"3.24 × 10³ is equal to:\", [\"3240\", \"324\", \"32 400\", \"0.00324\"]], [\"Significant figures in 2000.0:\", [\"1\", \"5\", \"4\", \"2\"]], [\"The prefix for 10⁻⁶ is:\", [\"milli\", \"nano\", \"micro\", \"pico\"]], [\"A nanosecond is:\", [\"10⁹ s\", \"10⁻⁹ s\", \"10⁻⁶ s\", \"10⁻¹² s\"]], [\"1 kilogram equals:\", [\"100 g\", \"10 g\", \"0.001 g\", \"1000 g\"]], [\"200 m expressed in kilometers is:\", [\"2 km\", \"0.02 km\", \"0.2 km\", \"20 km\"]], [\"How many seconds are in 2 hours?\", [\"3600 s\", \"7200 s\", \"120 s\", \"720 s\"]], [\"Which of these is a vector quantity?\", [\"Mass\", \"Time\", \"Force\", \"Energy\"]], [\"Which of these is a scalar quantity?\", [\"Displacement\", \"Force\", \"Acceleration\", \"Mass\"]], [\"Which is a derived SI unit?\", [\"Newton\", \"Kelvin\", \"Ampere\", \"Mole\"]], [\"The unit of force (newton) in base units is:\", [\"kg·m²/s²\", \"kg·m/s²\", \"kg/(m·s²)\", \"m/s²\"]], [\"Density is mass divided by:\", [\"area\", \"volume\", \"time\", \"length\"]], [\"One quintal equals:\", [\"100 kg\", \"10 kg\", \"1000 kg\", \"50 kg\"]], [\"Which is a correct laboratory safety rule?\", [\"Taste chemicals gently\", \"Work alone\", \"Wear open sandals\", \"Report all accidents to the teacher\"]], [\"Measurement is best described as:\", [\"counting objects\", \"comparing an unknown quantity with a known unit\", \"guessing a size\", \"drawing a scale\"]]], \"ma\": {\"L\": [\"Acoustics\", \"Optics\", \"Thermodynamics\", \"Nuclear physics\", \"Astrophysics\", \"Electromagnetism\", \"Mechanics\"], \"R\": [\"Behavior and properties of light\", \"Motion of objects, with or without force\", \"Sound: its production, transmission and effects\", \"Electric fields and magnetic fields\", \"Thermal energy and heat transfer\", \"Astronomical objects and phenomena\", \"Structure and reactions of atomic nuclei\"]}, \"mb\": {\"L\": [\"Length\", \"Mass\", \"Time\", \"Temperature\", \"Force\"], \"R\": [\"newton (N)\", \"kilogram (kg)\", \"kelvin (K)\", \"second (s)\", \"meter (m)\"]}, \"calc\": [{\"t\": \"Convert 0.831 nm to:\", \"h\": \"Type the number, e.g. 0.002 or 2×10^-3 (or 2e-3).\", \"items\": [\"a. micrometer (µm)\", \"b. millimeter (mm)\", \"c. picometer (pm)\", \"d. decimeter (dm)\"]}, {\"t\": \"Write the following in scientific notation:\", \"h\": \"Type like 8.5×10^-10 (or 8.5e-10). Use a number from 1 to 9.99… times a power of 10.\", \"items\" ames spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }\n  .card-inner{ padding:26px 22px 22px 28px; position:relative; }\n\n  @keyframes cardIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }\n  .card.animate{ animation:cardIn .35s ease; }\n\n  .question-text{ font-size:16.5px; color:var(--ink); margin-bottom:12px; line-height:1.5; }\n  .exp-box{ margin-top:6px; padding:12px 14px; background:var(--paper-2); border-left:4px solid var(--amber); border-radius:6px; font-size:13.5px; line-height:1.5; color:var(--ink); }\n  .formula-display{ font-family:'IBM Plex Mono', monospace; font-size:28px; font-weight:600; color:var(--ink); text-align:center; padding:22px 10px; background:var(--paper-2); border:1.5px dashed var(--border); border-radius:6px; margin-bottom:6px; letter-spacing:.01em; transition:border-color .3s ease; }\n\n  /* ---------- Options ---------- */\n  .options{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }\n  .option{ display:flex; align-items:center; gap:12px; text-align:left; border:1.5px solid var(--border); background:#fff; border-radius:8px; padding:13px 14px; font-size:15px; color:var(--ink); cursor:pointer; font-family:'IBM Plex Mono', monospace; transition:border-color .15s ease, background .15s ease, transform .08s ease, box-shadow .15s ease; min-height:48px; }\n  .option:hover{ border-color:var(--blue); box-shadow:0 4px 12px -6px rgba(43,69,112,.35); }\n  .option:active{ transform:scale(.985); }\n  .option .letter{ flex:0 0 auto; width:24px; height:24px; border-radius:50%; background:var(--paper-2); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; transition:background .15s ease, color .15s ease; }\n  .option.selected{ border-color:var(--blue); background:#EEF2F8; }\n  .option.selected .letter{ background:var(--blue); color:#fff; }\n\n  /* ---------- Review-mode options (read-only, color-coded) ---------- */\n  .option.review-option{ cursor:default; }\n  .option.review-option:hover{ border-color:var(--border); box-shadow:none; }\n  .option.review-option.correct-answer{ border-color:var(--correct); background:var(--correct-bg); }\n  .option.review-option.correct-answer .letter{ background:var(--correct); color:#fff; }\n  .option.review-option.wrong-answer{ border-color:var(--incorrect); background:var(--incorrect-bg); }\n  .option.review-option.wrong-answer .letter{ background:var(--incorrect); color:#fff; }\n  .option.review-option.neutral{ opacity:.5; }\n\n  /* ---------- Controls ---------- */\n  .controls{ display:flex; flex-direction:column; gap:12px; }\n  .controls-info{ display:flex; justify-content:space-between; align-items:center; }\n  .score-chip{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink-soft); }\n  .btn-link{ background:none; border:none; color:var(--blue); font-family:'IBM Plex Mono', monospace; font-size:12.5px; text-decoration:underline; cursor:pointer; padding:4px; }\n  .controls-nav{ display:flex; gap:10px; }\n  .btn{ font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif; font-size:14.5px; font-weight:600; background:var(--blue); color:#fff; border:none; border-radius:8px; padding:12px 22px; cursor:pointer; min-height:46px; flex:1; transition:transform .08s ease, box-shadow .15s ease; }\n  .btn:hover{ box-shadow:0 6px 16px -8px rgba(43,69,112,.5); }\n  .btn:active{ transform:scale(.97); }\n  .btn:disabled{ background:var(--border); color:var(--ink-soft); cursor:not-allowed; box-shadow:none; }\n  .btn-ghost{ background:transparent; color:var(--blue); border:1.5px solid var(--blue); }\n  .btn-ghost:disabled{ border-color:var(--border); }\n  .btn-full{ width:100%; flex:none; }\n\n  .submit-confirm{ background:var(--incorrect-bg); border:1px solid var(--incorrect); border-radius:8px; padding:14px; margin-bottom:12px; display:none; }\n  .submit-confirm.show{ display:block; }\n  .submit-confirm p{ margin:0 0 12px; font-size:13.5px; color:var(--incorrect); }\n  .submit-confirm .row{ display:flex; gap:10px; }\n\n  /* ---------- Panels ---------- */\n  .panel{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:30px 24px; text-align:center; box-shadow:0 10px 24px -14px rgba(31,42,55,0.28); position:relative; overflow:hidden; }\n  .panel p{ color:var(--ink-soft); font-size:14.5px; line-height:1.6; margin:14px 0 22px; }\n  .field-label{ text-align:left; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; font-family:'IBM Plex Mono', monospace; letter-spacing:.04em; }\n  .input-field{ width:100%; padding:12px 14px; font-size:15px; border:1.5px solid var(--border); border-radius:8px; margin-bottom:16px; font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif; background:var(--paper-2); color:var(--ink); transition:border-color .15s ease, background .15s ease; }\n\n  .password-wrap{ position:relative; margin-bottom:16px; }\n  .password-wrap .input-field{ margin-bottom:0; padding-right:46px; }\n  .password-toggle{ position:absolute; right:4px; top:0; bottom:0; width:38px; display:flex; align-items:center; justify-content:center; background:none; border:none; cursor:pointer; color:var(--ink-soft); padding:0; transition:color .15s ease; }\n  .password-toggle:hover{ color:var(--blue); }\n  .password-toggle svg{ width:19px; height:19px; display:block; }\n  .input-field:focus{ outline:none; border-color:var(--blue); background:#fff; }\n  .error-msg{ color:var(--incorrect); font-size:13px; margin:-6px 0 14px; text-align:left; display:none; }\n  .error-msg.show{ display:block; }\n  .hint{ font-size:12px; color:var(--ink-soft); margin-top:18px; line-height:1.5; }\n\n  .score-ring-wrap{ position:relative; width:150px; height:150px; margin:8px auto 4px; }\n  .ring-bg{ fill:none; stroke:var(--paper-2); stroke-width:10; }\n  .ring-fg{ fill:none; stroke:var(--amber); stroke-width:10; stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%; stroke-dasharray:377; stroke-dashoffset:377; transition:stroke-dashoffset 1.1s cubic-bezier(.22,.9,.3,1); }\n  .score-ring-label{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }\n  .score-ring-label .num{ font-family:'IBM Plex Mono', monospace; font-size:34px; font-weight:700; color:var(--blue); }\n  .score-ring-label .denom{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); }\n  .score-message{ font-size:14.5px; color:var(--ink-soft); margin:10px 0 20px; line-height:1.5; }\n  .timeup-note{ font-size:13px; color:var(--incorrect); background:var(--incorrect-bg); border-radius:6px; padding:8px 12px; margin-bottom:10px; display:none; }\n  .timeup-note.show{ display:block; }\n\n  .review-toggle{ width:100%; font-family:'IBM Plex Mono', monospace; font-size:12.5px; font-weight:600; background:var(--paper-2); border:1px solid var(--border); color:var(--blue); padding:11px; border-radius:8px; cursor:pointer; margin-bottom:10px; text-align:left; }\n  .review-list{ display:none; max-height:340px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; margin-bottom:18px; text-align:left; }\n  .review-list.open{ display:block; }\n  .review-row{ display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-bottom:1px solid var(--paper-2); border-left:4px solid var(--border); font-size:12.5px; cursor:pointer; transition:background .15s ease; }\n  .review-row:hover{ background:var(--paper-2); }\n  .review-row:active{ background:#EEF2F8; }\n  .review-row:last-child{ border-bottom:none; }\n  .review-row.correct{ border-left-color:var(--correct); }\n  .review-row.incorrect{ border-left-color:var(--incorrect); }\n  .review-row.unanswered{ border-left-color:var(--ink-soft); }\n  .review-icon{ flex:0 0 auto; font-weight:700; }\n  .review-row.correct .review-icon{ color:var(--correct); }\n  .review-row.incorrect .review-icon{ color:var(--incorrect); }\n  .review-row.unanswered .review-icon{ color:var(--ink-soft); }\n  .review-body{ flex:1; }\n  .review-q{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink); margin-bottom:2px; display:flex; justify-content:space-between; gap:8px; }\n  .review-q .chevron{ color:var(--ink-soft); flex:0 0 auto; }\n  .review-ans{ color:var(--ink-soft); font-size:11.5px; line-height:1.5; }\n\n  .confetti-container{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50; }\n  .confetti-piece{ position:absolute; top:-10px; width:8px; height:8px; border-radius:2px; opacity:.9; animation-name:confettiFall; animation-timing-function:ease-in; animation-fill-mode:forwards; }\n  @keyframes confettiFall{ 0%{ transform:translateY(0) rotate(0deg); opacity:.9;} 100%{ transform:translateY(105vh) rotate(380deg); opacity:0;} }\n\n  @media (max-width:380px){\n    .formula-display{ font-size:22px; padding:18px 6px; }\n    .card-inner{ padding:22px 16px 18px 22px; }\n  }\n  @media (prefers-reduced-motion: reduce){\n    *{ animation:none !important; transition:none !important; }\n  }\n\n  /* ---------- Bold text override ---------- */\n  .question-text, .option, .option span, .exp-box, .review-q, .review-ans, .panel p, .score-message{ font-weight:700; }\n  .exp-box b{ font-weight:800; }\n<\/style>\n<\/head>\n<body>\n<div class=\"credit-tag\">Birhanu Ba<\/div>\n<div class=\"app\">\n\n  <div class=\"header\">\n   \n    <h1>UNIT 3 : <span style=\"color:#2E8B3E;\">MOTION IN A STRAIGHT LINE<\/span><\/h1>\n  <\/div>\n    \n     <span style=\"color: red;\"><b>Distance, Displacement, Speed, Velocity &amp; Time<\/b><\/span>\n  <\!-- LOGIN SCREEN -->\n  <div class=\"panel\" id=\"loginScreen\">\n    <h2 style=\"color:var(--blue); font-size:19px;\">Enter to Begin<\/h2>\n    <p>Type your name and the access code given by your teacher.<\/p>\n    <div class=\"field-label\"><b><span style=\"color:brown;\">Student name<\/span><\/b><\/div>\n    <input type=\"text\" class=\"input-field\" id=\"nameInput\" autocomplete=\"off\">\n    <div class=\"field-label\"><b><span style=\"color:brown;\">Access code<\/span><\/b><\/div>\n    <div class=\"password-wrap\">\n      <input type=\"password\" class=\"input-field\" id=\"codeInput\" placeholder=\"\" autocomplete=\"off\">\n      <button type=\"button\" class=\"password-toggle\" id=\"toggleCodeVisibility\" aria-label=\"Show access code\">\n        <svg id=\"eyeIcon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"><\/path>\n          <circle cx=\"12\" cy=\"12\" r=\"3\"><\/circle>\n        <\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"error-msg\" id=\"loginError\"><\/div>\n    <button class=\"btn btn-full\" id=\"loginBtn\">Continue<\/button>\n    <div class=\"hint\">Code:  <span style=\"color:blue;\"><b> G9P<\/b><\/span><\/div>\n  <\/div>\n\n  <\!-- START SCREEN -->\n  <div class=\"panel\" id=\"startScreen\" style=\"display:none;\">\n    <h2 style=\"color:var(--blue); font-size:19px;\" id=\"welcomeMsg\">85 Multiple Choice Questions</h2>\n    <p>Read each question carefully, think critically, and select your own answers. You may navigate between questions at any time, but your answers will remain hidden until submission. <strong>Time limit: 1:30 (90 minutes).</strong> The examination will be automatically submitted when the time is up.<\/p>\n    <button class=\"btn btn-full\" id=\"startBtn\">Start Quiz<\/button>\n  <\/div>\n\n  <\!-- QUIZ SCREEN -->\n  <div id=\"quizScreen\" style=\"display:none;\">\n    <div class=\"time-bar-track\"><div class=\"time-bar-fill\" id=\"timeBarFill\"><\/div><\/div>\n    <div class=\"timer-row\">\n      <span class=\"qcount\" id=\"qcount\">Question 1 / 85<\/span>\n      <span class=\"timer\" id=\"timerDisplay\">⏱ 1:30:00<\/span>\n    <\/div>\n    <div class=\"qprogress-track\"><div class=\"qprogress-fill\" id=\"qProgressFill\"><\/div><\/div>\n    <button class=\"jump-toggle\" id=\"jumpToggle\">▦ Jump to question<\/button>\n    <div class=\"jump-panel\" id=\"jumpPanel\"><div class=\"jump-grid\" id=\"jumpGrid\"><\/div><\/div>\n\n    <div class=\"card\">\n      <div class=\"card-tab\" id=\"cardTab\"><\/div>\n      <svg class=\"card-watermark\" id=\"cardWatermark\" viewBox=\"0 0 100 100\" width=\"170\" height=\"170\">\n        <g stroke=\"currentColor\" fill=\"none\" stroke-width=\"2.2\">\n          <ellipse cx=\"50\" cy=\"50\" rx=\"42\" ry=\"16\"/>\n          <ellipse cx=\"50\" cy=\"50\" rx=\"42\" ry=\"16\" transform=\"rotate(60 50 50)\"/>\n          <ellipse cx=\"50\" cy=\"50\" rx=\"42\" ry=\"16\" transform=\"rotate(120 50 50)\"/>\n        <\/g>\n        <circle cx=\"50\" cy=\"50\" r=\"4\" fill=\"currentColor\"/>\n      <\/svg>\n      <div class=\"card-inner\">\n        <div class=\"question-text\" id=\"questionText\" style=\"display:none;\"><\/div>\n        <div class=\"formula-display\" id=\"formulaDisplay\" style=\"display:none;\"><\/div>\n        <div class=\"options\" id=\"optionsList\"><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"submit-confirm\" id=\"submitConfirm\">\n      <p id=\"submitConfirmText\"><\/p>\n      <div class=\"row\">\n        <button class=\"btn\" id=\"confirmSubmitBtn\">Submit Anyway<\/button>\n        <button class=\"btn btn-ghost\" id=\"cancelSubmitBtn\">Keep Answering<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"controls\" id=\"mainControls\">\n      <div class=\"controls-info\">\n        <span class=\"score-chip\" id=\"answeredChip\">Answered: 0 / 85<\/span>\n        <button class=\"btn-link\" id=\"submitBtn\">Submit Quiz<\/button>\n      <\/div>\n      <div class=\"controls-nav\">\n        <button class=\"btn btn-ghost\" id=\"prevBtn\" disabled>Previous<\/button>\n        <button class=\"btn\" id=\"nextBtn\">Next<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"controls\" id=\"reviewControls\" style=\"display:none;\">\n      <div class=\"controls-info\">\n        <span class=\"score-chip\" id=\"reviewStatusChip\"><\/span>\n        <button class=\"btn-link\" id=\"backToResultsBtn\">← Back to Results<\/button>\n      <\/div>\n      <div class=\"controls-nav\">\n        <button class=\"btn btn-ghost\" id=\"reviewPrevBtn\">Previous<\/button>\n        <button class=\"btn\" id=\"reviewNextBtn\">Next<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <\!-- END SCREEN -->\n  <div class=\"panel\" id=\"endScreen\" style=\"display:none;\">\n    <div class=\"eyebrow\" style=\"text-align:left; margin-bottom:6px;\">Results<\/div>\n    <h2 style=\"color:var(--blue); font-size:20px;\" id=\"endTitle\">Quiz Complete<\/h2>\n    <div class=\"timeup-note\" id=\"timeupNote\"><\/div>\n\n    <div class=\"score-ring-wrap\">\n      <svg width=\"150\" height=\"150\" viewBox=\"0 0 150 150\">\n        <circle class=\"ring-bg\" cx=\"75\" cy=\"75\" r=\"60\"/>\n        <circle class=\"ring-fg\" id=\"scoreRingFg\" cx=\"75\" cy=\"75\" r=\"60\"/>\n      <\/svg>\n      <div class=\"score-ring-label\">\n        <div class=\"num\" id=\"finalScore\">0<\/div>\n        <div class=\"denom\" id=\"finalDenom\">out of 85<\/div>\n      <\/div>\n    <\/div>\n    <p class=\"score-message\" id=\"scoreMessage\"><\/p>\n\n    <button class=\"review-toggle\" id=\"reviewToggle\">Review Your Answers ▾<\/button>\n    <div class=\"review-list\" id=\"reviewList\"><\/div>\n\n    <button class=\"btn btn-ghost btn-full\" id=\"restartBtn\">Restart Quiz<\/button>\n  <\/div>\n\n<\/div>\n\n<script>\nconst ACCESS_CODE = \"G9P\"; // change this and share with students\nconst TOTAL_TIME_SECONDS = 90 * 60; // 1 hour 30 minutes — adjust as needed\nconst ACCENT_PALETTE = [\"#2F8F8B\",\"#7B5EA7\",\"#C8932A\",\"#C1583A\",\"#3D7A52\",\"#2B4570\"];\n\nconst QUESTIONS = [\n{\n\"question\": \"A person walks 200 m north in 40 s. What is their average velocity?\",\n\"options\": [\n\"5 m/s south\",\n\"5 m/s north\",\n\"0.2 m/s north\",\n\"8 m/s north\"\n],\n\"correct\": 1,\n\"exp\": \"v = Δx/Δt = 200 ÷ 40 = 5 m/s north.\"\n},\n{\n\"question\": \"How is instantaneous velocity different from average velocity?\",\n\"options\": [\n\"Instantaneous velocity is the velocity at one exact moment; average velocity is total displacement ÷ total time\",\n\"Instantaneous velocity uses total distance; average velocity uses displacement\",\n\"They are always equal for any motion\",\n\"Average velocity is measured at one moment; instantaneous velocity over a whole trip\"\n],\n\"correct\": 0,\n\"exp\": \"Average velocity = total displacement ÷ total time. Instantaneous velocity is the velocity at a single instant (the limit of Δx/Δt as Δt → 0).\"\n},\n{\n\"question\": \"A car travels 150 km east in 2 h and then 50 km west in 1 h. What is its average velocity for the entire trip?\",\n\"options\": [\n\"66.7 km/h east\",\n\"100 km/h east\",\n\"33.3 km/h west\",\n\"33.3 km/h east\"\n],\n\"correct\": 3,\n\"exp\": \"Displacement = 150 − 50 = 100 km east. Time = 3 h. v = 100/3 ≈ 33.3 km/h east.\"\n},\n{\n\"question\": \"A cyclist's speedometer shows 20 km/h at a specific moment. What is this speed called?\",\n\"options\": [\n\"Average speed\",\n\"Average velocity\",\n\"Instantaneous speed\",\n\"Displacement\"\n],\n\"correct\": 2,\n\"exp\": \"A speedometer reads the speed at one instant: instantaneous speed.\"\n},\n{\n\"question\": \"A runner completes a 400 m lap in 60 s and finishes at the starting point. What is their average velocity?\",\n\"options\": [\n\"6.67 m/s\",\n\"0 m/s\",\n\"400 m/s\",\n\"60 m/s\"\n],\n\"correct\": 1,\n\"exp\": \"Displacement = 0 (start = finish), so average velocity = 0. (Average speed would be 400/60 ≈ 6.67 m/s.)\"\n},\n{\n\"question\": \"A vehicle moves 100 m east in 10 s and then 50 m south in 5 s. What is the magnitude of the average velocity for the whole journey?\",\n\"options\": [\n\"7.45 m/s\",\n\"10 m/s\",\n\"11.2 m/s\",\n\"5 m/s\"\n],\n\"correct\": 0,\n\"exp\": \"Displacement = √(100² + 50²) ≈ 111.8 m. Time = 15 s. v ≈ 7.45 m/s.\"\n},\n{\n\"question\": \"A vehicle moves 100 m east in 10 s and then 50 m south in 5 s. In what direction is the average velocity for the whole journey?\",\n\"options\": [\n\"63.4° south of east\",\n\"26.6° north of east\",\n\"45° south of east\",\n\"26.6° south of east\"\n],\n\"correct\": 3,\n\"exp\": \"tan θ = 50/100, so θ = tan⁻¹(0.5) ≈ 26.6° south of east.\"\n},\n{\n\"question\": \"A runner jogs 60 m due East along a straight track in 10.0 s, then jogs 20 m due West in 5.0 s. What is her total distance traveled?\",\n\"options\": [\n\"40 m\",\n\"60 m\",\n\"80 m\",\n\"20 m\"\n],\n\"correct\": 2,\n\"exp\": \"Distance = 60 + 20 = 80 m.\"\n},\n{\n\"question\": \"A runner jogs 60 m due East along a straight track in 10.0 s, then jogs 20 m due West in 5.0 s. What is her net displacement?\",\n\"options\": [\n\"80 m east\",\n\"40 m east\",\n\"40 m west\",\n\"60 m east\"\n],\n\"correct\": 1,\n\"exp\": \"Displacement = 60 − 20 = 40 m east.\"\n},\n{\n\"question\": \"A runner jogs 60 m due East along a straight track in 10.0 s, then jogs 20 m due West in 5.0 s. What is her average speed for the entire trip?\",\n\"options\": [\n\"5.33 m/s\",\n\"2.67 m/s\",\n\"8 m/s\",\n\"4 m/s\"\n],\n\"correct\": 0,\n\"exp\": \"Average speed = 80 m ÷ 15 s ≈ 5.33 m/s.\"\n},\n{\n\"question\": \"A runner jogs 60 m due East along a straight track in 10.0 s, then jogs 20 m due West in 5.0 s. What is her average velocity for the entire trip?\",\n\"options\": [\n\"5.33 m/s east\",\n\"4 m/s east\",\n\"2.67 m/s west\",\n\"2.67 m/s east\"\n],\n\"correct\": 3,\n\"exp\": \"Average velocity = 40 m ÷ 15 s ≈ 2.67 m/s east.\"\n},\n{\n\"question\": \"A car travels a distance of 240 m in 12 s. Calculate its speed.\",\n\"options\": [\n\"0.05 m/s\",\n\"28.8 m/s\",\n\"20 m/s\",\n\"40 m/s\"\n],\n\"correct\": 2,\n\"exp\": \"v = d/t = 240 ÷ 12 = 20 m/s.\"\n},\n{\n\"question\": \"A student walks 300 m in 60 s and then runs 200 m in 40 s. Calculate the average speed.\",\n\"options\": [\n\"10 m/s\",\n\"5 m/s\",\n\"8.3 m/s\",\n\"0.2 m/s\"\n],\n\"correct\": 1,\n\"exp\": \"Total distance 500 m ÷ total time 100 s = 5 m/s.\"\n},\n{\n\"question\": \"A car travels 120 km in 2 hours and another 180 km in 3 hours. Calculate its average speed for the entire journey.\",\n\"options\": [\n\"60 km/h\",\n\"30 km/h\",\n\"120 km/h\",\n\"150 km/h\"\n],\n\"correct\": 0,\n\"exp\": \"300 km ÷ 5 h = 60 km/h.\"\n},\n{\n\"question\": \"A student walks 100 m east and then 40 m west in 20 s. Calculate the total distance.\",\n\"options\": [\n\"60 m\",\n\"100 m\",\n\"40 m\",\n\"140 m\"\n],\n\"correct\": 3,\n\"exp\": \"Distance = 100 + 40 = 140 m.\"\n},\n{\n\"question\": \"A student walks 100 m east and then 40 m west in 20 s. Calculate the displacement.\",\n\"options\": [\n\"140 m east\",\n\"40 m east\",\n\"60 m east\",\n\"60 m west\"\n],\n\"correct\": 2,\n\"exp\": \"Displacement = 100 − 40 = 60 m east.\"\n},\n{\n\"question\": \"A student walks 100 m east and then 40 m west in 20 s. Calculate the average speed.\",\n\"options\": [\n\"3 m/s\",\n\"7 m/s\",\n\"5 m/s\",\n\"2 m/s\"\n],\n\"correct\": 1,\n\"exp\": \"Speed = 140 ÷ 20 = 7 m/s.\"\n},\n{\n\"question\": \"A student walks 100 m east and then 40 m west in 20 s. Calculate the average velocity.\",\n\"options\": [\n\"3 m/s east\",\n\"7 m/s east\",\n\"5 m/s east\",\n\"2 m/s east\"\n],\n\"correct\": 0,\n\"exp\": \"Velocity = 60 ÷ 20 = 3 m/s east.\"\n},\n{\n\"question\": \"A student walks 50 m east and then returns 50 m west in 25 s. Calculate the distance.\",\n\"options\": [\n\"0 m\",\n\"50 m\",\n\"25 m\",\n\"100 m\"\n],\n\"correct\": 3,\n\"exp\": \"Distance = 50 + 50 = 100 m.\"\n},\n{\n\"question\": \"A student walks 50 m east and then returns 50 m west in 25 s. Calculate the displacement.\",\n\"options\": [\n\"50 m\",\n\"100 m\",\n\"0 m\",\n\"25 m\"\n],\n\"correct\": 2,\n\"exp\": \"The student ends where they started, so displacement = 0.\"\n},\n{\n\"question\": \"A student walks 50 m east and then returns 50 m west in 25 s. Calculate the average speed.\",\n\"options\": [\n\"2 m/s\",\n\"4 m/s\",\n\"0 m/s\",\n\"1 m/s\"\n],\n\"correct\": 1,\n\"exp\": \"Speed = 100 ÷ 25 = 4 m/s.\"\n},\n{\n\"question\": \"A student walks 50 m east and then returns 50 m west in 25 s. Calculate the average velocity.\",\n\"options\": [\n\"0 m/s\",\n\"4 m/s\",\n\"2 m/s\",\n\"100 m/s\"\n],\n\"correct\": 0,\n\"exp\": \"Velocity = displacement ÷ time = 0 ÷ 25 = 0.\"\n},\n{\n\"question\": \"A car travels 60 km north in 1 h and then 80 km south in 2 h. Calculate the total distance.\",\n\"options\": [\n\"20 km\",\n\"80 km\",\n\"60 km\",\n\"140 km\"\n],\n\"correct\": 3,\n\"exp\": \"Distance = 60 + 80 = 140 km.\"\n},\n{\n\"question\": \"A car travels 60 km north in 1 h and then 80 km south in 2 h. Calculate the displacement.\",\n\"options\": [\n\"140 km south\",\n\"20 km north\",\n\"20 km south\",\n\"60 km south\"\n],\n\"correct\": 2,\n\"exp\": \"Displacement = 80 − 60 = 20 km south.\"\n},\n{\n\"question\": \"A car travels 60 km north in 1 h and then 80 km south in 2 h. Calculate the average speed.\",\n\"options\": [\n\"6.67 km/h\",\n\"46.7 km/h\",\n\"70 km/h\",\n\"20 km/h\"\n],\n\"correct\": 1,\n\"exp\": \"Speed = 140 km ÷ 3 h ≈ 46.7 km/h.\"\n},\n{\n\"question\": \"A car travels 60 km north in 1 h and then 80 km south in 2 h. Calculate the average velocity.\",\n\"options\": [\n\"6.67 km/h south\",\n\"46.7 km/h south\",\n\"10 km/h south\",\n\"6.67 km/h north\"\n],\n\"correct\": 0,\n\"exp\": \"Velocity = 20 km ÷ 3 h ≈ 6.67 km/h south.\"\n},\n{\n\"question\": \"A car travels at 72 km/h. Convert its speed into m/s.\",\n\"options\": [\n\"259.2 m/s\",\n\"72 m/s\",\n\"200 m/s\",\n\"20 m/s\"\n],\n\"correct\": 3,\n\"exp\": \"Divide by 3.6: 72 ÷ 3.6 = 20 m/s.\"\n},\n{\n\"question\": \"A motorcycle moves at 15 m/s. Convert its speed into km/h.\",\n\"options\": [\n\"4.17 km/h\",\n\"15 km/h\",\n\"54 km/h\",\n\"150 km/h\"\n],\n\"correct\": 2,\n\"exp\": \"Multiply by 3.6: 15 × 3.6 = 54 km/h.\"\n},\n{\n\"question\": \"A car travels the first 100 km at 40 km/h and the next 100 km at 60 km/h. Find the average speed for the entire journey.\",\n\"options\": [\n\"50 km/h\",\n\"48 km/h\",\n\"60 km/h\",\n\"40 km/h\"\n],\n\"correct\": 1,\n\"exp\": \"t₁ = 100/40 = 2.5 h, t₂ = 100/60 ≈ 1.667 h. Total 200 km ÷ 4.167 h = 48 km/h (not 50, because more time is spent at the slower speed).\"\n},\n{\n\"question\": \"A student completes one full round of a circular track of radius 7 m in 22 s (use π = 22/7). Calculate the distance travelled.\",\n\"options\": [\n\"44 m\",\n\"0 m\",\n\"22 m\",\n\"7 m\"\n],\n\"correct\": 0,\n\"exp\": \"Distance = 2πr = 2 × (22/7) × 7 = 44 m.\"\n},\n{\n\"question\": \"A student completes one full round of a circular track of radius 7 m in 22 s (use π = 22/7). Calculate the displacement.\",\n\"options\": [\n\"44 m\",\n\"14 m\",\n\"22 m\",\n\"0 m\"\n],\n\"correct\": 3,\n\"exp\": \"One full round ends at the starting point, so displacement = 0.\"\n},\n{\n\"question\": \"A student completes one full round of a circular track of radius 7 m in 22 s (use π = 22/7). Calculate the average speed.\",\n\"options\": [\n\"0 m/s\",\n\"3.14 m/s\",\n\"2 m/s\",\n\"0.5 m/s\"\n],\n\"correct\": 2,\n\"exp\": \"Speed = 44 ÷ 22 = 2 m/s.\"\n},\n{\n\"question\": \"A student completes one full round of a circular track of radius 7 m in 22 s (use π = 22/7). Calculate the average velocity.\",\n\"options\": [\n\"2 m/s\",\n\"0 m/s\",\n\"44 m/s\",\n\"7 m/s\"\n],\n\"correct\": 1,\n\"exp\": \"Velocity = 0 ÷ 22 = 0.\"\n},\n{\n\"question\": \"A car moves at a constant speed of 15 m/s for 20 s. Calculate the distance travelled.\",\n\"options\": [\n\"300 m\",\n\"0.75 m\",\n\"35 m\",\n\"30 m\"\n],\n\"correct\": 0,\n\"exp\": \"d = vt = 15 × 20 = 300 m.\"\n},\n{\n\"question\": \"A train travels 600 m at a constant speed of 20 m/s. Calculate the time taken.\",\n\"options\": [\n\"120 s\",\n\"0.033 s\",\n\"12 000 s\",\n\"30 s\"\n],\n\"correct\": 3,\n\"exp\": \"t = d/v = 600 ÷ 20 = 30 s.\"\n},\n{\n\"question\": \"A bus travels at 72 km/h for 2.5 hours. Calculate the distance travelled.\",\n\"options\": [\n\"28.8 km\",\n\"74.5 km\",\n\"180 km\",\n\"144 km\"\n],\n\"correct\": 2,\n\"exp\": \"d = 72 × 2.5 = 180 km.\"\n},\n{\n\"question\": \"A vehicle moves at 54 km/h for 40 seconds. Calculate the distance travelled in metres.\",\n\"options\": [\n\"2160 m\",\n\"600 m\",\n\"60 m\",\n\"360 m\"\n],\n\"correct\": 1,\n\"exp\": \"54 km/h = 15 m/s. d = 15 × 40 = 600 m.\"\n},\n{\n\"question\": \"An object moves at 8 m/s for 10 s and then at 12 m/s for 5 s. Calculate its total distance.\",\n\"options\": [\n\"140 m\",\n\"100 m\",\n\"60 m\",\n\"200 m\"\n],\n\"correct\": 0,\n\"exp\": \"d₁ = 8 × 10 = 80 m, d₂ = 12 × 5 = 60 m. Total = 140 m.\"\n},\n{\n\"question\": \"An object moves at 8 m/s for 10 s and then at 12 m/s for 5 s. Calculate its average speed.\",\n\"options\": [\n\"10 m/s\",\n\"12 m/s\",\n\"8 m/s\",\n\"9.33 m/s\"\n],\n\"correct\": 3,\n\"exp\": \"Average speed = 140 m ÷ 15 s ≈ 9.33 m/s (not 10, the simple mean of the two speeds).\"\n},\n{\n\"question\": \"A cyclist travels 30 km North, then turns around and travels 30 km South, returning home. If the whole trip took 2 hours, what was their average speed?\",\n\"options\": [\n\"0 km/h\",\n\"60 km/h\",\n\"30 km/h\",\n\"15 km/h\"\n],\n\"correct\": 2,\n\"exp\": \"Total distance = 60 km (the displacement of 0 would give velocity). Speed = 60 ÷ 2 = 30 km/h.\"\n},\n{\n\"question\": \"A train travels at a constant 90 km/h. How long does it take to cover 225 km?\",\n\"options\": [\n\"0.4 h\",\n\"2.5 h\",\n\"1.5 h\",\n\"4 h\"\n],\n\"correct\": 1,\n\"exp\": \"t = d/v = 225 ÷ 90 = 2.5 h.\"\n},\n{\n\"question\": \"A cyclist rides at a constant 18 km/h for 20 minutes. How far does the cyclist travel?\",\n\"options\": [\n\"6 km\",\n\"360 km\",\n\"0.9 km\",\n\"18 km\"\n],\n\"correct\": 0,\n\"exp\": \"20 min = 1/3 h. d = 18 × 1/3 = 6 km.\"\n},\n{\n\"question\": \"A swimmer swims 50 m down a pool in 25 s and returns 50 m to the start in 20 s. Calculate the average speed.\",\n\"options\": [\n\"2.25 m/s\",\n\"4.44 m/s\",\n\"0 m/s\",\n\"2.22 m/s\"\n],\n\"correct\": 3,\n\"exp\": \"Distance = 100 m, time = 45 s. Speed = 100/45 ≈ 2.22 m/s.\"\n},\n{\n\"question\": \"A swimmer swims 50 m down a pool in 25 s and returns 50 m to the start in 20 s. Calculate the average velocity.\",\n\"options\": [\n\"2.22 m/s\",\n\"4.44 m/s\",\n\"0 m/s\",\n\"1.11 m/s\"\n],\n\"correct\": 2,\n\"exp\": \"The swimmer ends at the start, so displacement = 0 and average velocity = 0.\"\n},\n{\n\"question\": \"A bus travels 90 km at 45 km/h, rests for 30 minutes, then travels another 60 km in 1 h. Calculate the total time.\",\n\"options\": [\n\"3 h\",\n\"3.5 h\",\n\"2.5 h\",\n\"4.5 h\"\n],\n\"correct\": 1,\n\"exp\": \"Driving time on the first leg = 90/45 = 2 h. Total = 2 + 0.5 + 1 = 3.5 h.\"\n},\n{\n\"question\": \"A bus travels 90 km at 45 km/h, rests for 30 minutes, then travels another 60 km in 1 h. Calculate the average speed including the rest.\",\n\"options\": [\n\"42.9 km/h\",\n\"50 km/h\",\n\"52.5 km/h\",\n\"37.5 km/h\"\n],\n\"correct\": 0,\n\"exp\": \"Total distance = 150 km. Average speed = 150 ÷ 3.5 ≈ 42.9 km/h.\"\n},\n{\n\"question\": \"If a car travels 120 kilometers in 2 hours, what is its average speed?\",\n\"options\": [\n\"240 km/h\",\n\"30 km/h\",\n\"118 km/h\",\n\"60 km/h\"\n],\n\"correct\": 3,\n\"exp\": \"Average speed = 120 km ÷ 2 h = 60 km/h.\"\n},\n{\n\"question\": \"How does instantaneous speed differ from average speed?\",\n\"options\": [\n\"Instantaneous speed is total distance ÷ total time; average speed is at one moment\",\n\"They always have the same value\",\n\"Instantaneous speed is the speed at one exact moment; average speed is total distance ÷ total time\",\n\"Average speed includes direction; instantaneous speed does not\"\n],\n\"correct\": 2,\n\"exp\": \"Average speed = total distance ÷ total time. Instantaneous speed is the speed at one moment, such as a speedometer reading.\"\n},\n{\n\"question\": \"A runner completes a 400-meter lap in 50 seconds. What is the runner's average speed?\",\n\"options\": [\n\"0 m/s\",\n\"8 m/s\",\n\"12.5 m/s\",\n\"350 m/s\"\n],\n\"correct\": 1,\n\"exp\": \"Average speed = 400 ÷ 50 = 8 m/s.\"\n},\n{\n\"question\": \"If a cyclist's speedometer reads 25 km/h at a specific moment, what is this speed called?\",\n\"options\": [\n\"Instantaneous speed\",\n\"Average speed\",\n\"Displacement\",\n\"Average velocity\"\n],\n\"correct\": 0,\n\"exp\": \"It is the speed at that exact moment: instantaneous speed.\"\n},\n{\n\"question\": \"A train travels 300 km in 4 h and then 150 km in 2 h. What is the average speed for the entire journey?\",\n\"options\": [\n\"37.5 km/h\",\n\"450 km/h\",\n\"150 km/h\",\n\"75 km/h\"\n],\n\"correct\": 3,\n\"exp\": \"Total distance = 450 km, total time = 6 h. Speed = 450 ÷ 6 = 75 km/h.\"\n},\n{\n\"question\": \"A car travels at 60 km/h for 1 hour and then at 80 km/h for another hour. What is its average speed for the entire trip?\",\n\"options\": [\n\"140 km/h\",\n\"60 km/h\",\n\"70 km/h\",\n\"80 km/h\"\n],\n\"correct\": 2,\n\"exp\": \"Distance = 60 + 80 = 140 km in 2 h. Average speed = 70 km/h (equal times, so the simple mean).\"\n},\n{\n\"question\": \"The continuous change in position of an object relative to a fixed point is known as:\",\n\"options\": [\n\"Acceleration\",\n\"Motion\",\n\"Distance\",\n\"Rest\"\n],\n\"correct\": 1,\n\"exp\": \"Motion is the continuous change in position of an object relative to a fixed point.\"\n},\n{\n\"question\": \"A fixed set of coordinates used to determine the position of an object is called a:\",\n\"options\": [\n\"Vector quantity\",\n\"Reference frame\",\n\"Path length\",\n\"Displacement\"\n],\n\"correct\": 1,\n\"exp\": \"A reference frame is a fixed set of coordinates used to specify an object's position.\"\n},\n{\n\"question\": \"The change in position of an object in a specific direction is defined as:\",\n\"options\": [\n\"Distance\",\n\"Speed\",\n\"Displacement\",\n\"Acceleration\"\n],\n\"correct\": 2,\n\"exp\": \"Displacement is the change in position in a specific direction (a vector quantity).\"\n},\n{\n\"question\": \"What device in an automobile measures its instantaneous speed?\",\n\"options\": [\n\"Odometer\",\n\"Accelerometer\",\n\"Speedometer\",\n\"Thermometer\"\n],\n\"correct\": 2,\n\"exp\": \"The speedometer shows instantaneous speed. The odometer measures distance travelled.\"\n},\n{\n\"question\": \"Which of the following is the SI unit of velocity?\",\n\"options\": [\n\"m·s\",\n\"km/h\",\n\"m/s\",\n\"m/s²\"\n],\n\"correct\": 2,\n\"exp\": \"Velocity = displacement ÷ time, so its SI unit is metres per second (m/s). km/h is not an SI unit; m/s² is acceleration.\"\n},\n{\n\"question\": \"A student walks 200 m east, turns around, and walks 200 m west back to the starting point. What is the total displacement?\",\n\"options\": [\n\"400 m East\",\n\"200 m West\",\n\"0 m\",\n\"400 m West\"\n],\n\"correct\": 2,\n\"exp\": \"The student ends at the starting point, so displacement = 0 m.\"\n},\n{\n\"question\": \"Which statement correctly describes the relationship between distance and the magnitude of displacement?\",\n\"options\": [\n\"Distance is always less than displacement\",\n\"Distance can be equal to or greater than the magnitude of displacement\",\n\"Displacement is always greater than distance\",\n\"Distance is always equal to displacement\"\n],\n\"correct\": 1,\n\"exp\": \"Distance is the full path length, so it is equal to the magnitude of displacement only for straight-line motion in one direction; otherwise it is greater.\"\n},\n{\n\"question\": \"If initial position S_i = (4, 0) and final position S_f = (6, 0), what is the net displacement ΔS?\",\n\"options\": [\n\"−2 m\",\n\"+2 m\",\n\"+10 m\",\n\"−10 m\"\n],\n\"correct\": 1,\n\"exp\": \"ΔS = S_f − S_i = 6 − 4 = +2 m.\"\n},\n{\n\"question\": \"A car travels a distance of 80 km in 1 hour and 30 minutes. What is its average speed in m/s?\",\n\"options\": [\n\"53.33 m/s\",\n\"14.81 m/s\",\n\"22.22 m/s\",\n\"12.50 m/s\"\n],\n\"correct\": 1,\n\"exp\": \"80 km = 80 000 m; 1.5 h = 5400 s. Speed = 80 000 ÷ 5400 ≈ 14.81 m/s.\"\n},\n{\n\"question\": \"A runner moves 3 km West and then turns around to run 2 km East. Taking East as the positive direction, what is the runner's displacement?\",\n\"options\": [\n\"+5 km\",\n\"−1 km\",\n\"+1 km\",\n\"−5 km\"\n],\n\"correct\": 1,\n\"exp\": \"Displacement = −3 + 2 = −1 km (1 km West).\"\n},\n{\n\"question\": \"How far does a student travel in 1.5 hours if her average speed is 5 m/s?\",\n\"options\": [\n\"7.5 m\",\n\"450 m\",\n\"27,000 m\",\n\"18,000 m\"\n],\n\"correct\": 2,\n\"exp\": \"1.5 h = 5400 s. d = vt = 5 × 5400 = 27 000 m.\"\n},\n{\n\"question\": \"A student achieves a displacement of 360 m North in 180 seconds. What is the average velocity of the student?\",\n\"options\": [\n\"0.5 m/s North\",\n\"2.0 m/s North\",\n\"2.0 m/s South\",\n\"64,800 m/s North\"\n],\n\"correct\": 1,\n\"exp\": \"v = Δx/Δt = 360 ÷ 180 = 2.0 m/s North.\"\n},\n{\n\"question\": \"If an athlete runs one full lap around a circular track of radius R and ends at the starting line, what are the total distance and total displacement?\",\n\"options\": [\n\"Distance = 0, Displacement = 2πR\",\n\"Distance = 2πR, Displacement = 0\",\n\"Distance = 2πR, Displacement = 2πR\",\n\"Distance = πR², Displacement = 0\"\n],\n\"correct\": 1,\n\"exp\": \"Distance = circumference = 2πR. The athlete ends where they started, so displacement = 0.\"\n},\n{\n\"question\": \"Which of the following conditions guarantees that an object's instantaneous velocity equals its average velocity across any time interval?\",\n\"options\": [\n\"The object is accelerating uniformly\",\n\"The object moves in a circle at a constant speed\",\n\"The object undergoes uniform motion in a straight line\",\n\"The object comes to a sudden complete stop\"\n],\n\"correct\": 2,\n\"exp\": \"In uniform (constant-velocity) straight-line motion the velocity never changes, so instantaneous and average velocity are equal over any interval.\"\n},\n{\"question\": \"An object moves 50 m north in 10 seconds and then 50 m south in 10 seconds. What is its average velocity?\", \"options\": [\"0 m/s\", \"5 m/s north\", \"5 m/s south\", \"2.5 m/s\"], \"correct\": 0, \"exp\": \"Displacement = 50 − 50 = 0 m, so average velocity = 0 ÷ 20 s = 0 m/s.\"},\n{\"question\": \"Velocity is the rate of change of:\", \"options\": [\"Distance\", \"Displacement\", \"Speed\", \"Time\"], \"correct\": 1, \"exp\": \"Velocity = change in displacement ÷ time taken.\"},\n{\"question\": \"What is the average velocity of a body that returns to its starting point after 10 seconds?\", \"options\": [\"Zero\", \"Distance/Time\", \"Speed\", \"Cannot be determined\"], \"correct\": 0, \"exp\": \"The body returns to its start, so displacement = 0 and average velocity = 0.\"},\n{\"question\": \"The velocity of an object is zero when:\", \"options\": [\"It is at rest\", \"It is moving with constant speed\", \"It is accelerating\", \"It is moving in a circle\"], \"correct\": 0, \"exp\": \"Zero velocity means no change in position at that instant, i.e. the object is at rest.\"},\n{\"question\": \"What is the difference between speed and velocity?\", \"options\": [\"Speed is scalar, velocity is vector\", \"Speed has direction, velocity does not\", \"Both are scalar\", \"Both are vector\"], \"correct\": 0, \"exp\": \"Speed has magnitude only (scalar); velocity has magnitude and direction (vector).\"},\n{\"question\": \"A train 100 m long is moving with a velocity of 60 km/h. The time it takes to cross a bridge 1 km long is:\", \"options\": [\"60 s\", \"66 s\", \"30 s\", \"33 s\"], \"correct\": 1, \"exp\": \"Distance = 1000 + 100 = 1100 m. Speed = 60 km/h = 16.67 m/s. t = 1100 ÷ 16.67 = 66 s.\"},\n{\"question\": \"Two cars travel the same distance in the same time. What can you conclude?\", \"options\": [\"They have the same average speed\", \"They have the same velocity\", \"They have the same acceleration\", \"They travelled along the same path\"], \"correct\": 0, \"exp\": \"Average speed = total distance ÷ total time, so equal distances in equal times give equal average speeds. Velocity depends on displacement and direction, which may differ.\"},\n{\"question\": \"Which quantity always depends on the actual path followed by an object?\", \"options\": [\"Displacement\", \"Distance\", \"Velocity\", \"Acceleration\"], \"correct\": 1, \"exp\": \"Distance is the total length of the path travelled. Displacement depends only on the start and end points.\"},\n{\"question\": \"A train moves 60 km in the first hour, 60 km in the second hour, and 60 km in the third hour. What type of motion is this, and what is its average velocity? (Assume straight-line motion.)\", \"options\": [\"Uniform motion; 60 km/h in the direction of motion\", \"Uniform motion; 0 km/h\", \"Non-uniform motion; 60 km/h\", \"Accelerated motion; 180 km/h\"], \"correct\": 0, \"exp\": \"Equal distances in equal time intervals in a straight line means uniform motion (constant velocity). Average velocity = 180 km ÷ 3 h = 60 km/h in the direction of motion.\"},\n{\"question\": \"A body moves 30 m north in 10 seconds, then 30 m south in 10 seconds. What is its total distance?\", \"options\": [\"0 m\", \"30 m\", \"60 m\", \"90 m\"], \"correct\": 2, \"exp\": \"Distance = 30 + 30 = 60 m.\"},\n{\"question\": \"A body moves 30 m north in 10 seconds, then 30 m south in 10 seconds. What is its average speed?\", \"options\": [\"0 m/s\", \"1.5 m/s\", \"3 m/s\", \"6 m/s\"], \"correct\": 2, \"exp\": \"Average speed = 60 m ÷ 20 s = 3 m/s.\"},\n{\"question\": \"A body moves 30 m north in 10 seconds, then 30 m south in 10 seconds. What is its average velocity for the whole journey?\", \"options\": [\"3 m/s north\", \"3 m/s south\", \"1.5 m/s north\", \"0 m/s\"], \"correct\": 3, \"exp\": \"The body returns to its start, so displacement = 0 and average velocity = 0 ÷ 20 s = 0 m/s.\"},\n{\"question\": \"A body may be at rest relative to one reference frame and in motion relative to another.\", \"options\": [\"TRUE\", \"FALSE\"], \"correct\": 0, \"exp\": \"Rest and motion are relative. A passenger sitting in a moving bus is at rest relative to the bus but moving relative to the road.\"},\n{\"question\": \"A student says: \\\"If the distance travelled by an object is zero, its displacement must also be zero. However, if its displacement is zero, its distance must also be zero.\\\" Is the statement correct?\", \"options\": [\"Correct; both parts are true\", \"Incorrect; the first part is false, the second is true\", \"Incorrect; the first part is true, but zero displacement does not mean zero distance\", \"Incorrect; both parts are false\"], \"correct\": 2, \"exp\": \"If no distance is travelled, the object never moved, so displacement is 0 (first part true). But displacement can be 0 while distance is not: e.g. running one full lap of a track, or walking 50 m east and 50 m back west, gives displacement 0 but distance 100 m (second part false).\"},\n{\"question\": \"Two athletes run the same distance of 100 m. Athlete A takes 20 s and Athlete B takes 25 s. What are their average speeds and who is faster?\", \"options\": [\"A = 5 m/s, B = 4 m/s; A is faster\", \"A = 4 m/s, B = 5 m/s; B is faster\", \"A = 5 m/s, B = 4 m/s; B is faster\", \"Both have 4.5 m/s; neither is faster\"], \"correct\": 0, \"exp\": \"Speed = distance ÷ time. A: 100 ÷ 20 = 5 m/s. B: 100 ÷ 25 = 4 m/s. A has the higher speed, so A is faster.\"},\n{\"question\": \"A student walks 300 m east, then 400 m west, and finally 200 m east. What is the total distance travelled?\", \"options\": [\"100 m\", \"300 m\", \"900 m\", \"1000 m\"], \"correct\": 2, \"exp\": \"Distance = 300 + 400 + 200 = 900 m.\"},\n{\"question\": \"A student walks 300 m east, then 400 m west, and finally 200 m east. What is the final displacement?\", \"options\": [\"100 m east\", \"100 m west\", \"900 m east\", \"500 m east\"], \"correct\": 0, \"exp\": \"Taking east as positive: 300 − 400 + 200 = +100 m, i.e. 100 m east.\"},\n{\"question\": \"A student walks 300 m east, then 400 m west, and finally 200 m east. What is the magnitude of the displacement?\", \"options\": [\"900 m\", \"100 m\", \"300 m\", \"0 m\"], \"correct\": 1, \"exp\": \"The magnitude of +100 m (east) is 100 m.\"},\n{\"question\": \"A car moves with a steady speed of 60 km/h for 2 hours between two towns A and B. If the average speed for the round trip is 50 km/h, what is the car's speed from B to A?\", \"options\": [\"40 km/h\", \"50 km/h\", \"42.9 km/h\", \"45 km/h\"], \"correct\": 2, \"exp\": \"Distance A→B = 60 × 2 = 120 km, so the round trip is 240 km. Total time = 240 ÷ 50 = 4.8 h. Return time = 4.8 − 2 = 2.8 h. Speed B→A = 120 ÷ 2.8 ≈ 42.9 km/h.\"}\n];\n\nlet current = 0;\nlet score = 0;\nlet studentName = \"\";\nlet timeRemaining = TOTAL_TIME_SECONDS;\nlet timerInterval = null;\nconst answers = new Array(QUESTIONS.length).fill(null);\n\nconst loginScreen = document.getElementById('loginScreen');\nconst startScreen = document.getElementById('startScreen');\nconst quizScreen = document.getElementById('quizScreen');\nconst endScreen = document.getElementById('endScreen');\nconst jumpToggle = document.getElementById('jumpToggle');\nconst jumpPanel = document.getElementById('jumpPanel');\nconst jumpGrid = document.getElementById('jumpGrid');\nconst cardTab = document.getElementById('cardTab');\nconst cardWatermark = document.getElementById('cardWatermark');\nconst questionText = document.getElementById('questionText');\nconst formulaDisplay = document.getElementById('formulaDisplay');\nconst optionsList = document.getElementById('optionsList');\nconst answeredChip = document.getElementById('answeredChip');\nconst prevBtn = document.getElementById('prevBtn');\nconst nextBtn = document.getElementById('nextBtn');\nconst timerDisplay = document.getElementById('timerDisplay');\nconst timeBarFill = document.getElementById('timeBarFill');\nconst qProgressFill = document.getElementById('qProgressFill');\nconst qcount = document.getElementById('qcount');\nconst submitBtn = document.getElementById('submitBtn');\nconst submitConfirm = document.getElementById('submitConfirm');\nconst scoreRingFg = document.getElementById('scoreRingFg');\nconst mainControls = document.getElementById('mainControls');\nconst reviewControls = document.getElementById('reviewControls');\nconst reviewStatusChip = document.getElementById('reviewStatusChip');\nconst backToResultsBtn = document.getElementById('backToResultsBtn');\nconst reviewPrevBtn = document.getElementById('reviewPrevBtn');\nconst reviewNextBtn = document.getElementById('reviewNextBtn');\nconst timeBarTrack = document.querySelector('.time-bar-track');\n\nlet reviewMode = false;\nlet reviewIdx = 0;\n\nfunction letters(i){ return ['A','B','C','D'][i]; }\n\nfunction buildJumpPanel(){\n  jumpGrid.innerHTML = QUESTIONS.map((q,i)=>{\n    let cls = 'jump-btn';\n    if(answers[i] !== null) cls += ' answered';\n    if(i === current) cls += ' current';\n    return `<button type=\"button\" class=\"${cls}\" data-idx=\"${i}\">${i+1}<\/button>`;\n  }).join('');\n  jumpGrid.querySelectorAll('.jump-btn').forEach(b=>{\n    b.addEventListener('click', ()=>{\n      current = parseInt(b.dataset.idx, 10);\n      loadQuestion();\n      jumpPanel.classList.remove('open');\n    });\n  });\n}\n\njumpToggle.addEventListener('click', ()=>{\n  jumpPanel.classList.toggle('open');\n});\n\nfunction updateAnsweredChip(){\n  const n = answers.filter(a=>a!==null).length;\n  answeredChip.textContent = `Answered: ${n} / ${QUESTIONS.length}`;\n}\n\nfunction loadQuestion(){\n  const q = QUESTIONS[current];\n  const accent = ACCENT_PALETTE[current % ACCENT_PALETTE.length];\n  qcount.textContent = `Question ${current+1} / ${QUESTIONS.length}`;\n  qProgressFill.style.width = (((current+1)/QUESTIONS.length)*100) + '%';\n  cardTab.style.background = accent;\n  cardWatermark.style.color = accent;\n  buildJumpPanel();\n  updateAnsweredChip();\n\n  if(q.formula){\n    formulaDisplay.style.display = 'block';\n    formulaDisplay.textContent = q.formula;\n    formulaDisplay.style.borderColor = accent;\n    questionText.style.display = 'block';\n    questionText.textContent = 'What is the IUPAC name of this compound?';\n  } else {\n    formulaDisplay.style.display = 'none';\n    questionText.style.display = 'block';\n    questionText.textContent = q.question;\n  }\n\n  optionsList.innerHTML = '';\n  q.options.forEach((opt, idx)=>{\n    const btn = document.createElement('button');\n    btn.className = 'option' + (answers[current] === idx ? ' selected' : '');\n    btn.innerHTML = `<span class=\"letter\">${letters(idx)}<\/span><span>${opt}<\/span>`;\n    btn.addEventListener('click', ()=>selectOption(idx));\n    optionsList.appendChild(btn);\n  });\n\n  prevBtn.disabled = current === 0;\n  nextBtn.textContent = current === QUESTIONS.length-1 ? 'Finish' : 'Next';\n\n  const card = document.querySelector('.card');\n  card.classList.remove('animate');\n  void card.offsetWidth;\n  card.classList.add('animate');\n}\n\nfunction loadReviewQuestion(idx){\n  const q = QUESTIONS[idx];\n  const accent = ACCENT_PALETTE[idx % ACCENT_PALETTE.length];\n  qcount.textContent = `Question ${idx+1} / ${QUESTIONS.length}`;\n  qProgressFill.style.width = (((idx+1)/QUESTIONS.length)*100) + '%';\n  cardTab.style.background = accent;\n  cardWatermark.style.color = accent;\n\n  if(q.formula){\n    formulaDisplay.style.display = 'block';\n    formulaDisplay.textContent = q.formula;\n    formulaDisplay.style.borderColor = accent;\n    questionText.style.display = 'block';\n    questionText.textContent = 'What is the IUPAC name of this compound?';\n  } else {\n    formulaDisplay.style.display = 'none';\n    questionText.style.display = 'block';\n    questionText.textContent = q.question;\n  }\n\n  const userIdx = answers[idx];\n  const status = userIdx===null ? 'unanswered' : (userIdx===q.correct ? 'correct' : 'incorrect');\n  reviewStatusChip.textContent = status==='correct' ? '✓ Correct' : (status==='incorrect' ? '✗ Incorrect' : '○ Not answered');\n  reviewStatusChip.style.color = status==='correct' ? 'var(--correct)' : (status==='incorrect' ? 'var(--incorrect)' : 'var(--ink-soft)');\n\n  optionsList.innerHTML = '';\n  q.options.forEach((opt, i)=>{\n    const div = document.createElement('div');\n    let cls = 'option review-option';\n    let icon = '';\n    if(i === q.correct){ cls += ' correct-answer'; icon = ' ✓'; }\n    else if(i === userIdx){ cls += ' wrong-answer'; icon = ' ✗'; }\n    else { cls += ' neutral'; }\n    div.className = cls;\n    div.innerHTML = `<span class=\"letter\">${letters(i)}<\/span><span>${opt}${icon}<\/span>`;\n    optionsList.appendChild(div);\n  });\n\n  if(q.exp){ const e=document.createElement('div'); e.className='exp-box'; e.innerHTML='<b>Solution:<\/b> '+q.exp; optionsList.appendChild(e); }\n  reviewPrevBtn.disabled = idx === 0;\n  reviewNextBtn.textContent = idx === QUESTIONS.length-1 ? 'Done' : 'Next';\n\n  const card = document.querySelector('.card');\n  card.classList.remove('animate');\n  void card.offsetWidth;\n  card.classList.add('animate');\n}\n\nfunction openReview(idx){\n  reviewMode = true;\n  reviewIdx = idx;\n  endScreen.style.display = 'none';\n  quizScreen.style.display = 'block';\n  timeBarTrack.style.display = 'none';\n  timerDisplay.style.display = 'none';\n  jumpToggle.style.display = 'none';\n  jumpPanel.classList.remove('open');\n  mainControls.style.display = 'none';\n  reviewControls.style.display = 'flex';\n  loadReviewQuestion(reviewIdx);\n}\n\nfunction closeReview(){\n  reviewMode = false;\n  quizScreen.style.display = 'none';\n  endScreen.style.display = 'block';\n  timeBarTrack.style.display = '';\n  timerDisplay.style.display = '';\n  jumpToggle.style.display = '';\n  mainControls.style.display = '';\n  reviewControls.style.display = 'none';\n}\n\nbackToResultsBtn.addEventListener('click', closeReview);\nreviewPrevBtn.addEventListener('click', ()=>{ if(reviewIdx > 0){ reviewIdx--; loadReviewQuestion(reviewIdx); } });\nreviewNextBtn.addEventListener('click', ()=>{\n  if(reviewIdx === QUESTIONS.length-1){ closeReview(); }\n  else { reviewIdx++; loadReviewQuestion(reviewIdx); }\n});\n\nfunction selectOption(idx){\n  answers[current] = idx;\n  optionsList.querySelectorAll('.option').forEach((el,i)=>{\n    el.classList.toggle('selected', i===idx);\n  });\n  updateAnsweredChip();\n  qProgressFill.style.width = (((current+1)/QUESTIONS.length)*100) + '%';\n}\n\nprevBtn.addEventListener('click', ()=>{ if(current > 0){ current--; loadQuestion(); } });\nnextBtn.addEventListener('click', ()=>{\n  if(current === QUESTIONS.length-1){ triggerSubmitFlow(); }\n  else { current++; loadQuestion(); }\n});\nsubmitBtn.addEventListener('click', triggerSubmitFlow);\n\nfunction triggerSubmitFlow(){\n  const unansweredCount = answers.filter(a=>a===null).length;\n  if(unansweredCount > 0){\n    document.getElementById('submitConfirmText').textContent =\n      `${unansweredCount} question${unansweredCount===1?'':'s'} still unanswered. Submit anyway?`;\n    submitConfirm.classList.add('show');\n  } else {\n    finalizeQuiz('manual');\n  }\n}\ndocument.getElementById('confirmSubmitBtn').addEventListener('click', ()=>{\n  submitConfirm.classList.remove('show');\n  finalizeQuiz('manual');\n});\ndocument.getElementById('cancelSubmitBtn').addEventListener('click', ()=>{\n  submitConfirm.classList.remove('show');\n});\n\nconst codeInput = document.getElementById('codeInput');\nconst toggleCodeVisibility = document.getElementById('toggleCodeVisibility');\nconst EYE_OPEN = `<path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"><\/path><circle cx=\"12\" cy=\"12\" r=\"3\"><\/circle>`;\nconst EYE_CLOSED = `<path d=\"M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.07-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.6 18.6 0 0 1-2.16 3.19\"><\/path><line x1=\"1\" y1=\"1\" x2=\"23\" y2=\"23\"><\/line>`;\ntoggleCodeVisibility.addEventListener('click', ()=>{\n  const isHidden = codeInput.type === 'password';\n  codeInput.type = isHidden ? 'text' : 'password';\n  document.getElementById('eyeIcon').innerHTML = isHidden ? EYE_CLOSED : EYE_OPEN;\n  toggleCodeVisibility.setAttribute('aria-label', isHidden ? 'Hide access code' : 'Show access code');\n});\n\ndocument.getElementById('loginBtn').addEventListener('click', ()=>{\n  const nameVal = document.getElementById('nameInput').value.trim();\n  const codeVal = document.getElementById('codeInput').value.trim();\n  const err = document.getElementById('loginError');\n  if(!nameVal){ err.textContent = 'Please enter your name.'; err.classList.add('show'); return; }\n  if(codeVal !== ACCESS_CODE){ err.textContent = 'Incorrect access code. Ask your teacher.'; err.classList.add('show'); return; }\n  err.classList.remove('show');\n  studentName = nameVal;\n  document.getElementById('welcomeMsg').textContent = `${QUESTIONS.length} Multiple Choice Questions`;\n  loginScreen.style.display = 'none';\n  startScreen.style.display = 'block';\n});\n\ndocument.getElementById('startBtn').addEventListener('click', ()=>{\n  startScreen.style.display = 'none';\n  quizScreen.style.display = 'block';\n  loadQuestion();\n  startTimer();\n});\n\nlet reviewUnlocked=false;\nconst REVIEW_PASSWORD='SPEED';\nfunction toggleReviewList(){\n  const list=document.getElementById('reviewList');\n  const open=list.classList.toggle('open');\n  document.getElementById('reviewToggle').textContent=open?'Review Your Answers ▴':'Review Your Answers ▾';\n}\ndocument.getElementById('reviewToggle').addEventListener('click', ()=>{\n  if(reviewUnlocked){ toggleReviewList(); return; }\n  if(document.getElementById('pwBox')){ document.getElementById('pwInput').focus(); return; }\n  const box=document.createElement('div');\n  box.id='pwBox';\n  box.style.cssText='border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--paper-2);text-align:left;';\n  const lab=document.createElement('div');\n  lab.textContent='🔒 Enter the password to review your answers';\n  lab.style.cssText='font-size:13px;font-weight:700;margin-bottom:8px;';\n  const inp=document.createElement('input');\n  inp.id='pwInput'; inp.type='password'; inp.autocomplete='off'; inp.placeholder='Password';\n  inp.style.cssText='width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:15px;box-sizing:border-box;margin-bottom:8px;';\n  const err=document.createElement('div');\n  err.style.cssText='color:var(--incorrect);font-size:12.5px;font-weight:700;margin-bottom:8px;display:none;';\n  err.textContent='Incorrect password. Ask your teacher.';\n  const go=document.createElement('button');\n  go.className='btn btn-full'; go.textContent='Unlock';\n  const tryUnlock=()=>{\n    if(inp.value.trim().toUpperCase()===REVIEW_PASSWORD){\n      reviewUnlocked=true; box.remove();\n      const list=document.getElementById('reviewList');\n      if(!list.classList.contains('open')) toggleReviewList();\n    } else { err.style.display='block'; inp.value=''; inp.focus(); }\n  };\n  go.addEventListener('click', tryUnlock);\n  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });\n  box.append(lab,inp,err,go);\n  document.getElementById('reviewToggle').insertAdjacentElement('afterend',box);\n  inp.focus();\n});\n\ndocument.getElementById('restartBtn').addEventListener('click', ()=>{\n  current = 0; score = 0;\n  for(let i=0;i<answers.length;i++) answers[i] = null;\n  timeRemaining = TOTAL_TIME_SECONDS;\n  reviewMode = false;\n  timeBarTrack.style.display = '';\n  timerDisplay.style.display = '';\n  jumpToggle.style.display = '';\n  mainControls.style.display = '';\n  reviewControls.style.display = 'none';\n  submitConfirm.classList.remove('show');\n  jumpPanel.classList.remove('open');\n  document.getElementById('reviewList').classList.remove('open');\n  document.getElementById('reviewList').innerHTML = '';reviewUnlocked=false;{const pb=document.getElementById('pwBox');if(pb)pb.remove();}\n  document.getElementById('reviewToggle').textContent = 'Review Your Answers ▾';\n  scoreRingFg.style.transition = 'none';\n  scoreRingFg.style.strokeDashoffset = '377';\n  document.querySelectorAll('.confetti-container').forEach(c=>c.remove());\n  endScreen.style.display = 'none';\n  quizScreen.style.display = 'block';\n  loadQuestion();\n  startTimer();\n  requestAnimationFrame(()=>{ scoreRingFg.style.transition = ''; });\n});\n\nfunction startTimer(){\n  clearInterval(timerInterval);\n  updateTimerDisplay();\n  timerInterval = setInterval(()=>{\n    timeRemaining--;\n    updateTimerDisplay();\n    if(timeRemaining <= 0){\n      clearInterval(timerInterval);\n      finalizeQuiz('timeup');\n    }\n  }, 1000);\n}\n\nfunction updateTimerDisplay(){\n  const h = Math.floor(timeRemaining/3600);\n  const m = Math.floor((timeRemaining % 3600)/60);\n  const s = timeRemaining % 60;\n  timerDisplay.textContent = h > 0\n    ? `⏱ ${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`\n    : `⏱ ${m}:${s.toString().padStart(2,'0')}`;\n  const warn = timeRemaining <= 60;\n  timerDisplay.classList.toggle('warning', warn);\n  timeBarFill.classList.toggle('warning', warn);\n  timeBarFill.style.width = Math.max(0, (timeRemaining/TOTAL_TIME_SECONDS)*100) + '%';\n}\n\nfunction animateCount(el, target, duration){\n  const startTime = performance.now();\n  function tick(now){\n    const progress = Math.min((now-startTime)/duration, 1);\n    el.textContent = Math.floor(progress*target);\n    if(progress < 1) requestAnimationFrame(tick); else el.textContent = target;\n  }\n  requestAnimationFrame(tick);\n}\n\nfunction celebrate(){\n  const container = document.createElement('div');\n  container.className = 'confetti-container';\n  document.body.appendChild(container);\n  for(let i=0;i<28;i++){\n    const piece = document.createElement('span');\n    piece.className = 'confetti-piece';\n    piece.style.left = (Math.random()*100) + '%';\n    piece.style.background = ACCENT_PALETTE[Math.floor(Math.random()*ACCENT_PALETTE.length)];\n    piece.style.animationDelay = (Math.random()*0.4) + 's';\n    piece.style.animationDuration = (1.8 + Math.random()*1.2) + 's';\n    container.appendChild(piece);\n  }\n  setTimeout(()=>container.remove(), 3400);\n}\n\nfunction getResultTier(sc){\n  const p = sc / QUESTIONS.length;\n  if(p < 0.4) return { title:'Keep at it', message:\"Motion problems take practice. Go through the review below, read each solution, and focus on the difference between distance and displacement, and between speed and velocity. Then try again.\" };\n  if(p < 0.65) return { title:'Good progress', message:\"You have a solid base. Check the questions you missed in the review below, especially direction and unit conversions, and the next attempt will go better.\" };\n  if(p < 0.85) return { title:'Well done', message:\"Strong, consistent work. Review the few you missed below and watch for traps such as average speed vs. the mean of two speeds.\" };\n  return { title:'Outstanding work', message:\"Excellent command of speed, velocity, distance and displacement. Great job.\" };\n}\n\nfunction finalizeQuiz(reason){\n  clearInterval(timerInterval);\n  quizScreen.style.display = 'none';\n  endScreen.style.display = 'block';\n\n  let sc = 0;\n  QUESTIONS.forEach((q,i)=>{ if(answers[i] !== null && answers[i] === q.correct) sc++; });\n  score = sc;\n\n  document.getElementById('finalDenom').textContent = `out of ${QUESTIONS.length}`;\n  const tier = getResultTier(score);\n  document.getElementById('endTitle').textContent = studentName ? `${tier.title}, ${studentName}` : tier.title;\n  animateCount(document.getElementById('finalScore'), score, 900);\n\n  const circumference = 377;\n  const pct = score / QUESTIONS.length;\n  requestAnimationFrame(()=>{\n    scoreRingFg.style.strokeDashoffset = circumference * (1 - pct);\n  });\n\n  document.getElementById('scoreMessage').textContent = tier.message;\n\n  const unanswered = answers.filter(a=>a===null).length;\n  const note = document.getElementById('timeupNote');\n  if(unanswered > 0){\n    note.textContent = reason === 'timeup'\n      ? `Time's up — the quiz auto-submitted. ${unanswered} question${unanswered===1?'':'s'} not attempted.`\n      : `${unanswered} question${unanswered===1?'':'s'} were left unanswered.`;\n    note.classList.add('show');\n  } else {\n    note.classList.remove('show');\n  }\n\n  const reviewList = document.getElementById('reviewList');\n  reviewList.innerHTML = QUESTIONS.map((q,i)=>{\n    const userIdx = answers[i];\n    const status = userIdx===null ? 'unanswered' : (userIdx===q.correct ? 'correct' : 'incorrect');\n    const icon = status==='correct' ? '✓' : (status==='incorrect' ? '✗' : '○');\n    const prompt = q.formula || q.question;\n    const yourAns = userIdx!==null ? q.options[userIdx] : 'Not answered';\n    const extra = status==='incorrect' ? `<br>Correct: ${q.options[q.correct]}` : '';\n    return `<div class=\"review-row ${status}\" data-idx=\"${i}\">\n      <span class=\"review-icon\">${icon}<\/span>\n      <div class=\"review-body\">\n        <div class=\"review-q\"><span>Q${i+1}. ${prompt}<\/span><span class=\"chevron\">›<\/span><\/div>\n        <div class=\"review-ans\">Your answer: ${yourAns}${extra}<\/div>\n      <\/div>\n    <\/div>`;\n  }).join('');\n  reviewList.querySelectorAll('.review-row').forEach(row=>{\n    row.addEventListener('click', ()=>{ openReview(parseInt(row.dataset.idx, 10)); });\n  });\n\n  if(score > 0) celebrate();\n}\n<\/script>\n<\/body>\n<\/html>\n"}
};
const frames=document.getElementById('frames'),viewer=document.getElementById('viewer'),ttl=document.getElementById('ttl');
const made={};
function openApp(k){
  if(!made[k]){
    const f=document.createElement('iframe');
    f.title=APPS[k].title;
    f.srcdoc=APPS[k].html;
    frames.appendChild(f);
    made[k]=f;
  }
  Object.keys(made).forEach(x=>made[x].classList.toggle('on',x===k));
  ttl.textContent=APPS[k].title;
  viewer.classList.add('on');
}
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openApp(c.dataset.app)));
document.getElementById('back').addEventListener('click',()=>viewer.classList.remove('on'));
