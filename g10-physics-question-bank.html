const D=[{"id": "u1A1", "u": 1, "p": "A", "n": "1", "q": "Which of the following is a vector quantity?", "o": {"A": "Temperature", "B": "Speed", "C": "Displacement", "D": "Energy"}, "a": null, "k": null}, {"id": "u1A2", "u": 1, "p": "A", "n": "2", "q": "Two vectors of magnitude 6 units and 3 units act at the same point. Their resultant has the largest magnitude when the angle between them is:", "o": {"A": "0°", "B": "90°", "C": "120°", "D": "180°"}, "a": null, "k": null}, {"id": "u1A3", "u": 1, "p": "A", "n": "3", "q": "Two perpendicular forces of 6 N and 8 N act on a body. The magnitude of the resultant force is:", "o": {"A": "2 N", "B": "10 N", "C": "14 N", "D": "48 N"}, "a": null, "k": null}, {"id": "u1A4", "u": 1, "p": "A", "n": "4", "q": "Two vectors of equal magnitude 5 units point in exactly opposite directions. Their resultant is:", "o": {"A": "10 units", "B": "5 units", "C": "2.5 units", "D": "zero"}, "a": null, "k": null}, {"id": "u1A5", "u": 1, "p": "A", "n": "5", "q": "Subtracting vector B from vector A is the same as:", "o": {"A": "B + A", "B": "A + (−B)", "C": "−A + B", "D": "A × B"}, "a": null, "k": null}, {"id": "u1A6", "u": 1, "p": "A", "n": "6", "q": "Which graphical method is used to add more than two vectors?", "o": {"A": "Triangle method", "B": "Parallelogram method", "C": "Polygon method", "D": "Pythagorean method"}, "a": null, "k": null}, {"id": "u1A7", "u": 1, "p": "A", "n": "7", "q": "A force of 50 N acts at 30° above the horizontal. Its horizontal component is approximately:", "o": {"A": "25 N", "B": "43.3 N", "C": "50 N", "D": "86.6 N"}, "a": null, "k": null}, {"id": "u1A8", "u": 1, "p": "A", "n": "8", "q": "Which pair of quantities can be added together?", "o": {"A": "Force and velocity", "B": "Mass and weight", "C": "Force and force", "D": "Time and displacement"}, "a": null, "k": null}, {"id": "u1B9", "u": 1, "p": "B", "n": "9", "q": "Define scalar and vector quantities. Give three examples of each.", "o": null, "a": null, "k": null}, {"id": "u1B10", "u": 1, "p": "B", "n": "10", "q": "What is a resultant vector?", "o": null, "a": null, "k": null}, {"id": "u1B11", "u": 1, "p": "B", "n": "11", "q": "When are two vectors said to be equal? Is a vector with the same magnitude but opposite direction equal to the original? Explain.", "o": null, "a": null, "k": null}, {"id": "u1B12", "u": 1, "p": "B", "n": "12", "q": "Explain why a vector cannot have a component greater than its own magnitude.", "o": null, "a": null, "k": null}, {"id": "u1B13", "u": 1, "p": "B", "n": "13", "q": "Two vectors have magnitudes 4 km and 3 km. State the maximum and minimum possible magnitudes of their sum, and the angle between them in each case.", "o": null, "a": null, "k": null}, {"id": "u1B14", "u": 1, "p": "B", "n": "14", "q": "Can three vectors of unequal magnitudes add up to zero? Explain with an example.", "o": null, "a": null, "k": null}, {"id": "u1B15", "u": 1, "p": "B", "n": "15", "q": "List the steps of the graphical method of vector addition (triangle method).", "o": null, "a": null, "k": null}, {"id": "u1C16", "u": 1, "p": "C", "n": "16", "q": "A person walks 6 km due east and then 8 km due north. Find the magnitude and direction of the displacement.", "o": null, "a": null, "k": null}, {"id": "u1C17", "u": 1, "p": "C", "n": "17", "q": "Resolve a force of 40 N acting at 30° above the horizontal into horizontal and vertical components.", "o": null, "a": null, "k": null}, {"id": "u1C18", "u": 1, "p": "C", "n": "18", "q": "A girl walks 3.10 km at 25.0° north of east. How far north and how far east has she moved?", "o": null, "a": null, "k": null}, {"id": "u1C19", "u": 1, "p": "C", "n": "19", "q": "A student walks 20 m east, then 30 m north, then 10 m west. Using the component method, find the magnitude and direction of the resultant displacement.", "o": null, "a": null, "k": null}, {"id": "u1D37", "u": 1, "p": "D", "n": "37", "q": "A bus moves 5 km due east and then 10 km at 53° above the horizontal (east). What is the overall displacement of the bus?", "o": null, "a": null, "k": null}, {"id": "u1D50", "u": 1, "p": "D", "n": "50", "q": "The magnitude of the resultant of two vectors is a minimum when the vectors are:", "o": {"A": "parallel to each other", "B": "perpendicular to each other", "C": "opposite to each other", "D": "at 45° to each other"}, "a": null, "k": null}, {"id": "u1D51", "u": 1, "p": "D", "n": "51", "q": "The x component of a vector of magnitude 25 units is 15 units. What is the y component of the vector?", "o": {"A": "10 units", "B": "20 units", "C": "40 units", "D": "35 units"}, "a": null, "k": null}, {"id": "u1D52", "u": 1, "p": "D", "n": "52", "q": "The magnitude of the resultant of two vectors is 20 when they are parallel and 4 when they are opposite to each other. Their magnitudes must be:", "o": {"A": "8 and 12 units", "B": "6 and 14 units", "C": "24 and 16 units", "D": "10 and 6 units"}, "a": null, "k": null}, {"id": "u1D53", "u": 1, "p": "D", "n": "53", "q": "A bird flies 4 km east and 3 km north. What is the resultant displacement of the bird?", "o": {"A": "5 km, 37° east of north", "B": "7 km, 37° east of north", "C": "5 km, 37° north of east", "D": "1 km, east"}, "a": null, "k": null}, {"id": "u1D54", "u": 1, "p": "D", "n": "54", "q": "The resultant of two forces that are perpendicular to each other is 130 N. If one of the forces is 120 N, what is the magnitude of the other?", "o": {"A": "10 N", "B": "250 N", "C": "125 N", "D": "50 N"}, "a": null, "k": null}, {"id": "u1D55", "u": 1, "p": "D", "n": "55", "q": "A cart is pulled by a rope making an angle of 45° with the horizontal by a force of 100 N. What is the magnitude of the vertical component?", "o": {"A": "45 N", "B": "70 N", "C": "60 N", "D": "100 N"}, "a": null, "k": null}, {"id": "u1D56", "u": 1, "p": "D", "n": "56", "q": "A vector of magnitude 10 units has an x component of 6 units. What angle does the vector make with the positive x-axis?", "o": {"A": "37°", "B": "45°", "C": "53°", "D": "60°"}, "a": null, "k": null}, {"id": "u1D58", "u": 1, "p": "D", "n": "58", "q": "Which of the following pairs of vectors will not produce a resultant of 15 units?", "o": {"A": "5 and 12 units", "B": "6 and 8 units", "C": "10 and 15 units", "D": "10 and 6 units"}, "a": null, "k": null}, {"id": "u2A1", "u": 2, "p": "A", "n": "1", "q": "A person walks 70 m east and then 30 m west. The distance travelled and the displacement are:", "o": {"A": "100 m and 40 m east", "B": "40 m and 100 m east", "C": "100 m and 100 m", "D": "40 m and 40 m"}, "a": null, "k": null}, {"id": "u2A2", "u": 2, "p": "A", "n": "2", "q": "A car travels 100 km at 50 km/h and then another 100 km at 100 km/h. Its average speed for the whole trip is:", "o": {"A": "50 km/h", "B": "66.7 km/h", "C": "75 km/h", "D": "150 km/h"}, "a": null, "k": null}, {"id": "u2A3", "u": 2, "p": "A", "n": "3", "q": "The slope of a velocity–time graph gives:", "o": {"A": "displacement", "B": "velocity", "C": "acceleration", "D": "distance"}, "a": null, "k": null}, {"id": "u2A4", "u": 2, "p": "A", "n": "4", "q": "The area under a velocity–time graph gives:", "o": {"A": "acceleration", "B": "displacement", "C": "force", "D": "time"}, "a": null, "k": null}, {"id": "u2A5", "u": 2, "p": "A", "n": "5", "q": "The position–time graph of a body moving with constant acceleration is:", "o": {"A": "a horizontal line", "B": "a straight inclined line", "C": "a parabola", "D": "a circle"}, "a": null, "k": null}, {"id": "u2A6", "u": 2, "p": "A", "n": "6", "q": "A body is decelerating when:", "o": {"A": "its acceleration is zero", "B": "velocity and acceleration point in opposite directions", "C": "its velocity is negative", "D": "its position is decreasing"}, "a": null, "k": null}, {"id": "u2A7", "u": 2, "p": "A", "n": "7", "q": "Which equation of motion does not contain time?", "o": {"A": "v = v₀ + at", "B": "s = v₀t + ½at²", "C": "v² = v₀² + 2as", "D": "s = v_av·t"}, "a": null, "k": null}, {"id": "u2A8", "u": 2, "p": "A", "n": "8", "q": "A stone is dropped from rest. Neglecting air resistance, its speed after 3 s is:", "o": {"A": "9.8 m/s", "B": "19.6 m/s", "C": "29.4 m/s", "D": "44.1 m/s"}, "a": null, "k": null}, {"id": "u2A9", "u": 2, "p": "A", "n": "9", "q": "Car A moves at 80 km/h and car B follows it in the same direction at 65 km/h. The velocity of B relative to A is:", "o": {"A": "+15 km/h", "B": "−15 km/h", "C": "145 km/h", "D": "−145 km/h"}, "a": null, "k": null}, {"id": "u2B10", "u": 2, "p": "B", "n": "10", "q": "Distinguish between distance and displacement. Can the distance be smaller than the magnitude of the displacement?", "o": null, "a": null, "k": null}, {"id": "u2B11", "u": 2, "p": "B", "n": "11", "q": "Distinguish between average velocity and instantaneous velocity. Which one does a car speedometer show?", "o": null, "a": null, "k": null}, {"id": "u2B12", "u": 2, "p": "B", "n": "12", "q": "If the velocity of an object is zero, must its acceleration be zero? Give an example.", "o": null, "a": null, "k": null}, {"id": "u2B13", "u": 2, "p": "B", "n": "13", "q": "State the three equations of motion for constant acceleration and the condition under which they apply.", "o": null, "a": null, "k": null}, {"id": "u2B14", "u": 2, "p": "B", "n": "14", "q": "Why do a stone and a feather dropped together in a vacuum reach the ground at the same time?", "o": null, "a": null, "k": null}, {"id": "u2B15", "u": 2, "p": "B", "n": "15", "q": "Describe the shape of the position–time, velocity–time and acceleration–time graphs for a body that starts from rest and moves with constant acceleration.", "o": null, "a": null, "k": null}, {"id": "u2B16", "u": 2, "p": "B", "n": "16", "q": "Why does averaging 50 km/h and 100 km/h give the wrong average speed in a trip where equal distances are covered at each speed?", "o": null, "a": null, "k": null}, {"id": "u2C17", "u": 2, "p": "C", "n": "17", "q": "A car accelerates uniformly from rest to 20 m/s in 8 s. Find its acceleration.", "o": null, "a": null, "k": null}, {"id": "u2C18", "u": 2, "p": "C", "n": "18", "q": "An airplane lands with an initial velocity of 70 m/s and decelerates at 1.5 m/s² for 40 s. Find (a) its final velocity and (b) the distance it travels in this time.", "o": null, "a": null, "k": null}, {"id": "u2C19", "u": 2, "p": "C", "n": "19", "q": "An automobile starts from rest and accelerates at 3.5 m/s². (a) How far does it travel before reaching 25 m/s? (b) How long does this take?", "o": null, "a": null, "k": null}, {"id": "u2C20", "u": 2, "p": "C", "n": "20", "q": "A stone is dropped from the top of a cliff and takes 3.0 s to hit the ground. Find (a) the speed with which it hits the ground and (b) the height of the cliff.", "o": null, "a": null, "k": null}, {"id": "u2C21", "u": 2, "p": "C", "n": "21", "q": "A ball is thrown vertically upward at 20 m/s. Find (a) the time to reach the maximum height, (b) the maximum height, and (c) the total time of flight.", "o": null, "a": null, "k": null}, {"id": "u2C22", "u": 2, "p": "C", "n": "22", "q": "A car accelerates uniformly from 0 to 12 m/s in 4 s, moves at constant velocity for 6 s, and then brakes uniformly to rest in 2 s. (a) Sketch the velocity–time graph. (b) Find the acceleration in each stage. (c) Find the total distance travelled.", "o": null, "a": null, "k": null}, {"id": "u2C23", "u": 2, "p": "C", "n": "23", "q": "A truck moves at 20 m/s. A car moving in the same direction at 30 m/s overtakes it. (a) Find the velocity of the car relative to the truck. (b) If the two were moving toward each other at these speeds, what would the relative speed be?", "o": null, "a": null, "k": null}, {"id": "u2D7", "u": 2, "p": "D", "n": "7", "q": "Suppose your school is 1 km away. If you return home after class along the same route, what is your entire trip: (a) distance and (b) displacement?", "o": null, "a": null, "k": null}, {"id": "u2D8", "u": 2, "p": "D", "n": "8", "q": "A body moves 300 m due east and then 400 m due north. What are the distance and the displacement of the body?", "o": null, "a": null, "k": null}, {"id": "u2D9", "u": 2, "p": "D", "n": "9", "q": "An athlete runs once around a circular track of radius 400 m. What are the distance and the displacement of the athlete?", "o": null, "a": null, "k": null}, {"id": "u2D10", "u": 2, "p": "D", "n": "10", "q": "What does the speedometer of a car measure?", "o": null, "a": null, "k": null}, {"id": "u2D12", "u": 2, "p": "D", "n": "12", "q": "A car travels 81 km in 1 hour 30 minutes. What is its average speed?", "o": null, "a": null, "k": null}, {"id": "u2D13", "u": 2, "p": "D", "n": "13", "q": "A boy walks 400 m in 5 minutes and then runs 800 m in 3 minutes. What is the average speed of the boy?", "o": null, "a": null, "k": null}, {"id": "u2D14", "u": 2, "p": "D", "n": "14", "q": "A motorcycle moves 200 m at a speed of 10 m/s and then 600 m at a speed of 20 m/s. What is the average speed of the motorcycle?", "o": null, "a": null, "k": null}, {"id": "u2D15", "u": 2, "p": "D", "n": "15", "q": "A cheetah can run at 30 m/s. How far will it travel in 12 seconds?", "o": null, "a": null, "k": null}, {"id": "u2D16", "u": 2, "p": "D", "n": "16", "q": "An athlete runs once around a rectangular field of sides 100 m by 80 m in one minute. What is the average speed?", "o": null, "a": null, "k": null}, {"id": "u2D17", "u": 2, "p": "D", "n": "17", "q": "A car moves 500 m at a speed of 40 km/h and returns along the same road to its initial position at a speed of 60 km/h. What is the average speed of the car for the whole trip?", "o": null, "a": null, "k": null}, {"id": "u2D18", "u": 2, "p": "D", "n": "18", "q": "Can a body have a constant velocity and a varying speed at the same time? Explain.", "o": null, "a": null, "k": null}, {"id": "u2D19", "u": 2, "p": "D", "n": "19", "q": "Can a body have a constant speed and a varying velocity at the same time? Explain.", "o": null, "a": null, "k": null}, {"id": "u2D21", "u": 2, "p": "D", "n": "21", "q": "A car moves 500 m due east in 15 s and then 300 m due west in 5 s. What is the car’s (a) average speed and (b) average velocity?", "o": null, "a": null, "k": null}, {"id": "u2D22", "u": 2, "p": "D", "n": "22", "q": "A boy walks 400 m east and then 300 m north in 20 s. Find the boy’s (a) average speed and (b) average velocity.", "o": null, "a": null, "k": null}, {"id": "u2D23", "u": 2, "p": "D", "n": "23", "q": "An athlete runs once around a circular track of radius 400 m in 40 s. What is the athlete’s (a) average speed and (b) average velocity?", "o": null, "a": null, "k": null}, {"id": "u2D41", "u": 2, "p": "D", "n": "41", "q": "A racing car is travelling at 10 m/s. It accelerates uniformly and covers a distance of 725 m in 10 s. Calculate the acceleration of the car.", "o": null, "a": null, "k": null}, {"id": "u2D42", "u": 2, "p": "D", "n": "42", "q": "A truck starts from rest with a uniform acceleration of 2 m/s² and reaches a velocity of 16 m/s. Calculate the distance it covered.", "o": null, "a": null, "k": null}, {"id": "u2D43", "u": 2, "p": "D", "n": "43", "q": "A car moving with constant acceleration covers the distance between two points 100 m apart in 10 s. Its speed as it passes the second point is 15 m/s. What is (a) its speed at the first point and (b) its acceleration?", "o": null, "a": null, "k": null}, {"id": "u2D45", "u": 2, "p": "D", "n": "45", "q": "A cyclist starts from rest and accelerates at 1 m/s² for 20 s. He then travels at constant speed for 1 minute and finally decelerates at 2 m/s² until he stops. Find (a) his maximum speed and (b) the total distance he covered.", "o": null, "a": null, "k": null}, {"id": "u2D47", "u": 2, "p": "D", "n": "47", "q": "A bus initially at rest accelerates to a speed of 25 m/s in 4 s. What is the distance covered by the bus in the fourth second?", "o": null, "a": null, "k": null}, {"id": "u2D49", "u": 2, "p": "D", "n": "49", "q": "A car accelerates uniformly as it passes two checkpoints 30 m apart. The time taken between the checkpoints is 4 s and the car’s speed at the first checkpoint is 5 m/s. Find (a) the acceleration of the car and (b) its speed at the second checkpoint.", "o": null, "a": null, "k": null}, {"id": "u2D49b", "u": 2, "p": "D", "n": "49b", "q": "The velocity of a train reduces from 15 m/s to 7 m/s while it travels a distance of 80 m. How much further will the train travel before coming to rest, if the acceleration is constant?", "o": null, "a": null, "k": null}, {"id": "u2D62", "u": 2, "p": "D", "n": "62", "q": "A ball is kicked upward from the ground with an initial speed of 20 m/s. Use g = 10 m/s² and calculate (a) the speed of the ball at t = 2 s, (b) the maximum height reached by the ball, and (c) the time the ball takes to return to the ground.", "o": null, "a": null, "k": null}, {"id": "u2D64", "u": 2, "p": "D", "n": "64", "q": "From what height did a body fall if its speed as it strikes the ground is 30 m/s? (Use g = 10 m/s².)", "o": null, "a": null, "k": null}, {"id": "u2D65", "u": 2, "p": "D", "n": "65", "q": "A stone is released from the top of a 180 m cliff. One second later a ball is thrown downward, and both hit the ground at the same time. With what speed was the ball thrown? (Use g = 10 m/s².)", "o": null, "a": null, "k": null}],TITLES={1:"Unit 1: Vectors",2:"Unit 2: Motion"},PARTS={A:"Multiple Choice",B:"Short Answer",C:"Calculations",D:"Additional"};

try{S=JSON.parse(localStorage.getItem("pq10")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("pq10",JSON.stringify(S))}catch(e){}};
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const isDone=q=>{const s=S[q.id]||{};return q.o?!!s.sel:!!s.done};
function render(){document.getElementById("lk").textContent=AK?"🔓 Lock answers":"🔒 Unlock answers";
 const tabs=document.getElementById("tabs");tabs.innerHTML="";
 [1,2].forEach(u=>{const b=h("button","tab"+(u==unit?" on":""),TITLES[u]);b.onclick=()=>{unit=u;part="All";render()};tabs.append(b)});
 const inU=D.filter(q=>q.u==unit),ch=document.getElementById("chips");ch.innerHTML="";
 ["All","A","B","C","D"].forEach(p=>{const n=p=="All"?inU.length:inU.filter(q=>q.p==p).length;if(!n)return;
  const b=h("button","chip"+(p==part?" on":""),(p=="All"?"All":"Part "+p+" · "+PARTS[p])+" ("+n+")");b.onclick=()=>{part=p;render()};ch.append(b)});
 const L=inU.filter(q=>part=="All"||q.p==part),list=document.getElementById("list");list.innerHTML="";
 L.forEach(q=>list.append(card(q)));
 if(!L.length)list.append(h("div","empty","No questions."));
 const d=inU.filter(isDone).length,mc=inU.filter(q=>q.o),ok=AK?mc.filter(q=>(S[q.id]||{}).sel==q.k).length:0,ans=mc.filter(q=>(S[q.id]||{}).sel).length;
 document.getElementById("pb").style.width=(100*d/inU.length)+"%";
 document.getElementById("st").textContent=d+"/"+inU.length+" done · MCQ correct "+ok+"/"+ans+" attempted";
}
function card(q){
 const s=S[q.id]||(S[q.id]={}),c=h("div","card"+(isDone(q)?" done":"")),sel=AK?s.sel:null;
 const m=h("div","meta");m.append(h("span",null,"Q"+q.n),h("span",null,"Part "+q.p+" · "+PARTS[q.p]));c.append(m,h("p","q",q.q));
 if(q.o){
  Object.keys(q.o).forEach(k=>{const b=h("button","opt");b.append(h("b",null,k),h("span",null,q.o[k]));
   if(sel){if(k==q.k)b.classList.add("ok");else if(k==sel)b.classList.add("bad")}
   b.onclick=()=>{if(!AK)return ask();if(!s.sel){s.sel=k;save();render()}};c.append(b)});
  if(sel){const r=sel==q.k,f=h("div","fb "+(r?"ok":"bad"),r?"✓ Correct!":"✗ Not quite. Correct answer: "+q.k+".");c.append(f);
   if(q.a)c.append(h("div","sol",q.a));
   const a=h("div","acts"),t=h("button","sm","Try again");t.onclick=()=>{delete s.sel;save();render()};a.append(t);c.append(a)}
  else if(!AK)c.append(h("div","fb","🔒 Unlock answers to check your choice."));
 }else{
  const a=h("div","acts"),show=AK&&s.shown,t=h("button","sm",show?"Hide solution":AK?"Show solution":"🔒 Show solution");t.onclick=()=>{if(!AK)return ask();s.shown=!s.shown;save();render()};a.append(t);
  if(show){const d=h("button","sm",s.done?"✓ Done (undo)":"Mark as done");d.onclick=()=>{s.done=!s.done;save();render()};a.append(d)}
  c.append(a);if(show)c.append(h("div","sol",q.a));
 }
 return c;
}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
 const r=b64(BLOB),salt=r.slice(0,16),iv=r.slice(16,28),ct=r.slice(28),enc=new TextEncoder();
 const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct),M=JSON.parse(new TextDecoder().decode(pt));
 D.forEach(q=>{const x=M[q.id];if(x){q.k=x.k;q.a=x.a}});AK=true;
}
function ask(){
 if(AK){AK=null;D.forEach(q=>{q.k=null;q.a=null});return render()}
 const o=h("div","ov"),d=h("div","dlg"),i=h("input"),e=h("div","err"),g=h("button","tab on","Unlock"),x=h("button","sm","Cancel");
 i.type="password";i.placeholder="Password";i.autocomplete="off";
 const go=async()=>{try{await unlock(i.value.trim());o.remove();render()}catch(_){e.textContent="Wrong password. Try again."}};
 g.onclick=go;i.onkeydown=ev=>{if(ev.key=="Enter")go()};x.onclick=()=>o.remove();
 const w=h("div","row");w.append(g,x);d.append(h("b",null,"Answers are locked"),i,e,w);o.append(d);document.body.append(o);i.focus();
}
document.getElementById("lk").onclick=()=>{ask();document.getElementById("lk").textContent=AK?"🔓 Lock answers":"🔒 Unlock answers"};
let ly=0;addEventListener("scroll",()=>{const y=scrollY,b=document.querySelector(".bar");if(y>ly+6&&y>120)b.classList.add("hid");else if(y<ly-6||y<=120)b.classList.remove("hid");ly=y},{passive:true});
let rt;document.getElementById("rs").onclick=function(){if(this.dataset.c){clearTimeout(rt);S={};save();AK=null;D.forEach(q=>{q.k=null;q.a=null});this.dataset.c="";this.textContent="Reset";render()}else{this.dataset.c="1";this.textContent="Tap again to confirm";rt=setTimeout(()=>{this.dataset.c="";this.textContent="Reset"},3000)}};
document.getElementById("th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme=="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
render();
</script></body></html>
