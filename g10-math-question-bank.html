<style>

:root[data-theme="dark"] .u1{color:#4cd08a}
.by{display:block;width:fit-content;margin:0 0 8px auto;font-size:12px;font-weight:700;color:var(--acc);background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,.rs{font:inherit;font-size:14px;font-weight:600;padding:8px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg)}

.q{margin:2px 0 10px;overflow-wrap:anywhere}
button{font:inherit;font-size:14px;font-weight:600;padding:9px 16px;border:1.5px solid var(--bd);border-radius:999px;background:var(--card);color:var(--fg);cursor:pointer}

button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.opts button.ok,.g.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.opts button.no,.g.no{background:var(--nob);border-color:var(--no);color:var(--no)}

.g{margin:12px 8px 0 0}
.q,.ans{font-size:17px}
.q{font-weight:500}
.fr{display:inline-block;vertical-align:middle;text-align:center;margin:0 3px;font-size:.92em;line-height:1.25}

sup,sub{font-size:.7em;line-height:0}
.sq{position:relative;display:inline-block;padding-left:.78em;margin:0 .05em 0 .02em}
.sq.cb{padding-left:.95em}
.rg{position:absolute;left:0;top:.04em;width:.78em;height:calc(100% - .04em);overflow:visible;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:miter}

.sq.cb .rg{left:.17em}
.ix{position:absolute;left:.02em;top:.3em;font-size:.58em;line-height:1}
.ov{display:none;position:fixed;inset:0;z-index:100;background:rgba(10,16,32,.6);align-items:center;justify-content:center;padding:16px}

.bx{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--fg);padding:18px;width:min(330px,100%);box-shadow:0 24px 48px -20px rgba(0,0,0,.6)}
.bx h3{margin:0 0 4px;font-size:17px;color:var(--acc)}.bx p{margin:0 0 10px;font-size:13px;color:var(--mut)}
.bx input{font:inherit;font-size:16px;width:100%;box-sizing:border-box;padding:9px 12px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg)}
#pe{color:var(--no);font-size:13px;min-height:18px;margin:6px 0 4px}
.bx .row{justify-content:flex-end}
.rd{display:inline-block;border-top:1.5px solid currentColor;padding:0 .14em 0 .1em;line-height:1.3}
.un{margin:44px 2px 0;padding:12px 16px;border-radius:14px;background:linear-gradient(90deg,#14935a,#2456c7);color:#fff;font-size:18px;font-weight:800;letter-spacing:.01em;box-shadow:0 10px 22px -14px var(--sh)}
</style>

<script>
const P=[
["A – Patterns and the Cartesian Plane","",[
["Find a and b: 80, 72, 64, 56, 48, a, 32, b.","Subtract 8: a = 40, b = 24."],
["Identify the pattern 3, 9, 27, 81, … and give the next two terms.","Geometric (×3): 243, 729."],
["5, 8, 11, 14, … is arithmetic. Write the nth term and find the 10th term.","3n + 2; 10th term = 32."],
["Give the quadrant or axis of (−4, 3), (0, −5), (6, −1), (−2, −7).","II; negative y-axis; IV; III."],
["Why are (−1, 2) and (2, −1) different points? Name their quadrants.","Order matters, (x, y) ≠ (y, x). (−1, 2) is in II; (2, −1) is in IV."],
["Find the next two terms of the arithmetic sequence:\n−2, 1, 4, 7, __, __","d = 3, so the next terms are 10 and 13."],
["Find the missing terms in the arithmetic sequence:\n3.5, __, 1.5, __, −0.5","d = −1, so the missing terms are 2.5 and 0.5."],
["Find the common difference of the arithmetic sequence:\n1/2, 1, 3/2, 2, …","d = 1 − 1/2 = 1/2."],
["Find the missing term in the arithmetic sequence:\n2, x, 0, −1, …","From 0 to −1 the common difference is d = −1, so x = 2 + (−1) = 1. The sequence is 2, 1, 0, −1, …"],
["Find the 10th term of the arithmetic sequence:\n−4, −1, 2, 5, …","a = −4 and d = 3, so a₁₀ = −4 + 9(3) = 23."],
["Find the missing terms in the arithmetic sequence:\n1.2, __, 0.2, __, −0.8","d = −0.5, so the missing terms are 0.7 and −0.3."],
["Find the next two terms of the geometric sequence:\n−2, 4, −8, 16, __, __","r = −2, so the next terms are −32 and 64."],
["Find the missing term in the geometric sequence:\n1/4, x, 1, 2, …","r = 2/1 = 2, so x = 1/4 × 2 = 1/2 (check: 1/2 × 2 = 1)."]]],
["B – Relations, Domain and Range","",[
["R = {(x, y): y > x}. Which belong? (3,5), (5,3), (−2,−1), (4,4), (0.5,0.6)","(3,5), (−2,−1), (0.5,0.6)."],
["R: y is a multiple of x (natural numbers). Which belong? (2,8), (3,10), (5,5), (4,12), (6,3)","(2,8), (5,5), (4,12)."],
["R = {(x, y): y + 2x = −3}. Which belong? (1,5), (1,−5), (0,−3), (−2,4), (−2,1), (½,−4)","(1,−5), (0,−3), (−2,1), (½,−4). Each satisfies y = −3 − 2x."],
["R = {(x, y): y = 3x − 2}, x ∈ {−1, 0, 1, 2}. List the pairs.","(−1,−5), (0,−2), (1,1), (2,4)."],
["Domain and range of {(−3,2), (−1,0), (0,0), (4,5), (6,−2)}.","D = {−3, −1, 0, 4, 6}; R = {−2, 0, 2, 5}."],
["R: y = −2x, x and y integers. Domain and range?","D = all integers; R = all even integers."],
["A = {1,2,4,6,7}, B = {5,12,7,9,8,3}. List (x, y), x ∈ A, y ∈ B, where x is half of y.","(4,8) and (6,12)."],
["Domain and range of R = {(x, y): y = √(1 − x²)}.","D = [−1, 1]; R = [0, 1]."],
["Domain and range of R: y is the square of x (x real).","D = ℝ; R = {y: y ≥ 0}."]]],
["C – Graphs of Relations (Inequalities)","",[
["Sketch y < x + 3. State its domain and range.","Broken line y = x + 3, shade below. D = ℝ; R = ℝ."],
["Sketch y ≥ 2x − 4. State its domain and range.","Solid line, shade above. D = ℝ; R = ℝ."],
["Solid or broken line? (a) y < −x + 7 (b) y ≤ 3x − 4 (c) y ≥ 2x + 5 (d) y > 5x − 6","(a) broken (b) solid (c) solid (d) broken."],
["R = {(x, y): x ≥ 2 and y < −x}. Find the domain and range.","D = {x: x ≥ 2}; R = {y: y < −2}."],
["R = {(x, y): y < x and y > −x + 1}. Find the domain and range.","The lines meet at x = ½. D = {x: x > ½}; R = ℝ."]]],
["D – The Notion of a Function","",[
["Is {(6,7), (1,9), (−1,7), (0,0), (4,−4)} a function?","Yes. No first element repeats."],
["Is {(−3,7), (−5,9), (−1,4), (2,0), (−5,3)} a function?","No. −5 is paired with both 9 and 3."],
["Table: x = 1, 1, 3, 3, 7 and y = 5, 5, −8, −8, 4. Is it a function?","Yes. Repeated x-values have the same y-value."],
["Is R = {(x, y): y² = x} a function?","No. (4, 2) and (4, −2) both belong."],
["Is R = {(x, y): y = |x|} a function?","Yes. Each x gives exactly one value |x|."],
["Is R = {(x, y): y is a grandmother of x} a function?","No. A person has two grandmothers."],
["Does the circle x² + y² = 9 pass the vertical line test?","No. x = 0 cuts it at (0, 3) and (0, −3)."],
["Is R = {(x, y): x = |y|} a function?","No. x = 1 gives y = 1 and y = −1."],
["Is R = {(x, y): y = x²} a function?","Yes. Each x gives exactly one value x²."],
["Is R = {(x, y): y = x² − 2} a function?","Yes. Each x gives exactly one value x² − 2."],
["Is R = {(x, y): x = y² − 2} a function?","No. x = 2 gives y = 2 and y = −2."],
["Is R = {(x, y): y = |2x + 1|} a function?","Yes. Each x gives exactly one value |2x + 1|."],
["Is R = {(x, y): x = |2y + 1|} a function?","No. x = 3 gives 2y + 1 = 3 or −3, so y = 1 and y = −2."],
["Is R = {(x, y): y = 1/x²} a function?","Yes. Each x ≠ 0 gives exactly one value 1/x²."],
["Is R = {(x, y): x = 1/y²} a function?","No. x = 1 gives y = 1 and y = −1."],
["Is R = {(x, y): y is the mother of x} a function?","Yes. Each person x has exactly one mother y."],
["Is R = {(x, y): x is the mother of y} a function?","No. A mother x can have several children y."],
["Is R = {(x, y): x is the brother of y} a function?","No. A person y can have several brothers x, or none."],
["Is R = {(x, y): y is the brother of x} a function?","No. A person x can have several brothers y, or none."],
["Is R = {(x, y): y is the area of triangle x} a function?","Yes. Each triangle x has exactly one area y."],
["Is R = {(x, y): x is the area of triangle y} a function?","No. Many different triangles y have the same area x."],
["Is every function a relation? Is every relation a function?","Every function is a relation. Not every relation is a function, e.g. {(1,2), (1,3)}."]]],
["E – Domain and Range of Functions","Find the domain and range of each function.",[
["h(x) = 7 (constant function)","D = ℝ; R = {7}."],
["f(x) = 2x − 3","D = ℝ; R = ℝ."],
["f(x) = x² + 1","D = ℝ; R = [1, ∞)."],
["f(x) = 1 − x²","D = ℝ; R = (−∞, 1]."],
["f(x) = |x| + 1","D = ℝ; R = [1, ∞)."],
["f(x) = √(x − 2)","D = [2, ∞); R = [0, ∞)."],
["f(x) = √(2 − x)","D = (−∞, 2]; R = [0, ∞)."],
["f(x) = √(x² − 1)","D = {x: x ≤ −1 or x ≥ 1}; R = [0, ∞)."],
["f(x) = √(x² − 9)","D = {x: x ≤ −3 or x ≥ 3}; R = [0, ∞)."],
["f(x) = √(9 − x²)","D = [−3, 3]; R = [0, 3]."],
["f(x) = x/(x − 2)","D = ℝ∖{2}; R = ℝ∖{1}."],
["f(x) = 1/(2x)","D = ℝ∖{0}; R = ℝ∖{0}."],
["f(x) = (x + 1)/(x − 3)","D = ℝ∖{3}; R = ℝ∖{1}."],
["f(x) = 7/(2x² − 8)","D = ℝ∖{−2, 2}; R = (−∞, −7/8] ∪ (0, ∞)."],
["f(x) = 7/(2x² + 8)","D = ℝ; R = (0, 7/8]."],
["p(x) = ∛(x + 8) (cube root)","D = ℝ; R = ℝ."],
["f(x) = 2x + √(4 − x). Find the domain, f(0) and f(−5).","D = (−∞, 4]; f(0) = 2; f(−5) = −7."],
["F = {(2,−1), (0,0), (−4,2), (−5,3)}. Find the domain and range.","D = {−5, −4, 0, 2}; R = {−1, 0, 2, 3}."],
["Find the domain of f(x) = 4/√(x² − 1).","Need x² − 1 > 0, so x < −1 or x > 1. D = (−∞, −1) ∪ (1, ∞)."],
["Find the domain of g(x) = √(x − 3)/(x + 2).","Need x − 3 ≥ 0, so x ≥ 3; this already excludes x = −2, where the denominator is 0. D = [3, ∞)."],
["Find the domain of g(x) = √(x − 3)/(x − 4).","Need x − 3 ≥ 0, so x ≥ 3, and x − 4 ≠ 0, so x ≠ 4. D = [3, 4) ∪ (4, ∞)."]]],
["F – Combination of Functions","",[
["f(x) = 2x + 4, g(x) = 3x − 1. Find (f + g)(x) and (f + g)(2).","5x + 3; 13."],
["f(x) = 2x + 1, g(x) = x² + 2x − 1. Find (f − g)(x) and (f − g)(2).","−x² + 2; −2."],
["f(x) = x², g(x) = x − 3. Find (f·g)(x) and (f·g)(4).","x³ − 3x²; 16."],
["f(x) = 4, g(x) = x − 3. Find (f/g)(x) and its domain.","4/(x − 3); x ≠ 3."],
["f(x) = √x, g(x) = √(4 − x²). Find the domains of f/g and g/f.","Common domain [0, 2]. f/g: [0, 2). g/f: (0, 2]."],
["f(x) = 1/x, g(x) = 1/x². Find (f + g)(x), (f/g)(x) and their domains.","(x + 1)/x²; x. Both have domain ℝ∖{0}."],
["f(x) = 7 − 2x, g(x) = −x − 6. Find 3f + g and 4g − 3f.","15 − 7x; 2x − 45."],
["f(x) = x² − 1, g(x) = x − 2. Find (f+g)(3), (f−g)(0), (f·g)(4), (f/g)(−5).","9; 1; 30; −24/7."],
["f(x) = 2x² − 5x − 3, g(x) = −2x² + x + 7. Find (f+g)(x), (f+g)(−1) and (2f−g)(3).","−4x + 4; 8; 8."],
["f(x) = (2x − 3)/(x − 1), g(x) = (x + 8)/x. Find the domains of f·g and f/g.","f·g: ℝ∖{0, 1}. f/g: ℝ∖{−8, 0, 1}, since g(x) ≠ 0 too."],
["Same function? (a) y = x² and y = x², x ≥ 0 (b) y = x and y = ∛(x³) (c) y = x + 1 and y = (x² − 1)/(x − 1)","(a) No, the domains differ. (b) Yes. (c) No, the second is undefined at x = 1."],
["For f(x) = 1 − 3x, find the domain, range, f(2) and f(−1).","D = ℝ; R = ℝ; f(2) = −5; f(−1) = 4."]]],
["G – One-to-One, Onto and Bijective Functions","Choose: Injective only, Surjective only, Bijective or Neither. ★ = extension (uses eˣ, ln x or sin x, taught in Units 3–4).",[
["f: ℝ → ℝ, f(x) = 2x + 3","Bijective. Linear with nonzero slope."],
["f: ℝ → ℝ, f(x) = x²","Neither. f(2) = f(−2), and −1 is never hit."],
["f: ℝ → ℝ, f(x) = x³","Bijective. Strictly increasing, and every real has a cube root."],
["f: ℝ → [0, ∞), f(x) = x²","Surjective only. f(2) = f(−2), but every y ≥ 0 is hit."],
["f: [0, ∞) → [0, ∞), f(x) = x²","Bijective. Restricting to x ≥ 0 removes the repeat, and √y is the inverse."],
["f: ℝ → ℝ, f(x) = |x|","Neither. f(1) = f(−1), and negatives are never hit."],
["★ f: ℝ → ℝ, f(x) = eˣ","Injective only. Strictly increasing, but never ≤ 0."],
["★ f: ℝ → (0, ∞), f(x) = eˣ","Bijective. Inverse is ln y."],
["★ f: ℝ → ℝ, f(x) = sin x","Neither. sin 0 = sin π, and 2 is never hit."],
["★ f: ℝ → [−1, 1], f(x) = sin x","Surjective only. Still periodic, but every value in [−1, 1] is hit."],
["★ f: [−π/2, π/2] → [−1, 1], f(x) = sin x","Bijective. sin is strictly increasing on this interval."],
["f: ℝ → ℝ, f(x) = x³ − x","Surjective only. f(0) = f(1) = f(−1) = 0, but the cubic takes every real value."],
["f: ℝ∖{0} → ℝ∖{0}, f(x) = 1/x","Bijective. 1/x is its own inverse."],
["f: ℝ∖{0} → ℝ, f(x) = 1/x","Injective only. 0 is never hit."],

["A 40 cm wire is cut into two pieces and each is bent into a square. The total area is 58 cm². Find the length of each piece.","a² + (40 − a)² = 928 gives a² − 40a + 336 = 0, so a = 12 or 28. The pieces are 12 cm and 28 cm."],
["A ball’s height is h(t) = −t² + 6t metres. Find the maximum height, when it occurs, and the range of h for 0 ≤ t ≤ 6.","h(t) = −(t − 3)² + 9. Maximum 9 m at t = 3 s; R = [0, 9]."],
["A small rock is launched vertically upward from the top of a 58.8 m tall platform with an initial upward velocity of 19.6 m/s. Its height above the ground after t seconds is s(t) = −4.9t² + 19.6t + 58.8.\n(1) After how many seconds does the rock reach its maximum height?\n(2) What is that maximum height?","Since a = −4.9 < 0, the parabola opens downward, so the vertex is the maximum point. (1) t = −b/(2a) = 19.6/9.8 = 2 s. (2) s(2) = −4.9(4) + 19.6(2) + 58.8 = 78.4 m. In vertex form, s(t) = −4.9(t − 2)² + 78.4."],
["A 32 cm wire is cut into two pieces. Each piece is bent to form a square. If the sum of the areas of the two squares is 34 cm², find the length of each piece.","Let one piece be a cm, the other (32 − a) cm. The sides are a/4 and (32 − a)/4, so a² + (32 − a)² = 16(34) = 544. This gives a² − 32a + 240 = 0, so (a − 12)(a − 20) = 0. The pieces are 12 cm and 20 cm (squares of side 3 cm and 5 cm: 9 + 25 = 34)."],
["The area of a square playground is given by x² + 12x + 36 m². Find its perimeter when x = 8 m.","x² + 12x + 36 = (x + 6)², so the side is x + 6. For x = 8 the side is 14 m, and the perimeter is 4(14) = 56 m."],
["One leg of a right triangle is 7 cm longer than the other leg. If the hypotenuse measures 13 cm, find the lengths of the two legs.","Let the legs be x and x + 7. Then x² + (x + 7)² = 13², so x² + 7x − 60 = 0, so (x + 12)(x − 5) = 0. Since x > 0, x = 5. The legs are 5 cm and 12 cm."],
["A rectangular photo measures 8 cm by 10 cm. It is placed inside a frame that creates a border of uniform width x around the entire photo. If the total combined area of the photo and frame is 143 cm², find the width of the border.","(8 + 2x)(10 + 2x) = 143, so 4x² + 36x − 63 = 0. Then x = (−36 ± 48)/8, so x = 1.5 or x = −10.5. Width cannot be negative, so the border is 1.5 cm wide (check: 11 × 13 = 143)."],
["Divide 29 into two parts so that the sum of the squares of the parts is 425. Find the value of each part.","Let the parts be x and 29 − x. Then x² + (29 − x)² = 425, so x² − 29x + 208 = 0, so (x − 13)(x − 16) = 0. The parts are 13 and 16 (169 + 256 = 425)."],
["The sum of the squares of two consecutive natural numbers is 313. Find the numbers.","Let the numbers be n and n + 1. Then n² + (n + 1)² = 313, so n² + n − 156 = 0, so (n + 13)(n − 12) = 0. Since n is natural, n = 12. The numbers are 12 and 13 (144 + 169 = 313)."],
["A piece of cloth costs Birr 200. If the piece was 5 m longer, and the cost of one metre of cloth was Birr 2 less, the cost of the piece would have remained unchanged. How long is the piece and what is its original price per metre?","Let the length be L m and the price p Birr per metre, so Lp = 200. Then (L + 5)(p − 2) = 200 gives 5p − 2L = 10, so p = (2L + 10)/5. Substituting: L² + 5L − 500 = 0, so (L + 25)(L − 20) = 0, so L = 20. The piece is 20 m long and the original price is Birr 10 per metre (check: 25 × 8 = 200)."],
["Birr 6,500 was divided equally among a certain number of persons. Had there been 15 more persons, each would have got Birr 30 less. Find the original number of persons.","Let there be n persons. Then 6500/n − 6500/(n + 15) = 30. This gives n² + 15n − 3250 = 0, so (n − 50)(n + 65) = 0, so n = 50. There were 50 persons (check: 130 − 100 = 30)."]]],

const OPT=["Injective only","Surjective only","Bijective","Neither"];
const SUPS="⁰¹²³⁴⁵⁶⁷⁸⁹⁻",SUPT="0123456789−",SUBS="₀₁₂₃₄₅₆₇₈₉";
function pw(s){return s.replace(/\^\{([^}]*)\}/g,"<sup>$1</sup>").replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,m=>"<sup>"+[...m].map(c=>SUPT[SUPS.indexOf(c)]).join("")+"</sup>").replace(/[₀-₉]+/g,m=>"<sub>"+[...m].map(c=>SUBS.indexOf(c)).join("")+"</sub>")}
function sq(b,c){return '<span class="sq'+(c?' cb':'')+'">'+(c?'<span class="ix">3</span>':'')+'<svg class="rg" viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0.3 11.5L2.3 10L5 19.3L9.4 0H10"/></svg><span class="rd">'+b+'</span></span>'}
function rad(s){let o="",i=0;
while(i<s.length){const ch=s[i];
if(ch==="√"||ch==="∛"){let j=i+1,b=null;
if(s[j]==="("){let d=0,k=j;for(;k<s.length;k++){if(s[k]==="(")d++;else if(s[k]===")"){d--;if(d===0)break}}
if(d===0){b=s.slice(j+1,k);j=k+1}}
else{const r=/^(\d+(?:\.\d+)?|[A-Za-z])/.exec(s.slice(j));if(r){b=r[1];j+=r[1].length}}
if(b!==null){o+=sq(rad(b),ch==="∛");i=j;continue}}
o+=ch;i++}
return o}
function fr(n,d){const u=t=>pw(rad(t.replace(/^\((.*)\)$/,"$1")));return '<span class="fr"><span>'+u(n)+'</span><span>'+u(d)+'</span></span>'}
function m(s){s=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
s=s.replace(/\((\d+)\/(\d+)\)|(√\([^()]*\)|\([^()]*\)|[−+]?[\w.√π⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+)\/(√\([^()]*\)|\([^()]*\)|[−+]?[\w.√π⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+)/g,(x,a,b,c,d)=>a!==undefined?fr(a,b):(/^[a-z]$/i.test(c)&&/^[a-z]$/i.test(d)?x:fr(c,d)));
s=s.replace(/½/g,fr("1","2")).replace(/¼/g,fr("1","4")).replace(/⅔/g,fr("2","3"));
return pw(rad(s))}
