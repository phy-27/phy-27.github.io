the tin if it is to be made of the least amount of metal?", "o": ["2 cm", "3 cm", "4 cm", "6 cm"], "a": 1, "s": "h = 54/r². Surface area A = 2πrh + 2πr² = 108π/r + 2πr². A′ = −108π/r² + 4πr = 0 gives r³ = 27, so r = 3 cm.", "img": ""}, {"y": 2009, "n": "50", "t": "Related rates", "q": "Air is being pumped into a spherical balloon so that its volume increases at a rate of 50 cm³/s. How fast is the radius of the balloon increasing when the diameter is 5 cm?", "o": ["1/(50π) cm/s", "1/(25π) cm/s", "5/π cm/s", "2/π cm/s"], "a": 3, "s": "V = (4/3)πr³, so dV/dt = 4πr² dr/dt. With r = 5/2: 50 = 4π(25/4)dr/dt = 25π dr/dt, so dr/dt = 2/π cm/s.", "img": ""}, {"y": 2009, "n": "51", "t": "Applications of derivatives", "q": "If 2 ≤ f′(x) ≤ 4 for all values of x, then the value of f(8) − f(2) is between which of the following numbers?", "o": ["14 and 24", "12 and 24", "12 and 18", "8 and 10"], "a": 1, "s": "By the Mean Value Theorem, [f(8) − f(2)]/(8 − 2) = f′(c) is between 2 and 4. Multiply by 6: f(8) − f(2) is between 12 and 24.", "img": ""}, {"y": 2010, "n": "1", "t": "Limits", "q": "If a function f is differentiable at a, then what is the value of lim<sub>x→a</sub> f(x)?", "o": ["f(a)", "f′(a)", "f′(a)·f(a)", "0"], "a": 0, "s": "Differentiable implies continuous, so lim<sub>x→a</sub> f(x) = f(a).", "img": ""}, {"y": 2010, "n": "2", "t": "Sequences", "q": "Which one of the following is a convergent sequence?", "o": ["{(1 + 2<sup>n</sup>)/3<sup>n</sup>}", "{1/n + sin(n)}", "{(1 − 3<sup>n</sup>)/2<sup>n</sup>}", "{(−1)<sup>n</sup>/2}"], "a": 0, "s": "(1 + 2<sup>n</sup>)/3<sup>n</sup> = (1/3)<sup>n</sup> + (2/3)<sup>n</sup> → 0, so it converges. (1 − 3<sup>n</sup>)/2<sup>n</sup> → −∞, (−1)<sup>n</sup>/2 alternates between ±1/2, and 1/n + sin n has no limit because sin n does not settle.", "img": ""}, {"y": 2010, "n": "3", "t": "Series", "q": "What is the value of Σ<sub>n=2</sub><sup>20</sup> (1/(n − 1) − 1/n)?", "o": ["17/20", "23/20", "21/20", "19/20"], "a": 3, "s": "The sum telescopes: (1 − 1/2) + (1/2 − 1/3) + … + (1/19 − 1/20) = 1 − 1/20 = 19/20.", "img": ""}, {"y": 2010, "n": "6", "t": "Applications of derivatives", "q": "What is the maximum value of the function f(x) = x⁴ − 2x² on [−2, 1]?", "o": ["8", "12", "24", "40"], "a": 0, "s": "f′ = 4x³ − 4x = 4x(x − 1)(x + 1) = 0 gives x = −1, 0, 1. Compare f(−2) = 16 − 8 = 8, f(−1) = −1, f(0) = 0, f(1) = −1. The maximum is 8.", "img": ""}, {"y": 2010, "n": "7", "t": "Sequences", "q": "What are the greatest lower bound and least upper bound of the sequence {(−1)ⁿ(1 + 1/n)}, respectively?", "o": ["−2 and 2", "−3/2 and 2", "−2 and 3/2", "−2 and −3/2"], "a": 2, "s": "For even n the terms are 3/2, 5/4, 7/6, … (between 1 and 3/2). For odd n they are −2, −3/2, −5/4, … (between −2 and −1). So −2 ≤ a<sub>n</sub> ≤ 3/2, and both bounds are attained: glb = −2, lub = 3/2.", "img": ""}, {"y": 2010, "n": "13", "t": "Applications of integrals", "q": "What is the area of the region enclosed by the graphs of y² = x + 1 and y² = −x + 1?", "o": ["3/8 sq. units", "4/3 sq. units", "8/3 sq. units", "3/4 sq. units"], "a": 2, "s": "In terms of y: x = y² − 1 and x = 1 − y², which meet at y = ±1. A = ∫<sub>−1</sub><sup>1</sup> [(1 − y²) − (y² − 1)] dy = ∫(2 − 2y²) dy = [2y − 2y³/3]<sub>−1</sub><sup>1</sup> = 8/3.", "img": ""}, {"y": 2010, "n": "14", "t": "Integration", "q": "What is the value of ∫₁² (x + 4)/(x(x + 2)) dx ?", "o": ["2", "ln 3", "ln 2", "ln 4 − ln 3"], "a": 1, "s": "Partial fractions: (x + 4)/(x(x + 2)) = 2/x − 1/(x + 2). ∫ = 2 ln x − ln(x + 2) from 1 to 2 = (2 ln 2 − ln 4) − (0 − ln 3) = ln 3.", "img": ""}, {"y": 2010, "n": "15", "t": "Derivatives", "q": "What is the slope of the tangent line to the graph of f(x) = 3eˣ + sin x + 2 at (0, 5)?", "o": ["2", "3", "5", "4"], "a": 3, "s": "f′(x) = 3e<sup>x</sup> + cos x, so f′(0) = 3 + 1 = 4.", "img": ""}, {"y": 2010, "n": "16", "t": "Sequences", "q": "The population of a certain city is increasing at a rate of 3% per year. If the population was 100,000 in 2010 E.C., then what will be the population in 2020 E.C.? (Given (1.03)⁹ = 1.30, (1.03)¹⁰ = 1.34, (1.3)⁹ = 10.60, (1.3)¹⁰ = 13.78)", "o": ["134,000", "130,000", "1,060,000", "1,378,000"], "a": 0, "s": "Geometric growth: P = 100,000(1.03)<sup>10</sup> = 100,000(1.34) = 134,000.", "img": ""}, {"y": 2010, "n": "20", "t": "Integration", "q": "If f′(x) = e^(x−1) + 3x² − 1/x and f(1) = 5, what is f(x)?", "o": ["f(x) = e^(x−1) + 3x² + 1/x² + 2", "f(x) = e^(x−1) − x³ + ln x + 5", "f(x) = e^(x−1) + 3x² − 1/x + 5", "f(x) = e^(x−1) + x³ − ln x + 3"], "a": 3, "s": "f(x) = ∫f′ = e<sup>x−1</sup> + x³ − ln x + c. f(1) = 1 + 1 − 0 + c = 5 gives c = 3.", "img": ""}, {"y": 2010, "n": "23", "t": "Integration", "q": "What is the value of ∫₁⁹ e^(√x)/√x dx ?", "o": ["e³ − e", "e³/3 − e", "e(e² − 1/3)", "2(e³ − e)"], "a": 3, "s": "Let u = √x, so dx/√x = 2 du. ∫ = 2∫<sub>1</sub><sup>3</sup> e<sup>u</sup> du = 2(e³ − e).", "img": ""}, {"y": 2010, "n": "24", "t": "Integration", "q": "What is the value of ∫ x√(1 − x²) dx ?", "o": ["−(1/3)(1 − x²)^(3/2) + C", "−2x√(1 − x²) + C", "(1 − x²)^(1/2) + C", "(1/2)√(1 − x²) + C"], "a": 0, "s": "Let u = 1 − x², so x dx = −du/2. ∫√u(−du/2) = −(1/2)(2/3)u<sup>3/2</sup> + C = −(1/3)(1 − x²)<sup>3/2</sup> + C.", "img": ""}, {"y": 2010, "n": "25", "t": "Applications of derivatives", "q": "Which one of the following is NOT true about the function f(x) = 3x⁴ − 4x³?", "o": ["(0, 0) is a point of inflection of f.", "0 and 1 are critical numbers of f.", "f is concave upward on (0, 2/3) and concave downward on (−∞, 0) and on (2/3, ∞).", "f is decreasing on (−∞, 1) and increasing on (1, ∞)."], "a": 2, "s": "f′ = 12x²(x − 1) gives critical numbers 0 and 1, and f decreases up to 1 then increases. f″ = 12x(3x − 2) is negative on (0, 2/3) and positive elsewhere, so f is concave DOWN on (0, 2/3) and concave UP on (−∞, 0) and (2/3, ∞). Statement C has this reversed, so C is the one that is not true. Inflection points are at x = 0 and x = 2/3.", "img": ""}, {"y": 2010, "n": "26", "t": "Limits", "q": "What is the value of lim_{x→0} (1/x²)·sin²(x/2) ?", "o": ["1/2", "1/4", "2", "4"], "a": 1, "s": "Let u = x/2. Then sin²(u)/(2u)² = (1/4)(sin u/u)² → 1/4.", "img": ""}, {"y": 2010, "n": "27", "t": "Limits", "q": "If f(x) = |x|/x and g(x) = (x + 2)/(x³ − 4x), then what is the value of lim_{x→−2} (f(x) + g(x)) ?", "o": ["−9/8", "∞", "9/8", "−7/8"], "a": 3, "s": "Near −2, f(x) = |x|/x = −1. g(x) = (x + 2)/(x(x + 2)(x − 2)) = 1/(x(x − 2)) → 1/((−2)(−4)) = 1/8. Sum: −1 + 1/8 = −7/8.", "img": ""}, {"y": 2010, "n": "34", "t": "Integration", "q": "What is the value of ∫ (1/x)(ln x + x²e^(−x)) dx ?", "o": ["½x² ln x − (x + 1)e^(−x) + C", "½ln²x − (x + 1)e^(−x) + C", "½x² ln x + (2 − x)e^(−x) + C", "½ln²x + (2 − x)e^(−x) + C"], "a": 1, "s": "Split into ∫(ln x)/x dx + ∫ x e<sup>−x</sup> dx. The first is ½ ln²x. By parts, ∫ x e<sup>−x</sup> dx = −x e<sup>−x</sup> − e<sup>−x</sup> = −(x + 1)e<sup>−x</sup>.", "img": ""}, {"y": 2010, "n": "35", "t": "Applications of derivatives", "q": "If f(x) = (1/3)x³ + cx² + ax + 5 has a local minimum value at x = 1, then which one of the following is true about the possible values of a and c?", "o": ["a = 3, c = −2", "a = −2c − 1, any real number", "a = −2c − 1, c &lt; −1", "a = −2c − 1, c &gt; −1"], "a": 3, "s": "f′(x) = x² + 2cx + a. f′(1) = 0 gives 1 + 2c + a = 0, so a = −2c − 1. For a minimum f″(1) = 2 + 2c &gt; 0, so c &gt; −1.", "img": ""}, {"y": 2010, "n": "36", "t": "Sequences", "q": "Let {a_n} be a sequence with a₁ = a, a₂ = f(a₁), a₃ = f(a₂), …, a_{n+1} = f(a_n), where f is a continuous function. If lim_{n→∞} a_n = 5, what is f(5)?", "o": ["5", "5ⁿ", "5^(n+1)", "1"], "a": 0, "s": "If a<sub>n</sub> → 5, then a<sub>n+1</sub> → 5 too. By continuity, f(a<sub>n</sub>) → f(5). So f(5) = 5.", "img": ""}, {"y": 2010, "n": "37", "t": "Series", "q": "If the sum of the first three consecutive terms of an arithmetic progression {A_n}, with A_n &gt; 0 for all n, is 9 and the sum of their squares is 35, then what is the sum S_n of the first n terms?", "o": ["n² + 1", "n² − 1", "n²", "2n² + 1"], "a": 2, "s": "a<sub>1</sub> + a<sub>2</sub> + a<sub>3</sub> = 9 gives a<sub>2</sub> = 3. Then a<sub>1</sub>² + a<sub>3</sub>² = 26 and a<sub>1</sub> + a<sub>3</sub> = 6, so a<sub>1</sub>a<sub>3</sub> = 5. Thus a<sub>1</sub> = 1, a<sub>3</sub> = 5, d = 2 (positive terms). S<sub>n</sub> = (n/2)(2 + 2(n − 1)) = n².", "img": ""}, {"y": 2010, "n": "41", "t": "Derivatives", "q": "If f(x) = k ln x + e^(sin x) and f″(π) = −1, then what is the value of k?", "o": ["2π²", "π²", "π", "2π"], "a": 0, "s": "f′ = k/x + cos x·e<sup>sin x</sup>. f″ = −k/x² − sin x·e<sup>sin x</sup> + cos²x·e<sup>sin x</sup>. At x = π: −k/π² − 0 + 1 = −1, so k = 2π².", "img": ""}, {"y": 2010, "n": "43", "t": "Related rates", "q": "A cylindrical tank whose inner diameter is 2 m contains 4π m³ of oil. If the oil is discharged from the tank at the rate of 2π/3 m³/min, then how long (in min) does it take for the tank to be empty?", "o": ["4/3", "4", "12", "6"], "a": 3, "s": "With r = 1: V = πr²h = πh, so the oil height is h = 4 m. dV/dt = π·dh/dt gives dh/dt = 2/3 m/min. Time = 4/(2/3) = 6 min.", "img": ""}, {"y": 2010, "n": "44", "t": "Continuity", "q": "What are the values of a and b so that the function f(x) = x + 1 for x &lt; 1, f(x) = ax + b for 1 ≤ x &lt; 2, f(x) = 3x for x ≥ 2 is continuous everywhere?", "o": ["a = 4, b = −2", "a = −4, b = −2", "a = 4, b = 2", "a = −4, b = 2"], "a": 0, "s": "At x = 1: a + b = 2. At x = 2: 2a + b = 6. Subtracting gives a = 4, then b = −2.", "img": ""}, {"y": 2010, "n": "46", "t": "Optimization", "q": "What is the maximum possible area of a rectangle, in square units, with a diagonal of length 16 units?", "o": ["48", "128", "64", "256"], "a": 1, "s": "x² + y² = 256 and A = xy = x√(256 − x²). Maximize A² = 256x² − x⁴: 512x − 4x³ = 0 gives x² = 128, x = 8√2 (a square). A = (8√2)(8√2) = 128.", "img": ""}, {"y": 2010, "n": "47", "t": "Derivatives", "q": "Let f(x) = ln(x√x). Then what is f′(x) equal to?", "o": ["2x/3", "√x/2", "2/(x√x)", "3/(2x)"], "a": 3, "s": "x√x = x<sup>3/2</sup>, so f(x) = (3/2) ln x and f′(x) = 3/(2x).", "img": ""}, {"y": 2010, "n": "49", "t": "Series", "q": "What is the sum of the series Σ_{n=1}^{∞} 3ⁿ·4^(−n) ?", "o": ["∞", "3/16", "3", "4"], "a": 2, "s": "3<sup>n</sup>/4<sup>n</sup> = (3/4)<sup>n</sup>: first term 3/4, ratio 3/4. S = (3/4)/(1 − 3/4) = 3.", "img": ""}, {"y": 2010, "n": "52", "t": "Integration", "q": "What is the value of lim_{n→∞} Σ_{k=1}^{n} (2/n)[(2k/n)³ + 5(2k/n)] ?", "o": ["4", "14", "10", "−18"], "a": 1, "s": "This is a Riemann sum for ∫<sub>0</sub><sup>2</sup> (x³ + 5x) dx = [x⁴/4 + 5x²/2] = 4 + 10 = 14. (Using sum formulas: 16/n⁴·(n²(n+1)²/4) + 20/n²·(n(n+1)/2) → 4 + 10.)", "img": ""}];
Q.push(...[{"y": 2011, "n": "1", "t": "Applications of derivatives", "q": "Which one of the following is the set of critical numbers of f(x) = 3/8 x^(8/3) − 6x^(2/3) ?", "o": ["{−2, 2}", "{−1, 1}", "{−1, 0, 1}", "{−2, 0, 2}"], "a": 3, "s": "f′(x) = x^(5/3) − 4x^(−1/3) = (x² − 4)/x^(1/3). f′(x) = 0 at x = ±2, and f′ is undefined at x = 0 where f itself is defined, so x = 0 is also a critical number. The set is {−2, 0, 2}.", "img": ""}, {"y": 2011, "n": "2", "t": "Sequences", "q": "What is the greatest lower bound of the sequence {(−1)^n/(n + 1)}, n = 0, 1, 2, … ?", "o": ["−1", "0", "−1/2", "1/2"], "a": 2, "s": "The terms are 1, −1/2, 1/3, −1/4, … The even-indexed terms are positive and the odd-indexed terms are negative and increase toward 0. The smallest term is −1/2 (n = 1), so the greatest lower bound is −1/2.", "img": ""}, {"y": 2011, "n": "6", "t": "Limits", "q": "What is the value of lim_{n→∞} (3^n + 2^n)/6^n ?", "o": ["1", "0", "∞", "5/6"], "a": 1, "s": "(3^n + 2^n)/6^n = (1/2)^n + (1/3)^n → 0 + 0 = 0.", "img": ""}, {"y": 2011, "n": "7", "t": "Derivatives", "q": "If F(x) = ∫_0^x e^{−t} dt, then what is the value of F′(x) ?", "o": ["e^{−x}", "−e^{−x} − 1", "e^{−x+1}/(−x + 1)", "−e^{−x}"], "a": 0, "s": "By the Fundamental Theorem of Calculus, F′(x) = e^{−x}.", "img": ""}, {"y": 2011, "n": "9", "t": "Sequences", "q": "If a_1 = 2, a_2 = 6, a_3 = 10, a_4 = 14, …, then Σ_{n=1}^{100} a_n = ____", "o": ["20,020", "20,200", "20,000", "22,000"], "a": 2, "s": "The sequence is arithmetic with a_1 = 2 and d = 4, so a_n = 4n − 2 and a_100 = 398. S_100 = 100/2 (a_1 + a_100) = 50(2 + 398) = 20,000.", "img": ""}, {"y": 2011, "n": "10", "t": "Limits", "q": "What is the value of lim_{h→0} (8(1/2 + h)² − 8(1/2)²)/h ?", "o": ["0", "4", "8", "The limit does not exist"], "a": 2, "s": "This is the derivative of f(x) = 8x² at x = 1/2. Since f′(x) = 16x, the limit is 16·(1/2) = 8.", "img": ""}, {"y": 2011, "n": "13", "t": "Derivatives", "q": "Let f(x) = 2e^x − k sin x + 1. If the equation of the tangent line to the graph of f at (0, 3) is y = 5x + 3, then what is the value of k ?", "o": ["3", "−3", "−5", "2"], "a": 1, "s": "f′(x) = 2e^x − k cos x, so the slope is f′(0) = 2 − k = 5, giving k = −3. (Check: f(0) = 2 + 1 = 3.)", "img": ""}, {"y": 2011, "n": "14", "t": "Sequences", "q": "Every day a person saves 5 cents more than the amount he saved on the previous day. His target is to save the total amount of 3225 cents by the end of 30 days. How much must be the starting saving to meet the target?", "o": ["35 cents", "25 cents", "50 cents", "60 cents"], "a": 0, "s": "Arithmetic sequence with d = 5 and n = 30: S_30 = 30/2 (2a + 29·5) = 3225, so 2a + 145 = 215 and a = 35 cents.", "img": ""}, {"y": 2011, "n": "17", "t": "Integration", "q": "What is the value of ∫_1^2 (ln x)/(x²) dx ?", "o": ["−(ln 2)/2 − 1/2", "(ln 2)/2 − 1/2", "−(ln 2)/2 + 1/2", "(ln 2)/2 + 1/2"], "a": 2, "s": "Integrate by parts: ∫(ln x)/(x²) dx = −(ln x)/x − 1/x. At x = 2 this is −(ln 2)/2 − 1/2; at x = 1 it is −1. The difference is −(ln 2)/2 − 1/2 + 1 = −(ln 2)/2 + 1/2.", "img": ""}, {"y": 2011, "n": "23", "t": "Limits", "q": "What is the value of the left-hand side limit lim_{x→0⁻} ((sin x)/(x²))√(4x³ + 9x²) ?", "o": ["−3", "3", "2", "Does not exist"], "a": 0, "s": "For x &lt; 0, √(4x³ + 9x²) = √(x²(4x + 9)) = |x|√(4x + 9) = −x√(4x + 9). So the expression equals −((sin x)/x)√(4x + 9) → −1·√9 = −3.", "img": ""}, {"y": 2011, "n": "24", "t": "Limits", "q": "What is the value of lim_{x→2} (x³ − 8)/(x² − 4) ?", "o": ["2", "3", "−2", "The limit does not exist"], "a": 1, "s": "(x³ − 8)/(x² − 4) = ((x − 2)(x² + 2x + 4))/((x − 2)(x + 2)) = (x² + 2x + 4)/(x + 2) → 12/4 = 3.", "img": ""}, {"y": 2011, "n": "25", "t": "Applications of derivatives", "q": "If f(x) = ax³ + b/x + 5 has a local minimum at (2, −3), what are the values of a and b ?", "o": ["a = −1/4, b = 12", "a = −1/4, b = −12", "a = 1/4, b = 12", "a = 1/4, b = −12"], "a": 1, "s": "f(2) = −3 gives 8a + b/2 + 5 = −3, so 16a + b = −16. f′(x) = 3ax² − b/x² and f′(2) = 0 gives 12a − b/4 = 0, so b = 48a. Then 64a = −16, so a = −1/4 and b = −12. (B is the only option satisfying both conditions. Note that f″(2) = −6 &lt; 0, so this point is in fact a local maximum.)", "img": ""}, {"y": 2011, "n": "26", "t": "Integration", "q": "What is the value of ∫ (x^{e−1} + e^{x−1})/(x^e + e^x) dx ?", "o": ["1/e ln(x^e + e^{x+1}) + c", "1/e ln(x^e + e^x) + c", "1/e ln((x + 1)^e + e^{x+1}) + c", "1/e ln(x^{e+1} + e^{x+1}) + c"], "a": 1, "s": "d/dx (x^e + e^x) = e·x^{e−1} + e^x = e(x^{e−1} + e^{x−1}). So the numerator is 1/e times the derivative of the denominator, and the integral is 1/e ln(x^e + e^x) + c.", "img": ""}, {"y": 2011, "n": "27", "t": "Applications of integrals", "q": "What is the area of the region bounded by the lines x = 0, x = 2, and y = 1 and the curve y = e^{2x} ?", "o": ["e^4/2 − 5/2", "e^2/2 − 1/2", "e^3/3 − 1/3", "−e^4/2 + 5/2"], "a": 0, "s": "On [0, 2], e^{2x} ≥ 1, so the area is ∫_0^2 (e^{2x} − 1) dx = (e^{2x}/2 − x) evaluated from 0 to 2 = (e^4/2 − 2) − 1/2 = e^4/2 − 5/2.", "img": ""}, {"y": 2011, "n": "28", "t": "Applications of integrals", "q": "If the region enclosed by the graphs of f(x) = x² and f(x) = x³ from x = 0 to x = 1 rotates about the x-axis, what is the volume of the solid of revolution?", "o": ["2π/27 cubic units", "2π/25 cubic units", "2π/5 cubic units", "2π/35 cubic units"], "a": 3, "s": "On [0, 1], x² ≥ x³, so V = π∫_0^1 (x^4 − x^6) dx = π(1/5 − 1/7) = 2π/35 cubic units.", "img": ""}, {"y": 2011, "n": "34", "t": "Sequences", "q": "If the second and fifth terms of a geometric progression are −1/2 and 1/16, respectively, what is the sum of the first eight terms of the sequence?", "o": ["85/128", "255/256", "128/85", "256/255"], "a": 0, "s": "ar = −1/2 and ar^4 = 1/16, so r^3 = −1/8, r = −1/2 and a = 1. Then S_8 = (1 − r^8)/(1 − r) = (1 − 1/256)/(3/2) = 85/128.", "img": ""}, {"y": 2011, "n": "35", "t": "Sequences", "q": "What is the limit of the sequence 1, 2/(2² − 1²), 3/(3² − 2²), 4/(4² − 3²), … ?", "o": ["0", "1", "1/2", "3/2"], "a": 2, "s": "The n-th term is n/(n² − (n − 1)²) = n/(2n − 1), and its limit as n → ∞ is 1/2.", "img": ""}, {"y": 2011, "n": "36", "t": "Applications of derivatives", "q": "At what value of x does the function f(x) = (4x^3)/3 − x^4 attain its maximum value?", "o": ["−1", "0", "1", "4/3"], "a": 2, "s": "f′(x) = 4x² − 4x³ = 4x²(1 − x) = 0 gives x = 0 or x = 1. f″(x) = 8x − 12x², and f″(1) = −4 &lt; 0, so the maximum is at x = 1. (At x = 0, f′ does not change sign, so it is not an extremum.)", "img": ""}, {"y": 2011, "n": "37", "t": "Integration", "q": "What is the solution of ∫ 4x(ln x + 1/x²) dx ?", "o": ["4x²(ln x + 1) − 2x² + c", "x²(4 ln x − 1) + 2 ln x + c", "x²(2 ln x + 1) + 4 ln x + c", "x²(2 ln x − 1) + 4 ln x + c"], "a": 3, "s": "Split into ∫4x ln x dx + ∫4/x dx. By parts, ∫4x ln x dx = 2x² ln x − x². So the result is 2x² ln x − x² + 4 ln x + c = x²(2 ln x − 1) + 4 ln x + c.", "img": ""}, {"y": 2011, "n": "42", "t": "Series", "q": "What is the sum of the infinite series Σ_{k=0}^{∞} 5((2^k + 5^k)/10^k) ?", "o": ["15", "25/4", "5", "65/4"], "a": 3, "s": "Write 5((2^k + 5^k)/10^k) = 5((1/5)^k + (1/2)^k). Both parts are geometric series starting at k = 0, so the sum is 5(1/(1 − 1/5) + 1/(1 − 1/2)) = 5(5/4 + 2) = 65/4.", "img": ""}, {"y": 2011, "n": "43", "t": "Derivatives", "q": "If f(x) = ln(2^{tan x}), then what is the value of f′(0) ?", "o": ["ln 2", "−2 ln 2", "(ln 2)/2", "1"], "a": 0, "s": "f(x) = tan x · ln 2, so f′(x) = ln 2 · sec²x and f′(0) = ln 2.", "img": ""}, {"y": 2011, "n": "44", "t": "Derivatives", "q": "If h(x) = √(1 + √x), then which of the following is equal to h′(x) ?", "o": ["1/(2√(1 + √x))", "1/(4√(x + x√x))", "x/(2√(1 + √x))", "x/(4√(x + x√x))"], "a": 1, "s": "By the chain rule, h′(x) = 1/(2√(1 + √x)) · 1/(2√x) = 1/(4√x · √(1 + √x)) = 1/(4√(x + x√x)).", "img": ""}, {"y": 2011, "n": "45", "t": "Optimization", "q": "A man wants to fence two identical rectangular enclosures in a field alongside a straight river as shown in the following figure. What is the maximum area of each enclosure that he can make with 192 meter fencing material if the side along the river does not need a fence?", "o": ["1530 m²", "1564 m²", "1664 m²", "1536 m²"], "a": 3, "s": "Let each enclosure have side a along the river and depth b. The fence needs 2a + 3b = 192, so b = 64 − 2a/3. The area of each is A = ab = 64a − (2/3)a². A′ = 64 − (4/3)a = 0 gives a = 48, b = 32, so A = 48·32 = 1536 m².", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAp4AAAC+CAIAAAATJ5jbAAABMmlDQ1BJQ0MgUHJvZmlsZQAAeJx9kD9Lw0AYxn+Wgv8H0dEhYxelKuigLlUsOkmNYHVK0zQVmhiSlCK4+QX8EIKzowi6CjoIgpvgRxAH1/qkQdIlvsd797vnHu7ufaEwhqJYBs+Pw1q1YhzVj43RT0Y0BmHZUUB+yPXznnrfFv7x5cV404lsrV/KZqjHdaUpnnNTbifcSPki4V4cxOKrhEOztiW+FpfcIW4MsR2Eif9FvOF1unb2b6Yc//BA645ynm1OiQjoYHGOwT4rmqvaeXSJxT05YtqiiJpOKiKTUA5fSgtHTNK/9InLD9h86Pf795m29wi3azBxl2mldZiZhKfnTMt6GlihNZCKykKrBd83MF2H2Vfdc/LXyJzajEFtVc40XNXmSNnVf20WRcuUWWL1Fx+iTfmvd1mpAAEAAElEQVR42uz9Z7Mk17ElCrr7FqFSHVkCAEG+N31Ft1nbG7OZ+f8/4XX3s1ZXkFAljk4VYgv3+eARefKUAAqE4CUvkiQMrDonMzJi7+1iLV8LRQT+Fl/H3wo//bdEAAARP+E9+ej/0a/3vY6fF+L3fDv53uv8gfcZf/mX/Y5/3jP6SU9Q//b40xD+Kr7Xx77j936WPK6Cx7/8yDP9kRd9vH4+drd/xM3CX/0cOPpcPvopOvqpj52M+DM965/vPOGj54IfeS6f8P78/rcRAADCo3fAD39RObqp+MP78cfet/eOqw88HfzRd+34NDhsFsCP3J8nS5XhnfsjwNO74b+Fg+PXi0m/vX57/fb67fXb69/3Sz6eMv32+jlf9q+5xv6+3/3zkp4fk13iX+ROjbXaWH1+70++f53yw1XIR//oFyhF8bj+Q/zB5yuf8HyPn+D7l/yT6stfpSL/c1fpu/WSHF3gky7Fx64af1xF/il38pMqe/x5yvgf/VyOlgnKY7wRQAB8/2rxF1gDP995gh88Hz76hT/2XD7wjPCd3Yfvvc/4Dvh9d2n6cf15AaCPfV95/D15Wj2/e9d/ei92/C7v/e3RNTz5vvjRFff4kyKPf/Xx3uEP3uyf4cz5mw3tv8IB+1eSvf21XOe/5WD61/vCv7n18O/nSf28v/u9YfeT3gZ/7u385/3Az3zH5b0v+DS0/4T3+61q/+310+u2XyaqEoAAyrRk8a/ru/zVJzUfwynf+3P8kXXMv/0k7tPvxs+xAI86Q4L/Ts6H9+v7T+EYfcqKPS5In34KTv9EgfdYLx/Zvvq78l4T8tPXwy9xwshPoOv8Oof330xo/60W+e312+u315/9+rfMOvqFqYa/9kH921n9q9xoYflgfJSnydivWCn+W4vXn8As/QnX/FOYxt//sT+9yvlJLOif6Tl+7Bp+Nob2J923n39S4Mc+nU9mxf8VdB1++nt+epWJv+Yx83O96ZP3kaNi+FPiIj+tjz/6L n which of the following is true?", "o": ["∫_a^b f(x) dx = F(b) − F(a)", "∫_a^b f′(x) dx = F(b) − F(a)", "∫_a^b F′(x) dx = f(b) − f(a)", "∫_a^b F(x) dx = f(b) − f(a)"], "a": 0, "s": "By the Fundamental Theorem of Calculus, ∫_a^b f(x) dx = F(b) − F(a) whenever F′ = f.", "img": ""}, {"y": 2013, "n": "31", "t": "Sequences", "q": "Which one of the following is the fourth term of the sequence {cos(nπ/2)} ?", "o": ["1", "0.5", "0", "−1"], "a": 0, "s": "Taking n = 1, 2, 3, 4, … the terms are cos(π/2) = 0, cos π = −1, cos(3π/2) = 0, cos 2π = 1. The fourth term is 1.", "img": ""}, {"y": 2013, "n": "32", "t": "Sequences", "q": "Which of the following is a geometric sequence?", "o": ["8, −4, 2, −1, …", "0.1, 0.11, 0.12, 0.13, …", "1, 1.5, 2.5, 3.5, …", "0.1, 0.01, 0.0011, 0.000111, …"], "a": 0, "s": "In A every term is −1/2 times the previous one, so it is geometric with r = −1/2. B has a constant difference of 0.01 (arithmetic). In C and D neither the differences nor the ratios are constant.", "img": ""}, {"y": 2013, "n": "33", "t": "Sequences", "q": "A factory that produces electric has sales Birr 1,000,000 the first day. During each successive day the sales increased by Birr 10,000 every day. What is the total sales of the factory in the first 10 days?", "o": ["Birr 20,900,000", "Birr 10,450,000", "Birr 10,000,000", "Birr 1,090,000"], "a": 1, "s": "Arithmetic sequence with a = 1,000,000 and d = 10,000. S_10 = 10/2 (2·1,000,000 + 9·10,000) = 5(2,090,000) = 10,450,000 Birr.", "img": ""}, {"y": 2013, "n": "34", "t": "Sequences", "q": "What is the least upper bound of the sequence {2 + n/(n + 1)}, n = 1, 2, 3, … ?", "o": ["3", "2", "1", "0"], "a": 0, "s": "The terms 2 + n/(n + 1) = 2.5, 2.67, 2.75, … increase toward 3 but never reach it, so the least upper bound is 3.", "img": ""}, {"y": 2013, "n": "35", "t": "Sequences", "q": "Which one of the following sequences is a null sequence?", "o": ["{n/(n + 1)}", "{(cos n)/n}", "{n sin(1/n)}", "{1 − 1/n}"], "a": 1, "s": "A, C and D all tend to 1. For B, −1/n ≤ (cos n)/n ≤ 1/n and both bounds tend to 0, so (cos n)/n → 0 by the squeeze theorem.", "img": ""}, {"y": 2013, "n": "36", "t": "Sequences", "q": "Suppose {a_n} and {b_n} are sequences with lim_{n→∞} a_n = L and lim_{n→∞} b_n = M. Then which of the following is NOT necessarily true?", "o": ["lim_{n→∞} (a_n/b_n) = L/M", "lim_{n→∞} a_n b_n = LM", "lim_{n→∞} (3a_n + 2b_n) = 3L + 2M", "lim_{n→∞} (a_n − b_n) = L − M"], "a": 0, "s": "The quotient law needs M ≠ 0; if M = 0 the ratio L/M is undefined and a_n/b_n need not converge to it. B, C and D follow from the product, sum and difference limit laws.", "img": ""}, {"y": 2013, "n": "37", "t": "Limits", "q": "lim_{x→∞} (3x² + 2x)/(5x − x²) is equal to:", "o": ["1", "0", "−1", "−3"], "a": 3, "s": "Divide the numerator and denominator by x²: (3 + 2/x)/(5/x − 1) → 3/(−1) = −3.", "img": ""}, {"y": 2013, "n": "38", "t": "Derivatives", "q": "Which of the following is the same as the derivative of a function f at a point P, where P is on the graph of f?", "o": ["The slope of the tangent line through P.", "The graph of f has no jump at P.", "The continuity of the function at P.", "The slope of a secant line through P."], "a": 0, "s": "The derivative of f at P is the slope of the tangent line to the graph at P (the limit of the slopes of secant lines through P).", "img": ""}, {"y": 2013, "n": "39", "t": "Derivatives", "q": "What is the derivative of the function f(x) = 3x² + 2√x − 4x at x = 1?", "o": ["3", "1", "−1", "−3"], "a": 0, "s": "f′(x) = 6x + 1/√x − 4, so f′(1) = 6 + 1 − 4 = 3.", "img": ""}, {"y": 2013, "n": "40", "t": "Derivatives", "q": "What are the 2nd and the nth derivative of f(x) = e^{3x} respectively?", "o": ["9f(x) and 3^n f(x)", "9f(x) and n²f(x)", "4f(x) and 2^n f(x)", "2f(x) and nf(x)"], "a": 0, "s": "f′(x) = 3e^{3x} and f″(x) = 9e^{3x} = 9f(x). Each differentiation multiplies by 3, so the nth derivative is 3^n e^{3x} = 3^n f(x).", "img": ""}, {"y": 2013, "n": "41", "t": "Applications of derivatives", "q": "Which of the following is true about the zero of a function?", "o": ["It is the concavity point of the function.", "It is the critical point of the function.", "It is the y-intercept of the function.", "It is the x-intercept of the function."], "a": 3, "s": "A zero of f is a value x with f(x) = 0, which is where the graph meets the x-axis, so it is the x-intercept.", "img": ""}, {"y": 2013, "n": "42", "t": "Applications of derivatives", "q": "Which of the following is true about the function defined f(x) = x³ − 3x² on [−1, 3]?", "o": ["It has critical numbers at 0 and 2 and its maximum value is 0.", "Its critical numbers 0 and 2 and its maximum value is −4.", "Its critical numbers 0 and 2 and its maximum value is 15.", "Its critical numbers 0, 2, 3 and its maximum value is 0."], "a": 0, "s": "f′(x) = 3x² − 6x = 3x(x − 2) = 0 gives critical numbers 0 and 2. Compare values at the critical numbers and endpoints: f(−1) = −4, f(0) = 0, f(2) = −4, f(3) = 0. The maximum value is 0 (x = 3 is an endpoint, not a critical number).", "img": ""}, {"y": 2013, "n": "43", "t": "Applications of derivatives", "q": "What is the number that satisfies Rolle’s Theorem for f(x) = x² − 3x + 1 on [0, 3]?", "o": ["2", "3/2", "1", "−3/2"], "a": 1, "s": "f(0) = f(3) = 1, so Rolle’s Theorem applies. f′(c) = 2c − 3 = 0 gives c = 3/2.", "img": ""}, {"y": 2013, "n": "44", "t": "Optimization", "q": "What are the length L and width W of a rectangle with perimeter 10,000 m that maximizes the area?", "o": ["L = 5,000 m and W = 5,000 m", "L = 3,000 m and W = 2,500 m", "L = 2,500 m and W = 3,000 m", "L = 2,500 m and W = 2,500 m"], "a": 3, "s": "2L + 2W = 10,000, so W = 5,000 − L and A = L(5,000 − L). A′ = 5,000 − 2L = 0 gives L = 2,500 and W = 2,500 (a square), with area 6,250,000 m².", "img": ""}, {"y": 2013, "n": "45", "t": "Related rates", "q": "If the radius r of a sphere is increasing at the rate of 2 cm/min, then the rate of change of the volume when r = 1 cm is", "o": ["12π cm³/min", "8π cm³/min", "6π cm³/min", "4π cm³/min"], "a": 1, "s": "V = (4/3)πr³, so (dV)/(dt) = 4πr²·(dr)/(dt) = 4π(1)²(2) = 8π cm³/min.", "img": ""}, {"y": 2013, "n": "46", "t": "Integration", "q": "Which of the following is equal to ∫(cos x − 2x) dx where c is a constant?", "o": ["sin x − x² + C", "−sin x + x² + C", "sin x + x² + C", "−sin x − x² + C"], "a": 0, "s": "∫cos x dx = sin x and ∫2x dx = x², so the result is sin x − x² + C.", "img": ""}, {"y": 2013, "n": "47", "t": "Applications of integrals", "q": "What is the area of the region bounded by y = 0 and the graph of f(x) = 4 − x² on the interval [−1, 1]?", "o": ["26/3", "8", "22/3", "2/3"], "a": 2, "s": "Since 4 − x² &gt; 0 on [−1, 1], the area is ∫_{−1}^{1} (4 − x²) dx = 2∫_0^1 (4 − x²) dx = 2(4 − 1/3) = 22/3.", "img": ""}, {"y": 2013, "n": "54", "t": "Series", "q": "Which of the following is convergent?", "o": ["Σ_{n=1}^{∞} (3/2)^n", "Σ_{n=1}^{∞} 2^{2n−5}", "Σ_{n=1}^{∞} 5^{11−2n}", "Σ_{n=1}^{∞} (2/5)^{−n}"], "a": 2, "s": "A: ratio 3/2 &gt; 1, diverges. B: 2^{2n−5} = 4^n/32 grows without bound, diverges. C: 5^{11−2n} = 5^{11}·(1/25)^n is geometric with ratio 1/25 &lt; 1, so it converges. D: (2/5)^{−n} = (5/2)^n has ratio 5/2 &gt; 1, diverges.", "img": ""}, {"y": 2013, "n": "55", "t": "Continuity", "q": "Let f be a function defined on a closed bounded interval [a, b]. Which of the following describes that f is continuous on [a, b]?", "o": ["f is continuous on (a, b), f is continuous from the left at a and from the right at b.", "f is continuous on (a, b), f is continuous from the left at a and from the left at b.", "f is continuous on (a, b), f is continuous from the right at a and from the left at b.", "f is continuous at each point in (a, b) and at both a and b."], "a": 2, "s": "Continuity on a closed interval [a, b] means continuity at every point of (a, b), right-continuity at the left endpoint a (lim_{x→a⁺} f(x) = f(a)) and left-continuity at the right endpoint b (lim_{x→b⁻} f(x) = f(b)).", "img": ""}, {"y": 2013, "n": "56", "t": "Applications of derivatives", "q": "A position of a particle is given by the equation S(t) = 4t⁴ − 4t + 1 where t is measured in seconds and S in meters. Which of the following is NOT true about the motion of the particle?", "o": ["The acceleration of the particle at 1 sec is 48 m/sec².", "The particle is at rest at t = 0.5 seconds.", "The velocity at 2 seconds is given by 124 m/sec.", "The velocity v at any time t is given by v(t) = 16t³ − 4."], "a": 1, "s": "v(t) = S′(t) = 16t³ − 4 and a(t) = v′(t) = 48t². So a(1) = 48, v(2) = 128 − 4 = 124, and D is correct. The particle is at rest when v = 0: 16t³ = 4, t = (1/4)^{1/3} ≈ 0.63 s, not 0.5 s (indeed v(0.5) = −2). So B is not true.", "img": ""}, {"y": 2013, "n": "57", "t": "Derivatives", "q": "If f′(1) = 4, f(1) = 3 and g′(3) = 5, then (g∘f)′(1) is equal to", "o": ["20", "15", "5", "3"], "a": 0, "s": "By the chain rule, (g∘f)′(1) = g′(f(1))·f′(1) = g′(3)·4 = 5·4 = 20.", "img": ""}, {"y": 2013, "n": "58", "t": "Integration", "q": "Which of the following is true where c is a constant?", "o": ["∫ ln x dx = 1/x + c", "∫ x e^x dx = (x²/2) e^x + c", "∫ (sin √x)/(√x) dx = −2 cos √x + c", "∫ (3x + 5)^6 dx = (3x + 5)^7/7 + c"], "a": 2, "s": "Check C by differentiating: d/dx(−2 cos √x) = 2 sin √x · 1/(2√x) = (sin √x)/(√x). The others are false: ∫ln x dx = x ln x − x + c; ∫x e^x dx = (x − 1)e^x + c; ∫(3x + 5)^6 dx = (3x + 5)^7/21 + c.", "img": ""}, {"y": 2013, "n": "59", "t": "Integration", "q": "The acceleration of a body at any time t is given by a(t) = 4 − 2t + 3t² with initial velocity v(0) = 5. Then what is the velocity v of the body as a function of time?", "o": ["v(t) = −2 + 6t", "v(t) = 9 − t² + t³", "v(t) = 1 + 4t − t² + t³", "v(t) = 5 + 4t − t² + t³"], "a": 3, "s": "v(t) = ∫a(t) dt = 4t − t² + t³ + C. The condition v(0) = 5 gives C = 5, so v(t) = 5 + 4t − t² + t³.", "img": ""}, {"y": 2014, "n": "30", "t": "Sequences", "q": "What is the seventh term of an arithmetic sequence whose third term is −4 and common difference is 5?", "o": ["−16", "16", "−15", "15"], "a": 1, "s": "a_7 = a_3 + 4d = −4 + 4·5 = 16.", "img": ""}, {"y": 2014, "n": "31", "t": "Sequences", "q": "The sum of the first 8 terms of a geometric sequence with first term 0.3 and common ratio 1/10 is equal to:", "o": ["3/10·((10^8 − 1)/10^9)", "1/3·((10^8 − 1)/10^7)", "1/3·((10^8 − 1)/10^8)", "3/10·((10^8 − 1)/10^8)"], "a": 2, "s": "S_8 = 0.3(1 − (1/10)^8)/(1 − 1/10) = 0.3·(10/9)(1 − 1/10^8) = 1/3·((10^8 − 1)/10^8).", "img": ""}, {"y": 2014, "n": "32", "t": "Derivatives", "q": "Let f and g be two functions. Which one of the following statements is true about f or g?", "o": ["The line y = 0 is a tangent line to the graph of f(x) = |x| at (0, 0).", "If f is differentiable at a, then it is continuous at a.", "If f′(a) = 0, then the tangent line to the graph of f at (a, f(a)) is y = a.", "If f and g are differentiable at a, then f/g is differentiable at a."], "a": 1, "s": "Differentiability at a implies continuity at a, so B is true. A is false: |x| has a corner at 0, so there is no tangent line there. C is false: the tangent line is y = f(a), not y = a. D is false when g(a) = 0.", "img": ""}, {"y": 2014, "n": "33", "t": "Derivatives", "q": "What is the derivative of the function f(x) = (x e^x)/(cos x) at x = 0?", "o": ["2", "−1", "1", "0"], "a": 2, "s": "By the quotient rule, f′(x) = [(e^x + x e^x) cos x + x e^x sin x]/(cos²x). At x = 0 this is (1·1 + 0 + 0)/1 = 1.", "img": ""}, {"y": 2014, "n": "34", "t": "Integration", "q": "Let f be a continuous function on [a, b]. Then which of the following is NOT true?", "o": ["∫_c^c f(x) dx = 0 for any c in (a, b).", "∫_a^b f(x) dx = ∫_a^c f(x) dx − ∫_c^b f(x) dx for any c in (a, b).", "∫_a^b k f(x) dx = k ∫_a^b f(x) dx for any constant k.", "∫_a^b f(x) dx = −∫_b^a f(x) dx"], "a": 1, "s": "By additivity, ∫_a^b f(x) dx = ∫_a^c f(x) dx + ∫_c^b f(x) dx, with a plus sign, so B is false. A, C and D are standard properties (zero-width interval, constant multiple, reversing the limits).", "img": ""}, {"y": 2014, "n": "35", "t": "Derivatives", "q": "Suppose f is a twice continuously differentiable function and f″(3) = 5. If g(x) = f(2x + 3), then the second derivative of g at 0 is equal to:", "o": ["40", "20", "5", "10"], "a": 1, "s": "g′(x) = 2f′(2x + 3) and g″(x) = 4f″(2x + 3). So g″(0) = 4f″(3) = 4·5 = 20.", "img": ""}, {"y": 2014, "n": "36", "t": "Integration", "q": "What is the value of ∫_0^1 x e^x dx ?", "o": ["−e", "e", "1", "−1"], "a": 2, "s": "By parts, ∫x e^x dx = x e^x − e^x = (x − 1)e^x. Evaluating from 0 to 1 gives 0 − (−1) = 1.", "img": ""}, {"y": 2014, "n": "37", "t": "Derivatives", "q": "Which one of the following is the derivative of f(x) = tan x + 3^x ?", "o": ["−tan x + 3^x ln 3", "sec²x + 3^x", "sec²x + 3^x ln 3", "−csc²x + 3^x ln 3"], "a": 2, "s": "The derivative of tan x is sec²x and the derivative of 3^x is 3^x ln 3, which matches option C.", "img": ""}, {"y": 2014, "n": "38", "t": "Integration", "q": "∫(1/√x − e^{−3x} + 5/x²) dx is equal to:", "o": ["2√x − e^{−3x}/3 + 5/x + c", "2√x − e^{−3x}/3 − 5/x + c", "2√x + e^{−3x}/3 − 5/x + c", "2√x + e^{−3x}/3 + 5/x + c"], "a": 2, "s": "∫x^{−1/2} dx = 2√x, ∫−e^{−3x} dx = e^{−3x}/3, and ∫5x^{−2} dx = −5/x. So the result is 2√x + e^{−3x}/3 − 5/x + c.", "img": ""}, {"y": 2014, "n": "48", "t": "Continuity", "q": "If f and g are continuous functions at a, then which of the following functions may NOT be continuous at a?", "o": ["f − 2g", "f/g", "f·g", "2f + 3g"], "a": 1, "s": "Sums, differences, constant multiples and products of functions that are continuous at a are continuous at a. The quotient f/g is continuous at a only if g(a) ≠ 0, so it may fail to be.", "img": ""}, {"y": 2014, "n": "49", "t": "Continuity", "q": "What is the value of a for which the function defined by f(x) = ax + 3 for x ≥ 1 and f(x) = x² − 2x + 3 for x &lt; 1 is continuous at 1?", "o": ["4", "3", "−1", "1"], "a": 2, "s": "From the left, lim_{x→1⁻} f(x) = 1 − 2 + 3 = 2. Continuity at 1 requires f(1) = a + 3 = 2, so a = −1.", "img": ""}, {"y": 2014, "n": "50", "t": "Limits", "q": "If lim_{x→2} f(x) = 6 and lim_{x→2} g(x) = −9, then lim_{x→2} ((f − g)/(2f − 7))(x) = ____", "o": ["−15", "15", "−3", "3"], "a": 3, "s": "By the limit laws, the limit is (6 − (−9))/(2·6 − 7) = 15/5 = 3.", "img": ""}, {"y": 2014, "n": "51", "t": "Sequences", "q": "Which of the following is true about bounded sequences?", "o": ["Every monotone bounded sequence converges.", "Every decreasing bounded sequence converges to the least upper bound of the sequence.", "Every increasing bounded sequence converges to the greatest lower bound of the sequence.", "Every bounded sequence is convergent."], "a": 0, "s": "By the Monotone Convergence Theorem, every monotone bounded sequence converges, so A is true. A decreasing bounded sequence converges to its greatest lower bound and an increasing one to its least upper bound, so B and C are false. A bounded sequence need not converge, for example (−1)^n, so D is false.", "img": ""}, {"y": 2014, "n": "52", "t": "Optimization", "q": "If the perimeter of a rectangle is 120 m, what are the length l and width w of the rectangle that maximizes its area?", "o": ["l = 50 m and w = 10 m", "l = 30 m and w = 30 m", "l = 35 m and w = 25 m", "l = 40 m and w = 20 m"], "a": 1, "s": "2l + 2w = 120, so w = 60 − l and A = l(60 − l). A′ = 60 − 2l = 0 gives l = 30 and w = 30 (a square).", "img": ""}, {"y": 2014, "n": "53", "t": "Applications of derivatives", "q": "Let f be a continuous function on ℝ and c be a number in the domain of f. Which one of the following must be true about the function?", "o": ["An absolute maximum value of f which is attained at a critical number is also a local maximum value of f.", "If f(c) is a local minimum value of f, then f′(c) = 0.", "If f″(c) = 0, then (c, f(c)) is an inflection point of f.", "If c is a critical number of f, then f(c) is a local extreme value of f."], "a": 0, "s": "An absolute maximum is the largest value on the whole domain, so it is also the largest value near its location, i.e. a local maximum. B is false because f need not be differentiable at c (for example |x| at 0). C is false: f(x) = x⁴ has f″(0) = 0 but no inflection point. D is false: f(x) = x³ has a critical number 0 but no extreme value there.", "img": ""}, {"y": 2014, "n": "54", "t": "Applications of derivatives", "q": "Suppose f is a continuous function on an interval [a, b] and differentiable on (a, b) with the property f(a) = f(b). Which one of the following must be true?", "o": ["The function has a zero in (a, b).", "The function has minimum value in (a, b).", "The function has maximum value in (a, b).", "The graph of f has horizontal tangent line at (c, f(c)) for some c ∈ (a, b)."], "a": 3, "s": "This is Rolle’s Theorem: there is some c in (a, b) with f′(c) = 0, which means a horizontal tangent line at (c, f(c)). The others need not hold: f(x) = x² + 1 on [−1, 1] has no zero, and f(x) = sin x on [0, π] has no minimum value inside (0, π).", "img": ""}, {"y": 2014, "n": "59", "t": "Integration", "q": "∫(x³ + x² − x)/(x² + x − 2) dx is equal to:", "o": ["x²/2 + 1/3 ln|x − 1| + 2/3 ln|x + 2| + c", "x²/2 − 1/3 ln|x − 1| − 2/3 ln|x + 2| + c", "x²/2 − 1/3 ln|x − 1| + 2/3 ln|x + 2| + c", "x²/2 + 1/3 ln|x − 1| − 2/3 ln|x + 2| + c"], "a": 0, "s": "Dividing, (x³ + x² − x)/(x² + x − 2) = x + x/((x − 1)(x + 2)). By partial fractions, x/((x − 1)(x + 2)) = 1/(3(x − 1)) + 2/(3(x + 2)). Integrating gives x²/2 + 1/3 ln|x − 1| + 2/3 ln|x + 2| + c.", "img": ""}, {"y": 2015, "n": "36", "t": "Limits", "q": "What is the value of lim_{x→1} (x² − 1)/(x² + 1) ?", "o": ["3", "1", "2", "0"], "a": 3, "s": "The denominator does not vanish at x = 1, so substitute directly: (1 − 1)/(1 + 1) = 0/2 = 0.", "img": ""}, {"y": 2015, "n": "37", "t": "Continuity", "q": "Which one of the following is the value of a so that the function given by f(x) = ax + 1 for x ≥ 1 and f(x) = x² − 4 for x &lt; 1 is continuous at 1?", "o": ["4", "−4", "−1", "1"], "a": 1, "s": "From the left, lim_{x→1⁻} f(x) = 1 − 4 = −3. Continuity at 1 requires f(1) = a + 1 = −3, so a = −4.", "img": ""}, {"y": 2015, "n": "39", "t": "Sequences", "q": "What is the fifth term of the sequence {2^n + 4n − 5}, n = 0, 1, 2, … ?", "o": ["27", "17", "47", "15"], "a": 0, "s": "Since n starts at 0, the fifth term corresponds to n = 4: 2^4 + 4·4 − 5 = 16 + 16 − 5 = 27. (If the count started at n = 1, then n = 5 would give 47.)", "img": ""}, {"y": 2015, "n": "40", "t": "Sequences", "q": "If the 6th and the 11th term of an arithmetic sequence are 35 and 75 respectively, then what is the sum of the first 31 terms of the sequence?", "o": ["2145", "724", "2635", "846"], "a": 2, "s": "From a_6 = 35 and a_11 = 75: 5d = 40, so d = 8 and a_1 = 35 − 5·8 = −5. Then S_31 = 31/2 (2a_1 + 30d) = 31/2 (−10 + 240) = 3565, which is not among the options. Option C (2635) is what you get if the 11th term were 60 (d = 5, S_31 = 31·a_16 = 31·85 = 2635), so C is probably the intended answer. As printed, the numbers do not match any option, so the 11th term in the source may differ.", "img": ""}, {"y": 2015, "n": "41", "t": "Sequences", "q": "Which one of the following numbers is an upper bound of the sequence {(2n + 1)/(n + 1)}, n = 1, 2, 3, … ?", "o": ["3/2", "0", "1", "4"], "a": 3, "s": "(2n + 1)/(n + 1) = 2 − 1/(n + 1), so every term is less than 2 and the terms approach 2. An upper bound must be at least 2, and of the options only 4 qualifies.", "img": ""}, {"y": 2015, "n": "42", "t": "Sequences", "q": "Let the sequence {a_n} converge to 3 while {b_n} converges to −1. Then the sequence {a_n − b_n} converges to", "o": ["1", "4", "3", "1/3"], "a": 1, "s": "By the difference law, lim (a_n − b_n) = 3 − (−1) = 4.", "img": ""}, {"y": 2015, "n": "45", "t": "Integration", "q": "Which of the following is equal to ∫3cos 3x dx ?", "o": ["1/3 sin 3x + c", "sin 3x + c", "sin x + c", "−sin x + c"], "a": 1, "s": "d/dx(sin 3x) = 3cos 3x, so ∫3cos 3x dx = sin 3x + c.", "img": ""}, {"y": 2015, "n": "46", "t": "Applications of integrals", "q": "What is the area of the region bounded by the graph of f(x) = x² − 4 and the x-axis in square units?", "o": ["16", "32", "16/3", "32/3"], "a": 3, "s": "The graph meets the x-axis at x = ±2 and lies below it in between. By symmetry, Area = 2∫_0^2 (4 − x²) dx = 2(8 − 8/3) = 32/3.", "img": ""}, {"y": 2015, "n": "47", "t": "Integration", "q": "Let f be a continuous function on [0, 1] and let F be an anti-derivative of f with F(1) = −11 and F(0) = 11. Then ∫_0^1 f(x) dx is equal to", "o": ["−22", "11", "0", "22"], "a": 0, "s": "∫_0^1 f(x) dx = F(1) − F(0) = −11 − 11 = −22.", "img": ""}, {"y": 2015, "n": "58", "t": "Related rates", "q": "Water is running into a conical tank which is pointed down at a constant rate of 6π cm³/sec. The cone has height of 10 cm and base radius 5 cm, then how fast is the water level rising when the water reaches 2 cm deep?", "o": ["4/π cm/sec", "6 cm/sec", "4 cm/sec", "6/π cm/sec"], "a": 1, "s": "At depth h the water surface has radius r = h/2 (similar triangles: 5/10). Then V = (1/3)πr²h = (π/12)h³, so (dV)/(dt) = (π/4)h²·(dh)/(dt). With h = 2 this gives 6π = π·(dh)/(dt), so (dh)/(dt) = 6 cm/sec.", "img": ""}, {"y": 2015, "n": "59", "t": "Integration", "q": "Let F be the anti-derivative of f. Then which of the following is NOT true about F and f?", "o": ["(d)/(dx) ∫F(x) dx = F(x)", "F′(x) = f(x)", "∫F(x) dx = f(x) + c", "∫ (d)/(dx) f(x) dx = f(x) + c"], "a": 2, "s": "Since F′ = f, we have ∫f(x) dx = F(x) + c, not ∫F(x) dx = f(x) + c, so C is not true. A, B and D follow from differentiation and integration being inverse operations.", "img": ""}, {"y": 2015, "n": "60", "t": "Applications of derivatives", "q": "Let f(x) = 1/√x and g(x) = 2 − 1/6 x³ be two functions. For what values of x do the graphs of f and g have tangent lines of the same slope?", "o": ["√3/2", "1", "4", "1/4"], "a": 1, "s": "f′(x) = −1/2 x^{−3/2} and g′(x) = −1/2 x². Setting f′(x) = g′(x) gives x^{−3/2} = x², so x^{7/2} = 1 and x = 1.", "img": ""}, {"y": 2015, "n": "61", "t": "Applications of derivatives", "q": "What is the value of a number in the interval (0, 1) that satisfies the Mean Value Theorem for the function f(x) = 3x² − 5x + 1?", "o": ["1/2", "3/5", "5/6", "1"], "a": 0, "s": "f(0) = 1 and f(1) = −1, so the average slope is (f(1) − f(0))/(1 − 0) = −2. Setting f′(c) = 6c − 5 = −2 gives c = 1/2, which lies in (0, 1).", "img": ""}, {"y": 2015, "n": "62", "t": "Derivatives", "q": "Let f(x) = 5x³ + 2x − sin x + e^x. What is the value of f′(0)?", "o": ["2", "1", "−1", "4"], "a": 0, "s": "f′(x) = 15x² + 2 − cos x + e^x, so f′(0) = 0 + 2 − 1 + 1 = 2.", "img": ""}, {"y": 2015, "n": "63", "t": "Derivatives", "q": "Let f and g be differentiable functions and h(x) = g(f(3x + 1)). If f′(1) = f(1) = 2 and g′(2) = 1, then what is the value of h′(0)?", "o": ["2", "1", "6", "4"], "a": 2, "s": "By the chain rule, h′(x) = g′(f(3x + 1))·f′(3x + 1)·3. At x = 0: h′(0) = g′(f(1))·f′(1)·3 = g′(2)·2·3 = 1·2·3 = 6.", "img": ""}, {"y": 2015, "n": "64", "t": "Derivatives", "q": "Which of the following describes the mechanical meaning of derivative?", "o": ["Gradient of graphs of functions", "Area under the curve", "Instantaneous rate of change", "Slope of tangent line"], "a": 2, "s": "Mechanically (in physics), the derivative is the instantaneous rate of change of a quantity, for example velocity is the rate of change of position. The slope of the tangent line (gradient) is its geometric meaning.", "img": ""}, {"y": 2016, "n": "11", "t": "Series", "q": "Which one of the following is equal to the sum Σ_{n=1}^{5} 2n² ?", "o": ["2 + 8 + 18 + 32 + 50", "2 + 4 + 8 + 16 + 32", "2 + 4 + 6 + 8 + 10", "2 + 8 + 16 + 32 + 64"], "a": 0, "s": "Substitute n = 1, 2, 3, 4, 5 into 2n²: 2·1² = 2, 2·2² = 8, 2·3² = 18, 2·4² = 32, 2·5² = 50. The sum is 2 + 8 + 18 + 32 + 50 = 110.", "img": ""}, {"y": 2016, "n": "12", "t": "Sequences", "q": "If the fifth and the tenth terms of a geometric sequence are 640 and 20 respectively, then which of the following numbers are the first term and the common ratio of the given geometric sequence respectively?", "o": ["10240 and 1/2", "1024 and 1/2", "10240 and 2", "1024 and 2"], "a": 0, "s": "a r^4 = 640 and a r^9 = 20. Dividing the second by the first gives r^5 = 20/640 = 1/32, so r = 1/2. Then a = 640/r^4 = 640·16 = 10240.", "img": ""}, {"y": 2016, "n": "13", "t": "Integration", "q": "Which one of the following is true about the integral of a function f(x) with respect to a variable x?", "o": ["∫f(x) dx is the set of all derivatives of f.", "∫f′(x) dx is the set of all derivatives of f.", "∫f(x) dx is the set of all anti-derivatives of f.", "∫f′(x) dx is the set of all anti-derivatives of f."], "a": 2, "s": "The indefinite integral ∫f(x) dx is the family of all anti-derivatives F(x) + c of f, so C is true. Derivatives come from differentiating, not integrating, so A and B are wrong. ∫f′(x) dx gives the anti-derivatives of f′, not of f, so D is wrong.", "img": ""}, {"y": 2016, "n": "14", "t": "Series", "q": "Which one of the following is equal to the sum Σ_{k=1}^{7} 729(3^{1−k}) ?", "o": ["1092", "1079", "1093", "1088"], "a": 2, "s": "For k = 1, …, 7 the terms 729·3^{1−k} are 729, 243, 81, 27, 9, 3, 1. Their sum is 1093.", "img": ""}, {"y": 2016, "n": "15", "t": "Applications of integrals", "q": "What is the area of the region bounded by the graph of f(x) = x³ and the x-axis on the interval [−4, 2]?", "o": ["68 Square units", "136 Square units", "60 Square units", "120 Square units"], "a": 0, "s": "x³ is negative on [−4, 0] and positive on [0, 2], so the area is ∫_{−4}^{0} (−x³) dx + ∫_0^2 x³ dx = 256/4 + 16/4 = 64 + 4 = 68 square units.", "img": ""}, {"y": 2016, "n": "16", "t": "Derivatives", "q": "Let f be a differentiable function at a number ‘a’ for a ∈ Domain f. In the expression (f(a + h) − f(a))/h for h ≠ 0, as h gets closer and closer to zero from both directions, the expression becomes closer to f′(a), which is equal to", "o": ["The gradient of the tangent line to the graph of f at a point (a, f(a)).", "The gradient of the vertical line to the graph of f at a point (a, f(a)).", "The gradient of the secant line to the graph of f at a point (a, f(a)).", "The gradient of the normal line to the graph of f at a point (a, f(a))."], "a": 0, "s": "The limit of the difference quotient is the derivative f′(a), which is the slope (gradient) of the tangent line at (a, f(a)). The quotient itself, for a fixed h ≠ 0, is the slope of a secant line.", "img": ""}, {"y": 2017, "n": "4", "t": "Derivatives", "q": "Which one of the following is the instantaneous rate of change of the function f(x) = 12x² + 8x at x = −3?", "o": ["80", "−80", "64", "−64"], "a": 3, "s": "The instantaneous rate of change is f′(−3). Since f′(x) = 24x + 8, f′(−3) = −72 + 8 = −64.", "img": ""}, {"y": 2017, "n": "6", "t": "Continuity", "q": "The intermediate value theorem states that if P(a) is positive and P(b) is negative on the closed interval [a, b] then __________.", "o": ["there exists some c on [a, b] such that P(c) &gt; 0", "there exists some c on [a, b] such that P(c) &lt; 0", "there exists some c on [a, b] such that P(c) = 0", "there does not exist some c on [a, b] such that P(c) = 0"], "a": 2, "s": "P is continuous and changes sign from positive to negative between a and b, so by the Intermediate Value Theorem it takes the value 0 at some c in [a, b].", "img": ""}, {"y": 2017, "n": "8", "t": "Limits", "q": "A horizontal asymptote occurs in a rational function when:", "o": ["The degree of the numerator is greater than the degree of the denominator", "The degree of the numerator is less than the degree of the denominator", "The function crosses the x-axis", "The function is a polynomial"], "a": 1, "s": "If the degree of the numerator is less than that of the denominator, the function tends to 0 as x → ±∞, so y = 0 is a horizontal asymptote. (A horizontal asymptote also occurs when the degrees are equal, but B is the best choice among the options.)", "img": ""}, {"y": 2017, "n": "26", "t": "Series", "q": "What is the sum of Σ_{n=2}^{20} (1/(n − 1) − 1/n) ?", "o": ["19/20", "23/20", "21/20", "17/20"], "a": 0, "s": "This is a telescoping sum: (1/1 − 1/2) + (1/2 − 1/3) + … + (1/19 − 1/20) = 1 − 1/20 = 19/20.", "img": ""}, {"y": 2017, "n": "28", "t": "Applications of integrals", "q": "What is the area of the region bounded by f(x) = x² + 3 and the x-axis on the closed interval [−1, 3]?", "o": ["4/3 Square units", "22/3 Square units", "26/3 Square units", "64/3 Square units"], "a": 3, "s": "Since x² + 3 &gt; 0, the area is ∫_{−1}^{3} (x² + 3) dx = [x³/3 + 3x] from −1 to 3 = (9 + 9) − (−1/3 − 3) = 18 + 10/3 = 64/3 square units.", "img": ""}, {"y": 2017, "n": "33", "t": "Sequences", "q": "The sum of the first 12 terms of a geometric sequence with first term 0.3 and common ratio 0.1 is equal to:", "o": ["1/3·((10^11 − 1)/10^11)", "3/10·((10^12 − 1)/10^12)", "−1/3·((10^12 − 1)/10^12)", "1/3·((10^12 − 1)/10^12)"], "a": 3, "s": "S_12 = 0.3(1 − 0.1^12)/(1 − 0.1) = 0.3·(10/9)(1 − 1/10^12) = 1/3·((10^12 − 1)/10^12), which is option D.", "img": ""}, {"y": 2017, "n": "36", "t": "Derivatives", "q": "Let f(x) = ln(x² − 3x). Then f″(−1) is equal to:", "o": ["−17/16", "−7/16", "−5/16", "−19/16"], "a": 0, "s": "f′(x) = (2x − 3)/(x² − 3x), and by the quotient rule f″(x) = (2(x² − 3x) − (2x − 3)²)/(x² − 3x)². At x = −1: x² − 3x = 4 and 2x − 3 = −5, so f″(−1) = (2·4 − 25)/16 = −17/16.", "img": ""}, {"y": 2017, "n": "37", "t": "Derivatives", "q": "If f(2) = −3, f′(2) = 4, g(1) = −5, g′(1) = 1 and F(x) = f(2x + 2)·g(1 − x²), then what is the value of F′(0)?", "o": ["19", "0", "−20", "−40"], "a": 3, "s": "By the product and chain rules, F′(x) = 2f′(2x + 2)·g(1 − x²) + f(2x + 2)·g′(1 − x²)·(−2x). At x = 0 the second term vanishes, so F′(0) = 2f′(2)·g(1) = 2·4·(−5) = −40.", "img": ""}, {"y": 2017, "n": "38", "t": "Applications of derivatives", "q": "Let f(x) = x⁵ − 20x on [−2, 2]. Which of the following is the local maximum value of f ?", "o": ["f(−√2)", "f(√2)", "f(2)", "f(−1)"], "a": 0, "s": "f′(x) = 5x⁴ − 20 = 0 gives x = ±√2. f″(x) = 20x³ is negative at x = −√2 and positive at x = √2, so f has a local maximum at x = −√2, with value f(−√2).", "img": ""}, {"y": 2017, "n": "39", "t": "Applications of derivatives", "q": "Which of the following is false about the graph of f(x) = x/(x² + 1) ?", "o": ["It is strictly increasing on [−1, 1]", "One of the inflection points is (0, 0)", "It is concave downward on (−∞, −√3) ∪ (0, √3)", "Its relative maximum value is −1/2"], "a": 3, "s": "f′(x) = (1 − x²)/(x² + 1)² ≥ 0 on [−1, 1], so A is true. f″(x) = 2x(x² − 3)/(x² + 1)³ changes sign at 0, so (0, 0) is an inflection point and f″ &lt; 0 on (−∞, −√3) and (0, √3), so B and C are true. The relative maximum occurs at x = 1 and equals 1/2, not −1/2, so D is false.", "img": ""}, {"y": 2017, "n": "40", "t": "Integration", "q": "Which one of the following is equal to ∫(x + ln(x + 1))/((x + 1)²) dx ?", "o": ["ln(x + 1) + x/(x + 1) + c", "(x + 1)² + 1/(x + 1) + c", "(x + 1)² − 1/(x + 1) + c", "(x ln(x + 1))/(x + 1) + c"], "a": 3, "s": "Differentiate D: d/dx[(x ln(x + 1))/(x + 1)] = ((ln(x + 1) + x/(x + 1))(x + 1) − x ln(x + 1))/((x + 1)²) = (x + ln(x + 1))/((x + 1)²), which is the integrand.", "img": ""}, {"y": 2017, "n": "48", "t": "Sequences", "q": "What is the sum of the first 50 terms of the arithmetic sequence 3, 10, 17, 24, … ?", "o": ["8750", "8490", "7850", "8725"], "a": 3, "s": "a = 3 and d = 7, so S_50 = 50/2 (2·3 + 49·7) = 25(6 + 343) = 25·349 = 8725.", "img": ""}, {"y": 2017, "n": "49", "t": "Applications of derivatives", "q": "Suppose f: (−∞, ∞) → ℝ is differentiable and the graph of its derivative f′(x) is as shown in the figure below. Which one of the following is true about f ?", "o": ["f is increasing on (1, ∞)", "f has no relative maximum value.", "f is concave upward on (0, ∞)", "f has a relative minimum value at x = 2."], "a": 3, "s": "From the graph, f′(x) &gt; 0 for x &lt; 0, f′(x) &lt; 0 for 0 &lt; x &lt; 2, and f′(x) &gt; 0 for x &gt; 2. So f has a relative maximum at x = 0 and a relative minimum at x = 2 (D is true). f decreases on (1, 2), so A is false. B is false because of the maximum at 0. f′ is decreasing on (0, 1), so f is concave down there and C is false.", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAhwAAADOCAIAAAD69UwmAAA/OUlEQVR42u29Z3RUZ5rv+zzvDlWlKpVCKaCMBEggJAEiiZzBBAPGpp3abnc4pz19em7fnj5z7qx1P5yZcz7cuWfN3Htm3Z7TM9Pu6eh2AwYbYxsMCGMyJpgskkgCBZRjlWrv/T73wyttChzaASQBz2+xhFRVKu3atev9v09GIgLmoUW9fYgIAFJKItI0DYCAJAABagQoARAACBABwZGWBBC9GjqAXgTdtiWKHoEI4CMpAEHT+MQyDPP1QBaVR0BXEFFKKYQAAMdx+nQFJIAGANQnKhLIBkEAHgCQAGEAA8C0bdABQO97ZN+jGYZhWFQeSzlRNopt27dv3waAzMxMRASQiOKOPpAD0gZwIt2d9bU1PRa16wlOXFJecjBDtra1NjR3UTfGxael56YkeFhUGIb5uuh8Ch4BaYlGo+fOnfv3f//3hISEv/iLv8jMzBQC75goJFESIIBjt9fV/vrnf//Bvso2/6xxc178i5cWJMZd2rXpvd+/fcabO27hs8ufWzbVo2lsrjAMw6LyOCKlRMS6urqdO3fu3bs3Li6uqKjo6aef9vvjAFwbFEETIB0CkV4wcsXq5R299Zc7cqaNLx89IhQvQ2MmTp/SmDtm5vxJc0eamvoFhmGYr4PgU/Dwgv1cu3Ztx44dNTU1Fy9e3L59e2dnJwDe8WsiEgGghqiB4S0rmzS3Yjr1NLbXXrS7rM5u0dJrGilp6TlJWX5dkzafWIZh2FJ5fM2Urq6u48ePnz17tq2tDRFPnTp16dKl9LQURGVyoCRyHDI0HTVBQJ7gsJJR47NC1y6e2Hx8pC8jOeF8bVdBeVFGbhJIy+DTyjAMWyqPs6XS0NCwd+/e9vZ2ACCiW7dqDxzYb0d7AZFIEgAhCl2TCIRCOkhGQnbu2AUzxnQ0Ht2z/Z3r12VYS86fkJ+QqCE5yPsMhmFYVB5PLMvq7Ow8ePDg4cOHw+GwSilubW3Zvn3HiVPnohEbCIAcDWxBNgKBBAQBYHgy8hbPmT1n3Mgjn3xYWXUkKz8/z+tPJAQwCPmSYBiGReWxRNf106dPv/32242NjUSkvGFEdObMmd/9/g/V166h0IgAgBBJADnSASQQSKYnMaPg2VXPjistIa8cV5wXEmjYQkONOEjPMMw3WZf4FDyMqAqV3t7ea9euXbt2LRAISCkjkQgi+nw+27arqs421NeNLiokEiCRiDQNUNhCgJSEUpDpyx4xesXS1Z3BomFJQgCRBegAaMiywjAMi8rjhbJI2tvbg8Hg3Llzp0+f3tnZuW/fPtM0Z82aZRhGfHxA00RHe1cgEC+Eas8SBYpK6HUADT0ZbFldczMqcMSIbA3BIdI1C6ShqikZhmFYVB47/H5/eXl5QUEBANy6dau2tjYpKemHP/xhXJxPCExMTNJ0HfuLIKWUhk4Xrpy6crNuwtQl5HQerDl39OS1qUnp6dlTvRgWGDbQ68MENlUYhmFReRyNlfj4+Pj4+MzMTABISEhITk5OTU0dO3asaZp3HkcABERg6AZBFAgPHD3wP996s77xSm9v+IlFa6rrz33yp49WrZm354OdSZj6veU/MNHk08swzNeDA/UPMSo4r5oTW5Zl27Zt25ZlEZGUDpHsq6lHpSy  "n": "57", "t": "Optimization", "q": "The demand equation for a certain product is given by P = 12 − 1/4 x birr, where x represents the amount of product. What is the maximum (total) revenue?", "o": ["72 birr", "144 birr", "36 birr", "108 birr"], "a": 1, "s": "Revenue R = xP = 12x − x²/4. R′ = 12 − x/2 = 0 gives x = 24, so R = 24·(12 − 6) = 144 birr.", "img": ""}, {"y": 2017, "n": "60", "t": "Sequences", "q": "What is the sum of all multiples of 4 that are between 30 and 301?", "o": ["12,882", "11,288", "6,288", "6,882"], "a": 1, "s": "The multiples are 32, 36, …, 300, an arithmetic sequence with d = 4. The number of terms is (300 − 32)/4 + 1 = 68, so the sum is 68/2 (32 + 300) = 34·332 = 11,288.", "img": ""}, {"y": 2017, "n": "S1", "t": "Series", "q": "Which of the following statements is true about the given infinite series?", "o": ["Σ_{n=1}^{∞} (−1)^n 2^n is convergent.", "Σ_{n=1}^{∞} (4/3)^n is convergent.", "Σ_{n=1}^{∞} 2^n is divergent.", "Σ_{n=1}^{∞} (−1)^n (2/5)^n is divergent."], "a": 2, "s": "A: the terms (−2)^n do not tend to 0, so it diverges. B: geometric with ratio 4/3 &gt; 1, so it diverges. C: geometric with ratio 2 &gt; 1, so it diverges, and C is true. D: geometric with ratio −2/5, |r| &lt; 1, so it converges.", "img": ""}, {"y": 2017, "n": "S2", "t": "Sequences", "q": "Which of the following statements defines a geometric progression?", "o": ["It is a sequence in which the ratio between consecutive terms is a non-zero constant.", "It is a sequence in which the difference between consecutive terms is a positive constant.", "It is a sequence in which the difference between consecutive terms is a non-zero constant.", "It is a sequence in which the ratio between consecutive terms is a positive constant."], "a": 0, "s": "A geometric progression has a constant common ratio between consecutive terms, and that ratio can be any non-zero constant (it may be negative), so A is the definition. The difference statements describe arithmetic sequences.", "img": ""}, {"y": 2017, "n": "S3", "t": "Derivatives", "q": "Suppose f(x) = 3√x and g(x) = 1/3 x⁴ + 2x be given two functions. Then which of the following is equal to (f + g)′(x) ?", "o": ["3x^{−1/2} + 4x³ + 2", "2/3 x^{−1/3} + 4x³ + 2x", "2/3 x^{−1/3} + 4x³ + 2", "3/2 x^{−1/2} + 4/3 x³ + 2"], "a": 3, "s": "f(x) = 3x^{1/2}, so f′(x) = 3/2 x^{−1/2}. g′(x) = 4/3 x³ + 2. Therefore (f + g)′(x) = 3/2 x^{−1/2} + 4/3 x³ + 2.", "img": ""}, {"y": 2017, "n": "S4", "t": "Derivatives", "q": "What is the average rate of change of g(x) = x³ − 2x over the interval 1 ≤ x ≤ 6 ?", "o": ["203/5", "41", "37/5", "46"], "a": 1, "s": "Average rate of change = (g(6) − g(1))/(6 − 1) = ((216 − 12) − (1 − 2))/5 = (204 + 1)/5 = 205/5 = 41.", "img": ""}, {"y": 2017, "n": "S5", "t": "Applications of derivatives", "q": "Consider the function f(x) = x³ − 3x² + 3 on (−2, 3). Then which of the following points is a local minimum and a local maximum of f(x) respectively?", "o": ["(−2, −27) and (0, 3)", "(0, 3) and (2, −1)", "(3, 3) and (−2, −27)", "(2, −1) and (0, 3)"], "a": 3, "s": "f′(x) = 3x² − 6x = 3x(x − 2) = 0 gives x = 0 and x = 2. f″(x) = 6x − 6 is negative at 0 and positive at 2, so there is a local maximum at (0, 3) and a local minimum at (2, f(2)) = (2, −1). The endpoints −2 and 3 are not in the open interval.", "img": ""}, {"y": 2017, "n": "2", "t": "Derivatives", "q": "Let f(x) = (1 − 2x)^{1/2}. Then what is the value of f′(x) ?", "o": ["1/√(1 − 2x)", "−1/2 √(1 − 2x)", "1/2 √(1 − 2x)", "−1/√(1 − 2x)"], "a": 3, "s": "By the chain rule, f′(x) = 1/2 (1 − 2x)^{−1/2}·(−2) = −1/√(1 − 2x).", "img": ""}, {"y": 2017, "n": "S6", "t": "Derivatives", "q": "Let f be a differentiable function at a number ‘a’ for a ∈ Domain f. In the expression (f(a + h) − f(a))/h for h ≠ 0, as h gets closer and closer to zero from both directions, the expression becomes closer to f′(a), which is equal to", "o": ["The gradient of the tangent line to the graph of f at a point (a, f(a)).", "The gradient of the vertical line to the graph of f at a point (a, f(a)).", "The gradient of the secant line to the graph of f at a point (a, f(a)).", "The gradient of the normal line to the graph of f at a point (a, f(a))."], "a": 0, "s": "The limit of the difference quotient is the derivative f′(a), which is the slope (gradient) of the tangent line at (a, f(a)). The quotient itself, for a fixed h ≠ 0, is the slope of a secant line.", "img": ""}, {"y": 2017, "n": "S7", "t": "Applications of integrals", "q": "What is the area of the region bounded by the graph of f(x) = x³ and the x-axis on the interval [−4, 2]?", "o": ["68 Square units", "136 Square units", "60 Square units", "120 Square units"], "a": 0, "s": "x³ is negative on [−4, 0] and positive on [0, 2], so the area is ∫_{−4}^{0} (−x³) dx + ∫_0^2 x³ dx = 256/4 + 16/4 = 64 + 4 = 68 square units.", "img": ""}, {"y": 2018, "n": "2nd round Q27", "t": "Series", "q": "Which geometric series is divergent?", "o": ["Σ 4ⁿ(−1/3)ⁿ, n≥1", "Σ 1000(−2/3)ⁿ⁺¹, n≥0", "Σ (0.27)ⁿ, n≥0", "Σ 3(√3/2)ⁿ⁺¹, n≥0"], "a": 0, "s": "Ratio r = −4/3 and |r| &gt; 1, so the series diverges. The other ratios all have |r| &lt; 1.", "img": ""}, {"y": 2018, "n": "2nd round Q28", "t": "Series", "q": "Which is the fraction form of 2.1377… (the digit 7 repeats)?", "o": ["2137/900", "96/45", "1921/900", "481/225"], "a": 3, "s": "x = 2.1377…; 1000x − 100x = 2137.7… − 213.7… = 1924, so x = 1924/900 = 481/225.", "img": ""}, {"y": 2018, "n": "2nd round Q33", "t": "Series", "q": "Gold extracted is 270, 180, 120, 80 kg … in successive years. What is the total extracted in the long run?", "o": ["540 kg", "4500 kg", "650 kg", "810 kg"], "a": 3, "s": "a₁ = 270, r = 2/3. S = 270/(1 − 2/3) = 810.", "img": ""}, {"y": 2018, "n": "2nd round Q44", "t": "Series", "q": "A ball is dropped from 20 m and rebounds half the distance after each fall. What total distance has it travelled when it hits the ground for the 5th time?", "o": ["62.5 m", "43.5 m", "57.5 m", "52.5 m"], "a": 2, "s": "20 + 2(10 + 5 + 2.5 + 1.25) = 20 + 37.5 = 57.5 m.", "img": ""}, {"y": 2018, "n": "3rd round Q35", "t": "Series", "q": "A contest has 17 prizes. The first is Birr 6,000 and each next prize is Birr 300 less than the one before. What is the total value?", "o": ["Birr 142,800", "Birr 61,200", "Birr 94,600", "Birr 47,300"], "a": 1, "s": "Arithmetic series: S₁₇ = (17/2)[2(6000) + 16(−300)] = 17 × 3600 = 61,200.", "img": ""}, {"y": 2018, "n": "3rd round Q41", "t": "Series", "q": "Which is equal to Σ_{k=1}^{6} (k − 1)²?", "o": ["1 + 3 + 6 + 12 + 16 + 18", "1 + 4 + 9 + 16 + 25 + 36", "0 + 1 + 4 + 9 + 16 + 25", "0 + 2 + 6 + 8 + 10 + 12"], "a": 2, "s": "For k = 1 to 6, (k − 1)² gives 0, 1, 4, 9, 16, 25.", "img": ""}, {"y": 2018, "n": "3rd round Q53", "t": "Series", "q": "What is the sum of Σ_{n=1}^{∞} 1/(n(n+1))?", "o": ["1", "2", "1/2", "Divergent"], "a": 0, "s": "1/(n(n+1)) = 1/n − 1/(n+1). The series telescopes, so the partial sum is 1 − 1/(N+1), which tends to 1.", "img": ""}, {"y": 2018, "n": "3rd round Q56", "t": "Series", "q": "Which is a convergent series?", "o": ["Σ 5(k − 2)", "Σ (2/15)^{1−k}", "Σ 4^{k+1} / 3^{k−1}", "Σ 2^{k+1} / 5^{k−1}"], "a": 3, "s": "Option D is geometric with r = 2/5, so |r| &lt; 1. The others have r = 15/2 or 4/3, or a constant difference, so they diverge.", "img": ""}, {"y": 2018, "n": "3rd round Q12", "t": "Series", "q": "Birr 6000 is deposited at the end of each year at 10% compounded annually. What is the future value after 3 years?", "o": ["14,414", "12,000", "18,230", "19,860"], "a": 3, "s": "FV = 6000 × (1.1³ − 1)/0.1 = 6000 × 3.31 = 19,860.", "img": ""}, {"y": 2018, "n": "1st round Q49", "t": "Series", "q": "In an arithmetic progression the first term is 11 and the common difference is −13. What is the sum of the first 7 terms?", "o": ["−28", "−196", "−67", "196"], "a": 1, "s": "S₇ = (7/2)[2(11) + 6(−13)] = 3.5 × (−56) = −196.", "img": ""}, {"y": 2018, "n": "1st round Q50", "t": "Sequences", "q": "In a geometric sequence g₁ = 2 and g₅ = 8, with positive common ratio. What is g₁₃?", "o": ["32", "64", "128", "256"], "a": 2, "s": "r⁴ = 4, so r² = 2. g₁₃ = 2·r¹² = 2·2⁶ = 128.", "img": ""}, {"y": 2018, "n": "1st round Q51", "t": "Series", "q": "The repeating decimal 0.373737… in lowest terms is:", "o": ["37/100", "37/99", "37/90", "1/3"], "a": 1, "s": "Let x = 0.3737…; 100x − x = 37, so x = 37/99.", "img": ""}, {"y": 2018, "n": "3rd round Q44", "t": "Limits", "q": "What is the limit of (√(x² − x) − x) as x approaches infinity?", "o": ["−1/2", "1/2", "0", "Does not exist"], "a": 0, "s": "Multiply by the conjugate: (−x)/(√(x² − x) + x) → −x/(2x) = −1/2.", "img": ""}, {"y": 2018, "n": "3rd round Q51", "t": "Continuity", "q": "f(x) = x² − a for x ≤ 2 and f(x) = ax − 2 for x &gt; 2. If f is continuous at x = 2, what is a?", "o": ["2", "−2", "1", "3"], "a": 0, "s": "4 − a = 2a − 2, so 6 = 3a and a = 2.", "img": ""}, {"y": 2018, "n": "2nd round Q38", "t": "Continuity", "q": "Let f(x) = x⁵ − 2x⁴ + 3x² + 3x − 3. Between which values of x does f have a zero?", "o": ["x = 0 and x = 1", "x = −2 and x = −1", "x = 1 and x = 2", "x = −1 and x = 0"], "a": 0, "s": "f(0) = −3 and f(1) = 2 have opposite signs, so by the Intermediate Value Theorem a zero lies between 0 and 1.", "img": ""}, {"y": 2018, "n": "2nd round Q4", "t": "Derivatives", "q": "What is the average rate of change of f(x) = x² + 4x − 1 over [−2, 1]?", "o": ["3", "−1", "2", "9"], "a": 0, "s": "f(1) = 4 and f(−2) = −5. Rate = (4 − (−5))/(1 − (−2)) = 9/3 = 3.", "img": ""}, {"y": 2018, "n": "1st round Q6", "t": "Derivatives", "q": "What is the average rate of change of y = f(x) on [a, b]?", "o": ["(f(b) + f(a))/2", "(b − a)/(f(b) − f(a))", "(f(b) − f(a))/2", "(f(b) − f(a))/(b − a)"], "a": 3, "s": "Average rate of change is the change in f divided by the change in x.", "img": ""}, {"y": 2018, "n": "2nd round Q26", "t": "Derivatives", "q": "Given g(x) = x², what does (g(x+h) − g(x))/h approach as h gets closer to zero?", "o": ["x", "2x", "x²", "x/2"], "a": 1, "s": "((x+h)² − x²)/h = 2x + h, which tends to 2x. This is g′(x).", "img": ""}, {"y": 2018, "n": "2nd round Q37", "t": "Derivatives", "q": "What is the derivative of f(x) = √(2x² + 2x)?", "o": ["√(4x + 1)", "(4x + 2)/√(2x² + 2x)", "(2x + 1)/√(2x² + 2x)", "(x + 2)/(2√(x² + 2x))"], "a": 2, "s": "Chain rule: f′ = (4x + 2)/(2√(2x² + 2x)) = (2x + 1)/√(2x² + 2x).", "img": ""}, {"y": 2018, "n": "3rd round Q43", "t": "Derivatives", "q": "If f(x) = ln(x² + 1) and g(x) = eˣ, what is (f∘g)′(0)?", "o": ["1", "2", "1/2", "0"], "a": 0, "s": "(f∘g)(x) = ln(e²ˣ + 1). Its derivative is 2e²ˣ/(e²ˣ + 1), which equals 2/2 = 1 at x = 0.", "img": ""}, {"y": 2018, "n": "3rd round Q47", "t": "Derivatives", "q": "If f(x) = x/(x² + 3x + 1), what is f′(x)?", "o": ["(−x³ − 3x)/(x² + 3x + 1)²", "(3x² + 6x + 1)/(x² + 3x + 1)²", "1/(2x + 3)", "(1 − x²)/(x² + 3x + 1)²"], "a": 3, "s": "Quotient rule: [(x² + 3x + 1) − x(2x + 3)]/(x² + 3x + 1)² = (1 − x²)/(x² + 3x + 1)².", "img": ""}, {"y": 2018, "n": "1st round Q27", "t": "Derivatives", "q": "Let f(x) = x³ + 4x and g(x) = 3x³ − x². What is the derivative of (f + g)(x)?", "o": ["12x² − 2x + 4", "4x³ − x² + 4x", "12x² − x + 4", "9x² − 2x + 4"], "a": 0, "s": "(f + g)(x) = 4x³ − x² + 4x, so the derivative is 12x² − 2x + 4.", "img": ""}, {"y": 2018, "n": "1st round Q25", "t": "Applications of derivatives", "q": "Which is the tangent line to f(x) = (2x + 1)/(x − 1) at (2, f(2))?", "o": ["3x + y = 11", "y − 3x = −1", "x + 3y = 17", "3x − y = 13"], "a": 0, "s": "f(2) = 5. f′(x) = −3/(x − 1)², so f′(2) = −3. Then y − 5 = −3(x − 2), which gives 3x + y = 11.", "img": ""}, {"y": 2018, "n": "3rd round Q11", "t": "Applications of derivatives", "q": "f(x) = x³ + 3x² − 9x + 7 is decreasing on:", "o": ["(−∞, −3] ∪ [1, ∞)", "[−3, ∞)", "(−∞, 1]", "[−3, 1]"], "a": 3, "s": "f′(x) = 3x² + 6x − 9 = 3(x + 3)(x − 1) ≤ 0 on [−3, 1].", "img": ""}, {"y": 2018, "n": "3rd round Q24", "t": "Related rates", "q": "Water is poured into a cylinder of radius 50 cm at dV/dt = 5000π cm³/s. How fast does the water level rise (cm/s)?", "o": ["2", "1/100", "10", "1/10"], "a": 0, "s": "V = πr²h, so dV/dt = π(50)² dh/dt. 5000π = 2500π dh/dt, so dh/dt = 2 cm/s. The height 40 cm does not matter.", "img": ""}, {"y": 2018, "n": "2nd round Q43", "t": "Integration", "q": "What is ∫ (x² + 1)/x^{3/4} dx?", "o": ["(4/9)x^{9/4} + c", "x^{5/4} + x^{−3/4} + c", "4x^{1/4}(x²/9 + 1) + c", "x(x^{1/4} + x^{−7/4}) + c"], "a": 2, "s": "Rewrite as ∫(x^{5/4} + x^{−3/4})dx = (4/9)x^{9/4} + 4x^{1/4} + c = 4x^{1/4}(x²/9 + 1) + c.", "img": ""}, {"y": 2018, "n": "3rd round Q30", "t": "Integration", "q": "What is ∫ (4x³ − 3x⁻⁴ + 5) dx?", "o": ["12x² + 12x⁻⁵ + 5x + C", "x⁴/4 + (3/5)x⁻⁵ + 5x + C", "4x⁴ − 3x⁻³ + 5x + C", "x⁴ + x⁻³ + 5x + C"], "a": 3, "s": "∫4x³ = x⁴; ∫−3x⁻⁴ = −3x⁻³/(−3) = x⁻³; ∫5 = 5x.", "img": ""}, {"y": 2018, "n": "3rd round Q52", "t": "Integration", "q": "What is the value of ∫₀^{π} sin³x cos x dx?", "o": ["0", "1/4", "−1/4", "1"], "a": 0, "s": "Let u = sin x. The limits become sin 0 = 0 and sin π = 0, so the integral is 0.", "img": ""}, {"y": 2018, "n": "1st round Q20", "t": "Integration", "q": "Which statement about definite integrals is true?", "o": ["∫ₐᵇ f(x)dx = 0, a ≠ 0", "∫ₐᵇ (f + g)dx = ∫ₐᵇ f dx + ∫ₐᵇ g dx", "∫ₐᵇ f(x)dx = ∫ₐᵇ g(x)dx", "∫ₐᵇ (f − g)dx = ∫ₐᵇ (g − f)dx"], "a": 1, "s": "Definite integrals are additive over sums. The others are false in general.", "img": ""}, {"y": 2018, "n": "1st round Q52", "t": "Integration", "q": "Which is equivalent to ∫(3f(x) − g(x))dx?", "o": ["3∫f(x)dx · ∫g(x)dx", "∫3f(x)dx − ∫g(x)dx", "3(∫f(x)dx − ∫g(x)dx)", "∫f(x)dx − 3∫g(x)dx"], "a": 1, "s": "Integration is linear. Note: the published answer key lists A for this question, but B is correct.", "img": ""}, {"y": 2012, "n": "E1", "t": "Limits", "q": "What is the value of lim_{x→0} sin x / sin 6x?", "o": ["24", "6", "3/2", "2/3", "1/6"], "a": 4, "s": "sin x / sin 6x = (sin x / x)·(6x / sin 6x)·(1/6) → 1/6.", "img": ""}, {"y": 2012, "n": "E2", "t": "Sequences", "q": "Given 0 &lt; aₙ &lt; 1/n for each n = 1, 2, 3, …, which is true?", "o": ["lim aₙ does not exist", "lim aₙ &gt; 0", "lim aₙ &lt; 0", "lim aₙ = 0"], "a": 3, "s": "Squeeze theorem: 0 &lt; aₙ &lt; 1/n and both bounds tend to 0, so aₙ → 0.", "img": ""}, {"y": 2012, "n": "59", "t": "Derivatives", "q": "If f(x) = 4 − x² sin x, which expression describes f′(x)?", "o": ["x(x cos x − 2 sin x)", "1 − cos x − 2 sin x", "−x(x cos x + 2 sin x)", "1 + cos x + 2 sin x"], "a": 2, "s": "Product rule: f′ = −(2x sin x + x² cos x) = −x(x cos x + 2 sin x).", "img": ""}, {"y": 2012, "n": "60", "t": "Optimization", "q": "The maximum profit a company can make if the profit function is P(x) = 36 + 72x − 18x² is:", "o": ["2232", "108", "124", "31"], "a": 1, "s": "P′ = 72 − 36x = 0 gives x = 2. P(2) = 36 + 144 − 72 = 108.", "img": ""}, {"y": 2012, "n": "57", "t": "Sequences", "q": "Let {aₙ} be a sequence of real numbers. Which is true about the sequence?", "o": ["It is bounded if there exists k &gt; 0 such that k ≤ 0|aₙ| for all aₙ", "It is bounded if it has both an upper bound and a lower bound", "m is a lower bound of {aₙ} if aₙ ≤ m for all aₙ", "M is an upper bound of {aₙ} if M ≤ aₙ for all aₙ"], "a": 1, "s": "A sequence is bounded when it has both an upper and a lower bound. A lower bound m satisfies m ≤ aₙ, and an upper bound M satisfies aₙ ≤ M, so options 3 and 4 are reversed.", "img": ""}, {"y": 2012, "n": "58", "t": "Limits", "q": "Which of the following is equal to lim_{n→∞} (sin n / n²)?", "o": ["π", "0", "−1", "1"], "a": 1, "s": "|sin n / n²| ≤ 1/n² → 0, so the limit is 0 by the squeeze theorem.", "img": ""}, {"y": 2012, "n": "51", "t": "Derivatives", "q": "Let f(x) = 1/(1 − √x)². Then f′(4) is equal to:", "o": ["1", "2", "1/2", "−1/2"], "a": 3, "s": "f′(x) = 1/(√x (1 − √x)³). At x = 4: 1/(2·(−1)³) = −1/2.", "img": ""}, {"y": 2012, "n": "49", "t": "Derivatives", "q": "On which interval is f(x) = 1/(x − 1) − 1/√(4 − x²) differentiable?", "o": ["(−∞, −2) ∪ (2, ∞)", "[−2, 1) ∪ (1, 2]", "(−2, 1) ∪ (1, 2)", "(−2, 2)"], "a": 2, "s": "We need 4 − x² &gt; 0, so −2 &lt; x &lt; 2, and x ≠ 1. The domain is (−2, 1) ∪ (1, 2), and f is differentiable there.", "img": ""}, {"y": 2012, "n": "50", "t": "Sequences", "q": "A real number a is the limit of a sequence {aₙ} if:", "o": ["|aₙ| ≤ aₙ &lt; |a| for all n", "a is very close to all terms of {aₙ} from some arbitrarily big n onwards", "a ≤ |aₙ| for all n", "a is closer to every term of the sequence"], "a": 1, "s": "The limit means the terms get and stay arbitrarily close to a from some index onward (the ε–N idea).", "img": ""}, {"y": 2012, "n": "E3", "t": "Limits", "q": "lim_{x→∞} ((x − 2)/x)^{−2x+1} = ?", "o": ["e²", "e⁻²", "e⁴", "e⁻⁴"], "a": 2, "s": "(1 − 2/x)^{−2x} → e^{(−2)(−2)} = e⁴, and the extra factor (1 − 2/x) → 1.", "img": ""}, {"y": 2012, "n": "45", "t": "Sequences", "q": "A sequence has a₁ = 6 and aₙ₊₁ = −(1/3)aₙ. What is the sum of the first ten terms?", "o": ["9(1 − (1/3)¹¹)", "(9/2)(1 − (1/3)¹¹)", "9(1 − (1/3)¹⁰)", "(9/2)(1 − (1/3)¹⁰)"], "a": 3, "s": "Geometric with r = −1/3. S₁₀ = 6(1 − (−1/3)¹⁰)/(1 + 1/3) = (9/2)(1 − (1/3)¹⁰).", "img": ""}, {"y": 2012, "n": "41", "t": "Related rates", "q": "The volume of a cube increases at 9 cm³/s. How fast is the surface area increasing when an edge is 10 cm?", "o": ["90 cm²/s", "6 cm²/s", "3.6 cm²/s", "36 cm²/s"], "a": 2, "s": "V = s³ gives 3s²·ds/dt = 9, so ds/dt = 0.03. A = 6s² gives dA/dt = 12s·ds/dt = 12(10)(0.03) = 3.6.", "img": ""}, {"y": 2012, "n": "39", "t": "Continuity", "q": "f(x) = k·2ˣ for x &gt; 2 and x³ − x + 1 for x ≤ 2. For what k is f continuous at x = 2?", "o": ["2", "7/2", "7/4", "4"], "a": 2, "s": "Left value: 8 − 2 + 1 = 7. Right value: 4k. So k = 7/4.", "img": ""}, {"y": 2012, "n": "40", "t": "Derivatives", "q": "The function f(x) = (x − 1)^{2/3} is differentiable on:", "o": ["(−∞, 1) ∪ (1, ∞)", "(−2, 1) ∪ (1, 2)", "(−∞, −1) ∪ (−1, ∞)", "(−2, 2)"], "a": 0, "s": "f′ = (2/3)(x − 1)^{−1/3} is undefined at x = 1 (a cusp).", "img": ""}, {"y": 2012, "n": "E4", "t": "Sequences", "q": "Which is the lower bound for the sequence {n/(n−1)}, n = 2, 3, …?", "o": ["7/4", "5/3", "9/5", "1"], "a": 3, "s": "The terms are 2, 3/2, 4/3, … and decrease toward 1, all above 1. A lower bound must be at most every term, so only 1 works.", "img": ""}, {"y": 2012, "n": "34", "t": "Limits", "q": "Which is true about the limit of a function?", "o": ["Intuitively, the limit of f is a y-value L that f(x) approaches as x approaches some specified number", "Whenever the limit exists it equals the functional value", "The limit of a constant function is always zero", "Right-hand and left-hand limits are the same for every function"], "a": 0, "s": "The other statements are false: the limit need not equal f(a), the limit of a constant c is c, and one-sided limits can differ.", "img": ""}, {"y": 2012, "n": "29", "t": "Sequences", "q": "The 1st and 4th terms of a geometric progression are 3 and 81. What is the common ratio?", "o": ["3", "1/9", "9", "1/3"], "a": 0, "s": "3r³ = 81, so r³ = 27 and r = 3.", "img": ""}, {"y": 2012, "n": "25", "t": "Series", "q": "A geometric series with first term a and common ratio r is convergent if:", "o": ["r ≤ 1", "r &lt; 1", "r ≥ 1", "r &gt; 1"], "a": 1, "s": "The true condition is |r| &lt; 1. Of these options only r &lt; 1 is close (it is meant to be |r| &lt; 1); r ≥ 1 and r &gt; 1 clearly diverge.", "img": ""}, {"y": 2012, "n": "22", "t": "Derivatives", "q": "If f(x) = ln 2 / x², then f′(x) equals:", "o": ["(2 + ln x)/x³", "−2/x⁴", "(−2 ln 2)/x³", "1/(2x²)"], "a": 2, "s": "ln 2 is a constant, so f = ln2 · x⁻² and f′ = −2 ln2 · x⁻³.", "img": ""}, {"y": 2012, "n": "23", "t": "Derivatives", "q": "The second derivative of f(x) = x e⁻ˣ is:", "o": ["(2x − x)e⁻ˣ", "−x e⁻ˣ", "(x + 2)² e⁻ˣ", "(x − 2)e⁻ˣ"], "a": 3, "s": "f′ = (1 − x)e⁻ˣ. f″ = −e⁻ˣ − (1 − x)e⁻ˣ = (x − 2)e⁻ˣ.", "img": ""}, {"y": 2012, "n": "20", "t": "Optimization", "q": "The product of two positive numbers is 100 and twice the first plus eight times the second is a minimum. Which pair is (first, second)?", "o": ["1 and 99", "50 and 2", "25 and 4", "20 and 5"], "a": 3, "s": "S = 2x + 800/x. S′ = 2 − 800/x² = 0 gives x = 20, then y = 5.", "img": ""}, {"y": 2012, "n": "11", "t": "Applications of derivatives", "q": "For what c is the conclusion of Rolle's theorem satisfied for f(x) = 2x − x² − x³ on [−2, 1]?", "o": ["(1 ± √5)/3", "(−1 ± √7)/3", "(−1 ± √5)/3", "(1 ± √7)/3"], "a": 1, "s": "f(−2) = f(1) = 0. f′ = 2 − 2x − 3x² = 0 gives 3x² + 2x − 2 = 0, so x = (−1 ± √7)/3. Both lie in (−2, 1).", "img": ""}, {"y": 2012, "n": "9", "t": "Continuity", "q": "If f and g are continuous at x = c, which combination is continuous at x = c?", "o": ["f⁻¹", "f²", "√g", "f/g"], "a": 1, "s": "Products of continuous functions are continuous. The others can fail: f⁻¹ may not exist, √g needs g ≥ 0, f/g needs g(c) ≠ 0.", "img": ""}, {"y": 2012, "n": "10", "t": "Limits", "q": "lim (1 + 5/x)ˣ as x → ∞ is equal to:", "o": ["5e", "e⁻⁵", "e⁻¹", "e⁵"], "a": 3, "s": "lim (1 + a/x)ˣ = eᵃ, so the limit is e⁵.", "img": ""}, {"y": 2012, "n": "E5", "t": "Sequences", "q": "Which is an upper bound for the sequence {(n+1)/n}, n = 1, 2, …?", "o": ["2", "4/3", "1", "0"], "a": 0, "s": "(n+1)/n = 1 + 1/n, which is largest at n = 1 (value 2). So 2 is an upper bound.", "img": ""}, {"y": 2012, "n": "E6", "t": "Sequences", "q": "The general term of a sequence is aₙ = (1/2)^{1−n}. Which is true?", "o": ["Its terms are odd numbers", "Its terms are natural numbers", "0 is one of its terms", "Its terms are non-positive"], "a": 1, "s": "aₙ = 2^{n−1} = 1, 2, 4, 8, …, which are natural numbers (not all odd, never 0, all positive).", "img": ""}]);
Q.push(...[{"y": 2001, "n": "5*", "t": "Sequences", "q": "Which one of the following sequences is a convergent sequence?", "o": ["1, 1/2, 1, 1/3, 1, 1/4, …", "{(−1)<sup>n</sup>}", "{10<sup>109</sup> − 1/100 n}", "{sin(1/n)}"], "a": 3, "s": "sin(1/n) → sin 0 = 0, so it converges. A keeps returning to 1, B oscillates between −1 and 1, and C decreases without bound.", "img": ""}, {"y": 2001, "n": "7*", "t": "Sequences", "q": "Which one of the following is an arithmetic sequence?", "o": ["3, 5, 7, 9, 11, …", "3, 6, 12, 24, 48, …", "−3, 6, −9, 12, −15, …", "1, 3, 6, 10, 15, 21, …"], "a": 0, "s": "An arithmetic sequence has a constant difference. A has d = 2. B has a constant ratio, and C and D have no constant difference.", "img": ""}, {"y": 2001, "n": "9*", "t": "Applications of derivatives", "q": "The ozone level (in ppb – parts per billion) on a sunny day in a metropolitan area is given by P(t) = 80 + 12t − t<sup>2</sup>, where t is time in hours and t = 0 corresponds to 9 A.M. What is the rate of increase of the ozone level after 3 hours?", "o": ["6 ppb", "12 ppb", "107 ppb", "113 ppb"], "a": 0, "s": "P′(t) = 12 − 2t. At t = 3: 12 − 6 = 6 ppb per hour.", "img": ""}, {"y": 2001, "n": "10*", "t": "Integration", "q": "What is the value of ∫<sub>0</sub><sup>1</sup> x/(x<sup>2</sup>+1)<sup>2</sup> dx ?", "o": ["1/4", "1/2", "1", "−1/4"], "a": 0, "s": "Let u = x² + 1. ∫₀¹ x/(x² + 1)² dx = [−1/(2(x² + 1))] from 0 to 1 = −1/4 + 1/2 = 1/4.", "img": ""}, {"y": 2001, "n": "11*", "t": "Limits", "q": "The value(s) of x where the graph of y = (x<sup>2</sup>−1)/x<sup>3</sup> crosses its horizontal asymptote is (are):", "o": ["x = −2", "x = 0", "x = −1 and x = 1", "x = −√2 and x = 1+√2"], "a": 2, "s": "As x → ±∞, y → 0, so the horizontal asymptote is y = 0. Setting (x² − 1)/x³ = 0 gives x = ±1 (x = 0 is not in the domain).", "img": ""}, {"y": 2001, "n": "15*", "t": "Applications of integrals", "q": "What is the area under the curve y = 3 sin x over the interval [0, 2π/3] ?", "o": ["
