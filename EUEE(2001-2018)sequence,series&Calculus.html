const Q=[{"y": 2002, "n": "39", "t": "Sequences", "q": "If the k-th term of a sequence is a_k = (−1)^k(2−k)/(2k−1), what is its next term a_{k+1} when k is even?", "o": ["(k−1)/(2k+1)", "(3−k)/(2k+3)", "(k−3)/(2k+1)", "(1−k)/(2k+1)"], "a": 0, "s": "a<sub>k+1</sub> = (−1)<sup>k+1</sup>(2−k−1)/(2k+1) = (−1)<sup>k</sup>(−1)(1−k)/(2k+1). For even k, (−1)<sup>k</sup> = 1, so a<sub>k+1</sub> = (k−1)/(2k+1).", "img": ""}, {"y": 2002, "n": "40", "t": "Sequences", "q": "Consider the sequence {a_n} where a₁ = 2 and a_{n+1} = a_n + 4 for all n ≥ 1. Then the sum a₃ + a₄ + a₅ + … + a₃₅ is equal to:", "o": ["2460", "2458", "2442", "2450"], "a": 2, "s": "Arithmetic with d = 4. a<sub>3</sub> = 2 + 2(4) = 10. Number of terms = 35 − 3 + 1 = 33. S = (33/2)(2·10 + 32·4) = (33/2)(148) = 2442.", "img": ""}, {"y": 2002, "n": "41", "t": "Sequences", "q": "Suppose a geometric sequence {G_n} has terms G₁₀ = 192 and G₆ = 12. Which of the following is equal to G₂?", "o": ["3/2", "3/4", "3/8", "3/16"], "a": 1, "s": "G<sub>10</sub>/G<sub>6</sub> = r<sup>4</sup> = 16, so r = 2. G<sub>6</sub> = G<sub>1</sub>·2<sup>5</sup> = 12, so G<sub>1</sub> = 3/8. G<sub>2</sub> = (3/8)(2) = 3/4.", "img": ""}, {"y": 2002, "n": "42", "t": "Series", "q": "The sum of the series Σ_{n=1}^{∞} (−1)^n / (3^n)² is equal to:", "o": ["9/8", "9/10", "−9/10", "−1/10"], "a": 3, "s": "First term = −1/9, ratio r = −1/9. S = a/(1−r) = (−1/9)/(1+1/9) = (−1/9)(9/10) = −1/10.", "img": ""}, {"y": 2002, "n": "43", "t": "Sequences", "q": "Which of the following is true about the sequence {2 + (−1)^n/(n+1)}, n ≥ 1?", "o": ["The least upper bound of the sequence is 7/3.", "The sequence is monotonic.", "1.6 is its lower bound.", "2 − 1/15 is a term of the sequence."], "a": 0, "s": "For odd n the terms are 3/2, 5/3, 7/4… (below 2). For even n they are 7/3, 9/5, 11/7… (above 2). The terms lie between 3/2 and 7/3, so glb = 3/2 and lub = 7/3. It is not monotonic.", "img": ""}, {"y": 2002, "n": "44", "t": "Sequences", "q": "Which of the following is a divergent sequence?", "o": ["{(√2)^(−n)}", "{5^(1/n)}", "{(π/3)^n}", "{1 + (−1)^n/7^n}"], "a": 2, "s": "(1/√2)<sup>n</sup> → 0, 5<sup>1/n</sup> → 1, and 1 + (−1)<sup>n</sup>/7<sup>n</sup> → 1, so those converge. π/3 &gt; 1, so (π/3)<sup>n</sup> grows without bound and diverges.", "img": ""}, {"y": 2002, "n": "45", "t": "Limits", "q": "lim_{n→∞} (2n² − n + 1)/(6n² + 1) is equal to:", "o": ["2", "1/3", "2/3", "∞"], "a": 1, "s": "Divide top and bottom by n²: (2 − 1/n + 1/n²)/(6 + 1/n²) → 2/6 = 1/3.", "img": ""}, {"y": 2002, "n": "46", "t": "Limits", "q": "lim_{x→1} (x³ + x − 2)/(x² − x) is equal to:", "o": ["−2", "1", "4", "doesn't exist"], "a": 2, "s": "Factor: x³ + x − 2 = (x − 1)(x² + x + 2) and x² − x = x(x − 1). The limit is (x² + x + 2)/x at x = 1 = 4.", "img": ""}, {"y": 2002, "n": "47", "t": "Limits", "q": "What is the left-hand limit lim_{x→0⁻} (|x| − x·eˣ)/x ?", "o": ["0", "−2", "−1", "Doesn't exist"], "a": 1, "s": "For x &lt; 0, |x| = −x. So (−x − xe<sup>x</sup>)/x = −1 − e<sup>x</sup> → −1 − 1 = −2.", "img": ""}, {"y": 2002, "n": "48", "t": "Continuity", "q": "Let f(x) = a − cos x for x ≤ 0 and f(x) = 3eˣ − a for x &gt; 0. For what value of a is f a continuous function?", "o": ["1", "3/2", "2", "3"], "a": 2, "s": "Continuity at 0: f(0) = a − 1 and the right limit is 3 − a. Setting a − 1 = 3 − a gives a = 2.", "img": ""}, {"y": 2002, "n": "49", "t": "Derivatives", "q": "If f(x) = x³, then lim_{h→0} [f(2+h) − f(2)]/h is equal to:", "o": ["4", "−4", "12", "∞"], "a": 2, "s": "The limit is f′(2). f′(x) = 3x², so f′(2) = 12.", "img": ""}, {"y": 2002, "n": "50", "t": "Derivatives", "q": "Which of the following is the equation of the line tangent to the graph of f(x) = x − π (x ≤ 0), f(x) = 1 − 2 sin x (x &gt; 0) at (π, f(π))?", "o": ["y = 2x − 2π + 1", "y = 2x − 2π − 1", "y = −2x + 2π + 1", "y = −2x + 2π − 1"], "a": 0, "s": "Near x = π we use f = 1 − 2 sin x, so f(π) = 1 and f′(π) = −2 cos π = 2. Tangent: y − 1 = 2(x − π), i.e. y = 2x − 2π + 1.", "img": ""}, {"y": 2002, "n": "51", "t": "Applications of derivatives", "q": "Suppose f is differentiable at all x ∈ (−∞, ∞) and the graph of y = f′(x) is as shown in the figure. Which of the following is true?", "o": ["f is increasing on [3, ∞)", "f attains its minimum value at x = 3", "f is decreasing on [−1, 5]", "f attains its maximum value at x = 5"], "a": 2, "s": "f′ ≤ 0 on [−1, 5], so f is decreasing there. f′ changes from + to − at x = −1 (local maximum) and from − to + at x = 5 (local minimum). Nothing special happens at x = 3 (f′ is not zero there).", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAWQAAAEACAAAAAChFVOwAAABBmlDQ1BJQ0MgUHJvZmlsZQAAeJxjYGCSYAACFgMGhty8kqIgdyeFiMgoBQYkkJhcXMCAGzAyMHy7BiIZGC7r4lGHC3CmpBYnA+kPQFxSBLQcaGQKkC2SDmFXgNhJEHYPiF0UEuQMZC8AsjXSkdhJSOzykoISIPsESH1yQRGIfQfItsnNKU1GuJuBJzUvNBhIRwCxDEMxQxCDO4MTGX7ACxDhmb+IgcHiKwMD8wSEWNJMBobtrQwMErcQYipAP/C3MDBsO1+QWJQIFmIBYqa0NAaGT8sZGHgjGRiELzAwcEVj2oGICxx+VQD71Z0hHwjTGXIYUoEingx5DMkMekCWEYMBgyGDGQCSpUCz8yM2qAAAMthJREFUeNrtvclzHFmaH/j73nP32DcE9o0AV5AACW7JzGQmc6ms7O6qktStkspkfemzZDroOoc5zH8wcx4bk8lkOkjWPSNVa6aya8mqyq2YC7dkcidIgCBA7AHEHuHu731z8AAQAMElAiARQOHlgSQy4PH85z//tvctxGjcxQywIGgBZ6zY1GwKAuwFJxwxAaZt2JBLkhQLgcI02oMvuwejgTEGLd8DO3OPHpt9J6LsFKce67bOhLmNu2JmkkHIl/6NBgaZAXbJBBPp9MMrf1wY/g8DSI9cuuE7KQLmtjAZYCYi1sKMwwRox4MMQm5St8cFCOXpHz7B5M8HUf7hf9xOho6+NiG37lEKJhBpFsJfw0UaFmQm5tL9b92hwSZBIhzx+Uv6MeCO31yKhpsCr08pVKNMAvTS/G18kFkZonT900t6DifjoFDP4Nt3zD8dG8o/mUG5s9XU4NcgL4ieerkYBAEwagC7YUHWWsz96v+eljOyJQ4Yve+41pVf6X9THgdkTxS2IKJt2RdLEswQNTzlBgWZIYR+cvkWYHef6YkQRY7NfJUtfRmiiWTb+/0Sdby0dSynwD6fAFd9GQMg0rtAXDCTxOzdOQCFJ3d6DgaBkJHTofInduH0Lz7oYjJfPY+1QPaB3dnhZ62lWJYXEgRAcC1PuVHFBWHh2ndZHyuav9vfFgRzrO9JuTiGYPf5AbiGfC27cJaKce3pv9WNVf/xcks0pmVBKN377Zdzlgl7+vadWRskBn7xY2MBiPkcQOD12HBWJB40ABKbe20aE2SQ++Taxft5KaQojF27v8jgprff9tmiuSepivp1bcTX1BwxACEArXcXyMxAafzeRNF1tTB57uadaRsawS4/dPORwW6feB3mGwiQoWhAACSImXl3MRmAm8uWtZu3Wevy7MSsDcCIG2R0Hzvc9Pr2LMMRX9WT320gG5FkUkIox4ERp5IDAZQVxfsHun0bOAmvjMmhrbAMGtK6EIDV/ 6wLwdhbrwxkL6BAXk8xpj00X5kJt4ftqxcXtGFt2N7aOc7IHpOrFR9jTybvMXnHMrnSVnJPJO8xeZfI5Ppnq+4xeW/9+YBMeyC/+qX+vGVyVXjzFdGNCHDXTkPbY/KrAHkXODkNLi4IEHsgv2J5rHeF/dO4t0AEOHrPhHstS++B/OoWM2BWJv7yHsivbknxZ28nvwY2746QSGODTJqh9I53rRsc5EqX+h0OcgPLZALKpJXQO14uNyyTWUignLB0s/CmNOyB/IpesuiZsn4jtuNda2pcjjBh4eE0de+PwpW0B/KrAhklLQwDO33RXrLgnjPCANEek/fWDmcydn7l0x6T9zy+PZD31h7IjbX+f8hcDTc+/lSYAAAAAElFTkSuQmCC"}, {"y": 2002, "n": "52", "t": "Applications of derivatives", "q": "Let f(x) = x³ − 12x + 1 be defined on [0, 3]. What is the range of f?", "o": ["(−∞, ∞)", "(−∞, 1]", "[−15, 1]", "[−15, 17]"], "a": 2, "s": "f′ = 3x² − 12 = 0 gives x = 2 in [0, 3]. f(0) = 1, f(2) = 8 − 24 + 1 = −15, f(3) = 27 − 36 + 1 = −8. The maximum is 1 and the minimum is −15, so the range is [−15, 1].", "img": ""}, {"y": 2002, "n": "53", "t": "Derivatives", "q": "If f(x) = ln(2 + sec x), then f′(x) is equal to:", "o": ["tan x / (2 + sec x)", "tan x / (2 + cos x)", "cos x / (1 + 2cos x)", "tan x / (1 + 2cos x)"], "a": 3, "s": "f′ = (sec x tan x)/(2 + sec x). Multiply top and bottom by cos x: tan x/(2 cos x + 1).", "img": ""}, {"y": 2002, "n": "54", "t": "Applications of derivatives", "q": "Which of the following is the set of all critical numbers of f(x) = x − 1 for x &lt; 1, f(x) = x² − x for x ≥ 1?", "o": ["{1}", "{1/2}", "{1/2, 1}", "{ } (no critical numbers)"], "a": 3, "s": "f′ = 1 for x &lt; 1 and 2x − 1 for x ≥ 1. Neither is 0 on its branch (x = 1/2 is not in [1, ∞)). At x = 1 both one-sided derivatives equal 1, so f is differentiable there. f has no critical numbers.", "img": ""}, {"y": 2002, "n": "55", "t": "Derivatives", "q": "Let h(x) = x + 3^x and F(x) = (f∘h)(x) such that f′(4) = −1. Then F′(1) = ?", "o": ["1 + 3 ln 3", "−1 − 3 ln 3", "4 + 12 ln 3", "−4 − 12 ln 3"], "a": 1, "s": "Chain rule: F′(1) = f′(h(1))·h′(1). h(1) = 4 and h′(x) = 1 + 3<sup>x</sup> ln 3, so h′(1) = 1 + 3 ln 3. F′(1) = (−1)(1 + 3 ln 3) = −1 − 3 ln 3.", "img": ""}, {"y": 2002, "n": "56", "t": "Applications of derivatives", "q": "The rate of a certain chemical reaction is given by r(x) = kx(a − x) for 0 ≤ x ≤ a, k &gt; 0. For what values of x does the rate of reaction increase?", "o": ["0 ≤ x ≤ a/2", "a/2 ≤ x ≤ a", "−∞ &lt; x ≤ a/2", "a/2 ≤ x ≤ 3a/4"], "a": 0, "s": "r(x) = akx − kx², so r′(x) = ak − 2kx. The rate increases when r′ ≥ 0: x ≤ a/2. With x ≥ 0 this gives 0 ≤ x ≤ a/2.", "img": ""}, {"y": 2002, "n": "57", "t": "Integration", "q": "Which of the following is equal to ∫₀^{π/3} (tan x / cos x) dx ?", "o": ["1/2", "1", "−1", "−1 + 2√3/3"], "a": 1, "s": "The integrand is sin x/cos²x. Let u = cos x, du = −sin x dx. ∫ = ∫<sub>1/2</sub><sup>1</sup> du/u² … equivalently [1/cos x] from 0 to π/3 = 2 − 1 = 1.", "img": ""}, {"y": 2002, "n": "58", "t": "Applications of integrals", "q": "The area of the region bounded between the graph of f(x) = x³ and the x-axis from x = −1 to x = 2 is:", "o": ["15/4", "17/4", "4", "16"], "a": 1, "s": "f is negative on [−1, 0] and positive on [0, 2], so add absolute values: |∫<sub>−1</sub><sup>0</sup> x³ dx| + ∫<sub>0</sub><sup>2</sup> x³ dx = 1/4 + 4 = 17/4.", "img": ""}, {"y": 2002, "n": "59", "t": "Integration", "q": "∫ (eˣ + 1)² / eˣ dx is equal to:", "o": ["eˣ + e⁻ˣ + 2x + c", "eˣ − e⁻ˣ + 2x + c", "(1/3)(eˣ + 1)³ + c", "(1/3)(1 − e⁻ˣ)³ + c"], "a": 1, "s": "(eˣ + 1)²/eˣ = eˣ + 2 + e⁻ˣ. Integrating gives eˣ + 2x − e⁻ˣ + c.", "img": ""}, {"y": 2003, "n": "4", "t": "Limits", "q": "Which of the following is NOT true about the graph of g(x) = (x² − 1)/(x² + 1)?", "o": ["The range of g is (−∞, 1)", "g is an even function", "y = 1 is a horizontal asymptote", "As x → ∞, g(x) → 1"], "a": 0, "s": "Solving y = (x² − 1)/(x² + 1) for x² gives x² = (1 + y)/(1 − y) ≥ 0, so −1 ≤ y &lt; 1. The range is [−1, 1), not (−∞, 1). The others are true: g(−x) = g(x), and g = 1 − 2/(x² + 1) → 1.", "img": ""}, {"y": 2003, "n": "22", "t": "Sequences", "q": "Let {a_n} be a sequence such that a_{n+1} = −n·a_n, a₁ = 1; n = 1, 2, 3, … Which of the following is NOT true about the sequence?", "o": ["a₃ = 2", "a₄ = −3", "aₙ &gt; 0 if n is odd", "aₙ &lt; 0 if n is even"], "a": 1, "s": "a<sub>2</sub> = −1, a<sub>3</sub> = −2(−1) = 2, a<sub>4</sub> = −3(2) = −6. So a<sub>4</sub> = −3 is false.", "img": ""}, {"y": 2003, "n": "23", "t": "Sequences", "q": "Let S_n = 4n², n = 1, 2, 3, …, be the sum of the first n terms of a sequence {a_n}. Then a₃ is:", "o": ["8", "12", "16", "20"], "a": 3, "s": "a<sub>3</sub> = S<sub>3</sub> − S<sub>2</sub> = 4(9) − 4(4) = 36 − 16 = 20.", "img": ""}, {"y": 2003, "n": "24", "t": "Series", "q": "Let {a_n} be a sequence with a₁ = 2 and a_n = 3a_{n−1} for all n ≥ 2. Then Σ_{i=1}^{20} a_i is equal to:", "o": ["3²⁰ − 1", "1 − 1/3²⁰", "1 − 1/2²¹", "3⁻²⁰ − 1"], "a": 0, "s": "Geometric with a = 2, r = 3. S<sub>20</sub> = 2(3<sup>20</sup> − 1)/(3 − 1) = 3<sup>20</sup> − 1.", "img": ""}, {"y": 2003, "n": "25", "t": "Limits", "q": "lim_{n→∞} (n + cos 3n)/(2 − n) is equal to:", "o": ["−1", "0", "1", "3"], "a": 0, "s": "Divide by n: (1 + cos3n/n)/(2/n − 1). Since |cos 3n| ≤ 1, cos3n/n → 0, so the limit is 1/(−1) = −1.", "img": ""}, {"y": 2003, "n": "26", "t": "Limits", "q": "The left-hand limit lim_{x→0⁻} (|x| − 2eˣ·x)/x is equal to:", "o": ["0", "−2", "−3", "doesn't exist"], "a": 2, "s": "For x &lt; 0, |x| = −x. So the expression is (−x − 2xe<sup>x</sup>)/x = −1 − 2e<sup>x</sup> → −1 − 2 = −3.", "img": ""}, {"y": 2003, "n": "27", "t": "Limits", "q": "lim_{x→π} x·sin 2x / (x − π) is equal to:", "o": ["2π", "π", "0", "1"], "a": 0, "s": "Let y = x − π, so sin 2x = sin(2y + 2π) = sin 2y. The limit is lim (y + π)·sin 2y/y = π·2 = 2π.", "img": ""}, {"y": 2003, "n": "28", "t": "Limits", "q": "Let f(x) = (√x − 2)/(−4/x + 1). Then lim_{x→4⁺} f(x) is equal to:", "o": ["0", "1/4", "1", "−∞"], "a": 2, "s": "Multiply top and bottom by x: x(√x − 2)/(x − 4). Since x − 4 = (√x − 2)(√x + 2), this is x/(√x + 2) → 4/4 = 1.", "img": ""}, {"y": 2003, "n": "29", "t": "Limits", "q": "lim_{x→2} (6x − 12)/(x² − x − 2) is equal to:", "o": ["0", "2", "1", "∞"], "a": 1, "s": "6(x − 2)/((x − 2)(x + 1)) = 6/(x + 1) → 6/3 = 2.", "img": ""}, {"y": 2003, "n": "30", "t": "Continuity", "q": "Let f(x) = 3a − x (x &lt; 1), f(1) = b + 1, f(x) = ax (x &gt; 1). If f is continuous at x = 1, what is the value of b?", "o": ["−1/2", "1/2", "−1", "3"], "a": 0, "s": "Left limit 3a − 1 equals right limit a, so a = 1/2. Then f(1) = b + 1 must equal a = 1/2, so b = −1/2.", "img": ""}, {"y": 2003, "n": "31", "t": "Continuity", "q": "On which interval is f continuous, where f(x) = (x − x²)/(x − 1) for x < 0 and f(x) = 3 − x for x ≥ 0?", "o": ["(−∞, 0]", "[−2, 1]", "[−1, 2]", "[0, ∞)"], "a": 3, "s": "At x = 0 the left limit is (0 − 0)/(0 − 1) = 0, but f(0) = 3, so f is not continuous at 0 from the left. Each piece is continuous on its own domain, so f is continuous on [0, ∞) (and on (−∞, 0)). Only D avoids the break.", "img": ""}, {"y": 2003, "n": "32", "t": "Derivatives", "q": "If f(x) = x⁵ + 2x, then lim_{h→0} [f(1 + h) − f(1)]/h is equal to:", "o": ["1", "7", "5", "∞"], "a": 1, "s": "The limit is f′(1). f′(x) = 5x⁴ + 2, so f′(1) = 7.", "img": ""}, {"y": 2003, "n": "33", "t": "Derivatives", "q": "Let f(x) = e^(3x−1) and g(x) = tan x. If F(x) = x·f(x) + f(g(x)), then F′(0) is:", "o": ["3e⁻¹", "4e⁻¹", "(1/e)(1 + 1/e)", "(1/e)(1 + 3/e)"], "a": 1, "s": "F′ = f(x) + x f′(x) + f′(g(x))·g′(x). At x = 0: f(0) = e<sup>−1</sup>, the middle term is 0, and f′(0)g′(0) = 3e<sup>−1</sup>(1). Total = 4e<sup>−1</sup>.", "img": ""}, {"y": 2003, "n": "34", "t": "Derivatives", "q": "Let f(x) = g(√(4x + 1)). If g′(3) = 1/2, then f′(2) is equal to:", "o": ["2/3", "1/3", "(1/2)√5", "(1/2)√13"], "a": 1, "s": "Chain rule: f′(x) = g′(√(4x+1))· 4/(2√(4x+1)). At x = 2: √9 = 3, so f′(2) = (1/2)(4/6) = 1/3.", "img": ""}, {"y": 2003, "n": "35", "t": "Derivatives", "q": "The second derivative of f(x) = ln(x² + 1) is:", "o": ["(1 − 2x²)/(x² + 1)", "−2(x² − 1)/(x² + 1)", "−2(x² − 1)/(x² + 1)²", "(2 − 4x²)/(x² + 1)²"], "a": 2, "s": "f′ = 2x/(x²+1). f″ = [2(x²+1) − 2x(2x)]/(x²+1)² = (2 − 2x²)/(x²+1)² = −2(x² − 1)/(x²+1)².", "img": ""}, {"y": 2003, "n": "36", "t": "Derivatives", "q": "Let f(x) = x|x| for all x ∈ (−∞, ∞). Which of the following is true?", "o": ["f is not differentiable at x = 0", "f′(x) = 2|x| at each x ∈ (−∞, ∞)", "f is differentiable only on (0, ∞)", "f′(x) = 2x at each x ∈ (−∞, ∞)"], "a": 1, "s": "f(x) = x² for x ≥ 0 and −x² for x &lt; 0. So f′(x) = 2x for x ≥ 0 and −2x for x &lt; 0, which is 2|x|. At 0 both sides give 0, so f is differentiable everywhere.", "img": ""}, {"y": 2003, "n": "37", "t": "Applications of derivatives", "q": "Let f(x) = x⁴ − 6x² + 1 on [−2, 3]. The local maximum value of f is:", "o": ["f(0)", "f(√3)", "f(3)", "f(−√3)"], "a": 2, "s": "f′ = 4x³ − 12x = 4x(x² − 3) = 0 gives x = 0, ±√3. f(0) = 1, f(±√3) = 9 − 18 + 1 = −8, f(3) = 81 − 54 + 1 = 28, f(−2) = −7. The largest value is f(3) = 28.", "img": ""}, {"y": 2003, "n": "38", "t": "Applications of derivatives", "q": "Let f(x) = x⁴ − (16/3)x³ + 6x² for all x ∈ (−∞, ∞). What is the range of f?", "o": ["(−∞, ∞)", "[0, ∞)", "[−9, ∞)", "[5/3, −9]"], "a": 2, "s": "f′ = 4x(x − 1)(x − 3) = 0 gives x = 0, 1, 3. f(0) = 0, f(1) = 5/3, f(3) = 81 − 144 + 54 = −9. The minimum is −9, and f → ∞ at both ends, so the range is [−9, ∞).", "img": ""}, {"y": 2003, "n": "39", "t": "Applications of derivatives", "q": "Suppose f is differentiable at all x ∈ (−∞, ∞) and the graph of y = f′(x) is as shown in the figure. Which of the following is true?", "o": ["f is increasing on (−∞, 1)", "f attains its maximum value at x = 2", "f attains its maximum value at x = 1", "f is decreasing on (0, 2)"], "a": 1, "s": "The sign of f′ is −, +, − around 0 and 2. So f decreases on (−∞, 0), increases on (0, 2), then decreases on (2, ∞). It has a local minimum at x = 0 and a local maximum at x = 2.", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbgAAAGQCAAAAAD5Xio0AAABBmlDQ1BJQ0MgUHJvZmlsZQAAeJxjYGCSYAACFgMGhty8kqIgdyeFiMgoBQYkkJhcXMCAGzAyMHy7BiIZGC7r4lGHC3CmpBYnA+kPQFxSBLQcaGQKkC2SDmFXgNhJEHY : "40", "t": "Related rates", "q": "The radius of a right circular cylinder of height 10 cm increases at a rate of 3 cm/min. What is the rate of change of the volume of the cylinder when the radius is 8 cm?", "o": ["80π cm³/min", "320π cm³/min", "480π cm³/min", "640π cm³/min"], "a": 2, "s": "V = πr²h, so dV/dt = 2πrh·(dr/dt) = 2π(8)(10)(3) = 480π cm³/min.", "img": ""}, {"y": 2003, "n": "41", "t": "Optimization", "q": "A farmer wants to make three identical rectangular enclosures (same width and same length) along a straight river; the sides along the river need no fence. If he has 1,200 m of fencing, what should be the dimensions (length ℓ, width w) of each enclosure so that the total area of the enclosures is maximized? (The fencing used is 3ℓ + 4w = 1200.)", "o": ["ℓ = 100 m, w = 225 m", "ℓ = 300 m, w = 75 m", "ℓ = 200 m, w = 200 m", "ℓ = 200 m, w = 150 m"], "a": 3, "s": "Let ℓ be the length of each enclosure along the river and w its width. Fencing: 3ℓ + 4w = 1200, so w = 300 − (3/4)ℓ. Area A = 3ℓw = 900ℓ − (9/4)ℓ². A′ = 900 − (9/2)ℓ = 0 gives ℓ = 200 and w = 150.", "img": ""}, {"y": 2003, "n": "42", "t": "Integration", "q": "Which of the following is an anti-derivative of f(x) = 3/(x√x)?", "o": ["6/√x + C", "−6√x + C", "−6/√x + C", "−3/(2√x) + 3"], "a": 2, "s": "f(x) = 3x<sup>−3/2</sup>. ∫ = 3·x<sup>−1/2</sup>/(−1/2) + C = −6/√x + C.", "img": ""}, {"y": 2003, "n": "43", "t": "Integration", "q": "Which of the following is equal to ∫ (x² − 1)/(x³ + x) dx ?", "o": ["ln|x² + 1| + ln|x| + C", "½ ln(x² + 1) − ln|x| + C", "ln(x² + 1) − ln|x| + C", "2 ln(x² + 1) − ln|x| + C"], "a": 2, "s": "Partial fractions: (x² − 1)/(x(x² + 1)) = −1/x + 2x/(x² + 1). Integrate: −ln|x| + ln(x² + 1) + C.", "img": ""}, {"y": 2003, "n": "44", "t": "Integration", "q": "∫ (2 + sin²x) cot x dx is equal to:", "o": ["2 csc x − sec²x + C", "2 ln|sin x| + ½ sin²x + C", "2 ln|sin x| − cos²x + C", "2 csc x + sin x cos x + C"], "a": 1, "s": "Expand: 2 cot x + sin x cos x. ∫2 cot x dx = 2 ln|sin x|. ∫ sin x cos x dx = ½ sin²x. Total: 2 ln|sin x| + ½ sin²x + C.", "img": ""}, {"y": 2003, "n": "45", "t": "Integration", "q": "∫₁² x(1/x² + 2 ln x) dx is equal to:", "o": ["2 ln 2 − 1", "5 ln 2 + 5/2", "2 ln 2 − 5/2", "5 ln 2 − 3/2"], "a": 3, "s": "Split: ∫<sub>1</sub><sup>2</sup> dx/x = ln 2. By parts, ∫<sub>1</sub><sup>2</sup> 2x ln x dx = [x² ln x − x²/2]<sub>1</sub><sup>2</sup> = 4 ln 2 − 3/2. Total: 5 ln 2 − 3/2.", "img": ""}, {"y": 2003, "n": "46", "t": "Integration", "q": "∫₀¹ dx / (e⁻ˣ(1 + eˣ)) is equal to:", "o": ["ln(e − 1)", "ln(1 + e) − ln 2", "ln(2 + e)", "ln 2"], "a": 1, "s": "1/e<sup>−x</sup> = e<sup>x</sup>, so the integrand is e<sup>x</sup>/(1 + e<sup>x</sup>). Let u = 1 + e<sup>x</sup>: ∫ = ln(1 + e<sup>x</sup>) from 0 to 1 = ln(1 + e) − ln 2.", "img": ""}, {"y": 2003, "n": "47", "t": "Applications of integrals", "q": "The area of the region bounded between the graphs of y = x² and y = √x is:", "o": ["35 sq. unit", "1/3 sq. unit", "2/3 sq. unit", "1 sq. unit"], "a": 1, "s": "The curves meet at (0, 0) and (1, 1), with √x on top. A = ∫<sub>0</sub><sup>1</sup> (√x − x²) dx = 2/3 − 1/3 = 1/3.", "img": ""}, {"y": 2004, "n": "37", "t": "Sequences", "q": "Let a_n = n + cos nπ, n = 1, 2, 3, …, be the n-th term of a sequence. Then which of the following is true?", "o": ["a₅ = 6", "a₁₀ = 9", "a₇ + a₈ = 15", "a₇ − a₆ = 1"], "a": 2, "s": "cos nπ = (−1)<sup>n</sup>. a<sub>5</sub> = 4, a<sub>10</sub> = 11, a<sub>7</sub> = 6, a<sub>8</sub> = 9, a<sub>6</sub> = 7. So a<sub>7</sub> + a<sub>8</sub> = 15 is true and a<sub>7</sub> − a<sub>6</sub> = −1.", "img": ""}, {"y": 2004, "n": "38", "t": "Series", "q": "If {A_n} is an arithmetic sequence with first term A₁ = 5 and A₅ = 21, then Σ_{n=1}^{20} A_n = ?", "o": ["760", "780", "860", "870"], "a": 2, "s": "d = (21 − 5)/4 = 4. S<sub>20</sub> = (20/2)[2(5) + 19(4)] = 10(86) = 860.", "img": ""}, {"y": 2004, "n": "39", "t": "Series", "q": "What is the sum of the series Σ_{n=0}^{∞} 2ⁿ·3^(2−n) ?", "o": ["6", "18", "27", "∞"], "a": 2, "s": "2<sup>n</sup>·3<sup>2−n</sup> = 9(2/3)<sup>n</sup>. First term 9, r = 2/3, so S = 9/(1 − 2/3) = 27.", "img": ""}, {"y": 2004, "n": "40", "t": "Sequences", "q": "A business association gets a net profit of Birr 3,000 at the end of each month. Just after the fifth year, its amount was Birr 230,000. What was the starting amount of the business?", "o": ["Birr 47,000", "Birr 53,000", "Birr 50,000", "Birr 56,000"], "a": 2, "s": "Profit in 5 years = 12 × 5 × 3,000 = 180,000. Starting amount = 230,000 − 180,000 = 50,000.", "img": ""}, {"y": 2004, "n": "41", "t": "Limits", "q": "lim_{n→∞} (3√n − 6n + 5)/(4n + 1) equals:", "o": ["−3/2", "0", "3/4", "5/4"], "a": 0, "s": "Divide by n: (3/√n − 6 + 5/n)/(4 + 1/n) → −6/4 = −3/2.", "img": ""}, {"y": 2004, "n": "42", "t": "Limits", "q": "lim_{x→1⁻} (x⁴ − 1)/|x − 1| equals:", "o": ["4", "0", "−1", "−4"], "a": 3, "s": "For x < 1, |x − 1| = −(x − 1). So the expression is −(x + 1)(x² + 1) → −(2)(2) = −4.", "img": ""}, {"y": 2004, "n": "43", "t": "Limits", "q": "lim_{x→0} x·csc 3x / (x + 1) is equal to:", "o": ["1/3", "0", "1", "3"], "a": 0, "s": "x csc 3x = x/sin 3x → 1/3, and 1/(x + 1) → 1. Product: 1/3.", "img": ""}, {"y": 2004, "n": "44", "t": "Limits", "q": "lim_{x→∞} (1 + 1/x)^(2x+4) is equal to:", "o": ["e", "e²", "e⁴", "∞"], "a": 1, "s": "(1 + 1/x)<sup>2x</sup>·(1 + 1/x)<sup>4</sup> → e²·1 = e².", "img": ""}, {"y": 2004, "n": "45", "t": "Continuity", "q": "Let f(x) = a/(x² + 3) if x ≤ 1, and f(x) = (x − 1)/(√x − 1) if x &gt; 1. What is the value of a if f is continuous at x = 1?", "o": ["0", "2", "4", "8"], "a": 3, "s": "For x &gt; 1, (x − 1)/(√x − 1) = √x + 1 → 2. For x ≤ 1, f(1) = a/(1 + 3) = a/4. Continuity: a/4 = 2, so a = 8.", "img": ""}, {"y": 2004, "n": "46", "t": "Derivatives", "q": "If f(x) = π², then f′(1) is equal to:", "o": ["2π", "e²", "1", "0"], "a": 3, "s": "f is a constant function, so f′(x) = 0 for every x.", "img": ""}, {"y": 2004, "n": "47", "t": "Derivatives", "q": "Let f(x) = 6x/(x + a). For what value of a is f′(a) = 1?", "o": ["1/3", "2/3", "3/2", "3"], "a": 2, "s": "f′(x) = 6a/(x + a)². Then f′(a) = 6a/(4a²) = 3/(2a) = 1, so a = 3/2.", "img": ""}, {"y": 2004, "n": "48", "t": "Derivatives", "q": "Which one of the following is necessarily true about a function f(x)?", "o": ["If f is continuous at x = a, then f is differentiable at x = a.", "If f is not differentiable at x = a, then lim_{x→a⁻} f(x) ≠ lim_{x→a⁺} f(x).", "If f is differentiable at x = a, then lim_{x→a⁻} f(x) = f(a) = lim_{x→a⁺} f(x).", "If the derivative f′(a) = 0, then f attains its maximum value at x = a."], "a": 2, "s": "Differentiability implies continuity, so C is true. A is false (|x − 1| at x = 1). B is false (the same example is continuous but not differentiable). D is false (x³ at 0).", "img": ""}, {"y": 2004, "n": "49", "t": "Derivatives", "q": "If g(x) = f(x)/(x + 1) + (f(x))², f(1) = 8 and f′(1) = 2, then g′(1) is equal to:", "o": ["36", "31", "25", "16"], "a": 1, "s": "g′ = [f′(x+1) − f(x)]/(x+1)² + 2f f′. At x = 1: (2·2 − 8)/4 + 2(8)(2) = −1 + 32 = 31.", "img": ""}, {"y": 2004, "n": "50", "t": "Derivatives", "q": "If f(x) = x·e^(3x) − cos(2x), then f″(0) is equal to:", "o": ["0", "2", "6", "10"], "a": 3, "s": "f′ = e<sup>3x</sup> + 3x·e<sup>3x</sup> + 2 sin 2x. f″ = 3e<sup>3x</sup> + 3e<sup>3x</sup> + 9x·e<sup>3x</sup> + 4 cos 2x. At x = 0: 3 + 3 + 0 + 4 = 10.", "img": ""}, {"y": 2004, "n": "51", "t": "Applications of derivatives", "q": "At what value(s) of x does f(x) = x³/3 − x²/2 − 2x + 1 have a local maximum?", "o": ["x = 2", "x = −1", "x = 5", "x = 2, x = −1"], "a": 1, "s": "f′ = x² − x − 2 = (x − 2)(x + 1) = 0 gives x = 2, −1. f″ = 2x − 1: f″(2) = 3 &gt; 0 (local minimum) and f″(−1) = −3 &lt; 0 (local maximum). So the local maximum is at x = −1.", "img": ""}, {"y": 2004, "n": "52", "t": "Applications of derivatives", "q": "Look at the graph of f′(x) shown in the figure. Which of the following is true about f?", "o": ["f is increasing on [c, d]", "f is decreasing on [b, c]", "f has a local minimum at d", "f has a local extreme value at c"], "a": 0, "s": "f′ ≥ 0 on [a, d], so f is increasing on [c, d] (and on [a, b]). f′ changes from − to + at a (local minimum) and from + to − at d (local maximum). At b and c the sign does not change, so there is no extremum there.", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcgAAAEECAAAAACJ4Pv5AAABBmlDQ1BJQ0MgUHJvZmlsZQAAeJxjYGCSYAACFgMGhty8kqIgdyeFiMgoBQYkkJhcXMCAGzAyMHy7BiIZGC7r4lGHC3CmpBYnA+kPQFxSBLQcaGQKkC2SDmFXgNhJEHYPiF0UEuQMZC8AsjXSkdhJSOzykoISIPsESH1yQRGIfQfItsnNKU1GuJuBJzUvNBhIRwCxDEMxQxCDO4MTGX7ACxDhmb+IgcHiKwMD8wSEWNJMBobtrQwMErcQYipAP/C3MDBsO1+QWJQIFmIBYqa0NAaGT8sZGHgjGRiELzAwcEVj2oGICxx+VQD71Z0hHwjTGXIYUoEingx5DMkMekCWEYMBgyGDGQCSpUCz8yM2qAAAT5FJREFUeNrtvVdwXFmaJvb955x702cCCU84kgAJes8iiyzfXVXtpnumd2diVjGxsatYPWkf9CA96E3vCkVs6E0KKVYPq+2Rdoyme7q7ust0OXrvHWhBEN6lz3vvOb8ebsKDABJIEGQVb0UFSSDNOec/v///7yfGGj3MIFrwF4RsH5oiq/4C0HJeZjwoMfed/v9i5V9uPFai9P3sQdHk59KM71hgfU6GInJ8oP/piFu9bU8CnphehHY1SangubAUcr3DnqFYMqrcImwbbtFOyFzGYUGeZiGlsIIKhkAQSpLCC34YTBABSBiWyyXGgs8y3ynsNdmH4OnvX+aFYEMkJBFZ0STHcmwMQGA3nzWBoKUUCZAQgJCAYROs9lxHSGE8La0ApFDQmgVJAmsDsDSaNYEgAKEqTqTFD5gNE6BiZLHLJDQrYiZamL8WI7NhopXeAlrBzua8jyRPyRsSoHmrXeA7jEO2tCEorGLN7sRTwQAJd3xgqBCqqU0IUoaIALKMKWpOVHFunGzpOJ6yg/AsNq5jhGURGW0Y0J5mDRAJ5hUQkg0EPU9ygA1kiSz0HIlLgIqS5JL8ff4X+fR9zrmLhc6aFhDjmT5siIBp1cSc83Yq/7OIiAIsSKkwsMF2FUBg42lXutpoJQTYABAw2qiARER5YaUlwyuyx2DPM0IoYVwByxZkICQzhJJg4vLuJUEXEZDQHpRciEwOLAnWkLTIZ/gXFETMAjMPmaevgGESYNYkxHzOZAJcbc1kSmMgxCTvlL6EtcKtX9F/1QVPEtb9YdCM3RaMLQFwsehosm1FSgKuZoCYQVIosMMSTtHVhrVnrKD0XLZDws17MhIip0AhxdooWzGrlcglBuBhobfSNFF8zl1ErAnAN4cW5Gw2DJYEYixIxuJQr90Rh1mcPgZI3aIMYCSvng0rQEoCAQbMJIIliysU8u+h8VxmBgmS5J8ccwDGA8EruJ6nrXBQwLgktIayLeOkZCiEfKEIIaHKoyEziQALgB0EMFdgMUhYIIAkSDuw5cq0FwOGDTyjgiSZ5qpLZkLx8ZlLdT/dM0M004ICAghuFCGAGQtfrBf4aMdYFpWE0pSGLe3PQBYznrItNW1jEwHGLRRcDSGEKXpOWMIzxAxTNN7YSCAW40LKCcZDVnkcqV22pARgChlYYfFc3bXaEzNGC8qPUG1MEYxhn0w8RWhK3/nyzIa2tioJIxZRVAQkj1A1IIjXXbKavA4K6S+UyExeLA0DJiOJAKGUhOM  which of the following intervals is the graph of f(x) = ln(x² + 1) concave upward?", "o": ["(−∞, −1] ∪ [1, ∞)", "[0, ∞)", "(−∞, 0]", "(−1, 1)"], "a": 3, "s": "f″ = (2 − 2x²)/(x² + 1)². f″ &gt; 0 when 2 − 2x² &gt; 0, i.e. −1 &lt; x &lt; 1. So f is concave upward on (−1, 1).", "img": ""}, {"y": 2004, "n": "54", "t": "Related rates", "q": "Water is poured into a cylindrical tanker of radius 5 meters at a rate of 10 m³/min. What is the rate of change of the height of the water level when it rises to 3 meters?", "o": ["3/(25π) m/min", "2/(5π) m/min", "1/(2π) m/min", "3/(5π) m/min"], "a": 1, "s": "V = πr²h = 25πh. Differentiate with respect to t: dV/dt = 25π·dh/dt. So 10 = 25π·dh/dt and dh/dt = 2/(5π) m/min.", "img": ""}, {"y": 2004, "n": "55", "t": "Optimization", "q": "A rectangular field of length ℓ and width w meters (w &lt; ℓ) has perimeter 400 meters. If a circular region of area w² is to be reserved for office purposes, what should be the length of the field so that the area of the remaining region is maximum?", "o": ["50 m", "100 m", "120 m", "150 m"], "a": 3, "s": "2w + 2ℓ = 400, so ℓ = 200 − w. Remaining area A = ℓw − w² = (200 − w)w − w² = 200w − 2w². A′ = 200 − 4w = 0 gives w = 50, so ℓ = 150 m.", "img": ""}, {"y": 2004, "n": "56", "t": "Integration", "q": "The anti-derivative of f(x) = tan x is:", "o": ["½ tan²x", "sec²x", "−ln(cos x)", "ln|sec x|"], "a": 3, "s": "∫tan x dx = ∫sin x/cos x dx. Let u = cos x to get −ln|cos x| + c = ln|sec x| + c. Since −ln|cos x| = ln|1/cos x|, this equals ln|sec x|.", "img": ""}, {"y": 2004, "n": "57", "t": "Integration", "q": "∫ x/(x² + 2x + 1) dx is equal to:", "o": ["ln(x² + 2x + 1) + c", "ln|x + 1| + 1/(x + 1) + c", "ln(x² + 2x + 1) − 1/(x + 1) + c", "ln(x² + 2x + 1) + 1/(x + 1) + c"], "a": 1, "s": "x/(x+1)². Let u = x + 1, so x = u − 1: ∫(u − 1)/u² du = ln|u| + 1/u + c = ln|x + 1| + 1/(x + 1) + c.", "img": ""}, {"y": 2004, "n": "58", "t": "Integration", "q": "∫ (e^(2x) − 4x)/(x·e^(2x)) dx is equal to:", "o": ["ln|x| + 2e^(−2x) + c", "ln|x| − 4e^(2x) + c", "ln|x| + 4e^(−2x) + c", "−1/x² + 2e^(−2x) + c"], "a": 0, "s": "Split: ∫(1/x − 4e<sup>−2x</sup>) dx = ln|x| − 4·e<sup>−2x</sup>/(−2) + c = ln|x| + 2e<sup>−2x</sup> + c.", "img": ""}, {"y": 2004, "n": "59", "t": "Integration", "q": "∫₀¹ (x − 1)²/(x + 1) dx is equal to:", "o": ["−3/2 + ln 6", "−5/2 + ln 15", "−5/2 + 4 ln 2", "5/2 + ln 16"], "a": 2, "s": "(x−1)²/(x+1) = x − 3 + 4/(x+1). Integrate: x²/2 − 3x + 4ln|x+1| from 0 to 1 = 1/2 − 3 + 4 ln 2 = −5/2 + 4 ln 2.", "img": ""}, {"y": 2004, "n": "60", "t": "Integration", "q": "If f(x) = sin x for x ≤ 0 and f(x) = 3x√(x² + 1) for x &gt; 0, then ∫_{−π/2}^{√8} f(x) dx equals:", "o": ["17", "25", "27", "3√8"], "a": 1, "s": "Split at 0. ∫<sub>−π/2</sub><sup>0</sup> sin x dx = −cos x |<sub>−π/2</sub><sup>0</sup> = −1. For the second part let u = √(x²+1), so u du = x dx and ∫<sub>1</sub><sup>3</sup> 3u² du = 27 − 1 = 26. Total = 25.", "img": ""}, {"y": 2004, "n": "61", "t": "Applications of integrals", "q": "The solid generated when the region bounded by y = √(x + 1) and the x-axis, from x = 0 to x = 2, is rotated about the x-axis has volume:", "o": ["4π", "3π", "4π/3", "3π/4"], "a": 0, "s": "V = π∫<sub>0</sub><sup>2</sup> (x + 1) dx = π[x²/2 + x]<sub>0</sub><sup>2</sup> = π(2 + 2) = 4π.", "img": ""}, {"y": 2005, "n": "40", "t": "Series", "q": "If {a_n} is a sequence such that a₁ = 2 and a_{n+1} = a_n + 4 for all n ≥ 1, then Σ_{n=1}^{35} a_n is equal to:", "o": ["2460", "2458", "2450", "2442"], "a": 2, "s": "Arithmetic with a = 2, d = 4. S<sub>35</sub> = (35/2)[2(2) + 34(4)] = (35/2)(140) = 2450.", "img": ""}, {"y": 2005, "n": "41", "t": "Sequences", "q": "The population of a certain country is currently 80 million with a growth rate of 2% per year. Given (1.02)⁹ ≈ 1.19 and (1.02)¹⁰ ≈ 1.22, which one of the following is the best approximation of the population after 10 years (in millions)?", "o": ["81.9 million", "86.8 million", "95.2 million", "97.6 million"], "a": 3, "s": "Geometric growth: G<sub>10</sub> = 80(1.02)<sup>10</sup> ≈ 80(1.22) = 97.6 million.", "img": ""}, {"y": 2005, "n": "42", "t": "Sequences", "q": "What is the 50th term of the sequence 3, 10, 17, 24, 31, …?", "o": ["310", "346", "510", "531"], "a": 1, "s": "d = 7. a<sub>50</sub> = 3 + (50 − 1)(7) = 346.", "img": ""}, {"y": 2005, "n": "43", "t": "Series", "q": "What is the sum of the series Σ_{n=1}^{∞} 2^(2n+1) / 5^(n−1) ?", "o": ["40", "20", "10", "0"], "a": 0, "s": "2<sup>2n+1</sup>/5<sup>n−1</sup> = 2·4<sup>n</sup>·5/5<sup>n</sup> = 10(4/5)<sup>n</sup>. First term = 8, r = 4/5, so S = 8/(1 − 4/5) = 40.", "img": ""}, {"y": 2005, "n": "44", "t": "Limits", "q": "Which one of the following is equal to lim_{n→∞} (1 − n − 3n²)/(6n² + 1) ?", "o": ["1/6", "−1/2", "−1/6", "−∞"], "a": 1, "s": "Divide by n²: (1/n² − 1/n − 3)/(6 + 1/n²) → −3/6 = −1/2.", "img": ""}, {"y": 2005, "n": "45", "t": "Limits", "q": "lim_{x→1} (√x − 1)/(x² − 1) is equal to:", "o": ["∞", "1/2", "1/4", "0"], "a": 2, "s": "x² − 1 = (x − 1)(x + 1) and x − 1 = (√x − 1)(√x + 1). The limit is 1/((x + 1)(√x + 1)) = 1/(2·2) = 1/4.", "img": ""}, {"y": 2005, "n": "46", "t": "Limits", "q": "lim_{x→1} (1 − x)/(1 − 1/x²) = ?", "o": ["1", "0", "−1/2", "Does not exist"], "a": 2, "s": "(1 − 1/x²) = (x² − 1)/x², so the fraction is (1 − x)x²/((x − 1)(x + 1)) = −x²/(x + 1) → −1/2.", "img": ""}, {"y": 2005, "n": "47", "t": "Limits", "q": "lim_{x→∞} (1 + 1/x)^(−x/2) is equal to:", "o": ["1/√e", "√e", "e⁻²", "∞"], "a": 0, "s": "[(1 + 1/x)<sup>x</sup>]<sup>−1/2</sup> → e<sup>−1/2</sup> = 1/√e.", "img": ""}, {"y": 2005, "n": "48", "t": "Continuity", "q": "Let f(x) = 3^x + k if x ≤ 0, and f(x) = 3 sin(2x)/x if x &gt; 0. If f is continuous at x = 0, what is the value of k?", "o": ["6", "5", "2", "0"], "a": 1, "s": "f(0) = 1 + k. The right limit is 3 sin 2x/x → 6. So 1 + k = 6 and k = 5.", "img": ""}, {"y": 2005, "n": "49", "t": "Derivatives", "q": "If f(x) = x² + 2 ln x, then what is lim_{h→0} [f(2 + h) − f(2)]/h ?", "o": ["5", "4", "2", "0"], "a": 0, "s": "The limit is f′(2). f′(x) = 2x + 2/x, so f′(2) = 4 + 1 = 5.", "img": ""}, {"y": 2005, "n": "50", "t": "Derivatives", "q": "The equation of the line tangent to the graph of f(x) = 1/(x + 1) + cos x at (0, f(0)) is:", "o": ["x + y = 1", "x − y = −2", "x + y = 2", "x + 4y = 2"], "a": 2, "s": "f(0) = 1 + 1 = 2. f′(x) = −1/(x+1)² − sin x, so f′(0) = −1. Tangent: y − 2 = −1(x − 0), i.e. x + y = 2.", "img": ""}, {"y": 2005, "n": "51", "t": "Derivatives", "q": "If g(x) = x·f(x) − √(f(x)) and f(2) = f′(2) = 4, then g′(2) is equal to:", "o": ["11", "8", "2", "0"], "a": 0, "s": "g′ = f(x) + x f′(x) − f′(x)/(2√f(x)). At x = 2: 4 + 2(4) − 4/(2·2) = 12 − 1 = 11.", "img": ""}, {"y": 2005, "n": "52", "t": "Derivatives", "q": "Which one of the following is true about the derivative of f(x) = x|x|?", "o": ["f is not differentiable at x = 0", "f′(x) = 2|x| for every x ∈ (−∞, ∞)", "f′(x) = 2x for every x ∈ (−∞, ∞)", "f′(x) = |x| + x for every x ∈ (−∞, ∞)"], "a": 1, "s": "f = x² for x ≥ 0 and −x² for x < 0, so f′ = 2x for x > 0 and −2x for x < 0, which is 2|x|. At 0 both sides give 0.", "img": ""}, {"y": 2005, "n": "53", "t": "Derivatives", "q": "If f(x) = e^(2x) + x − 3 cos x, then f″(x) = ?", "o": ["e^(2x) + 1 − 3 sin x", "e^(2x) + 1 + 3 sin x", "4e^(2x) − 3 cos x", "4e^(2x) + 3 cos x"], "a": 3, "s": "f′ = 2e<sup>2x</sup> + 1 + 3 sin x, so f″ = 4e<sup>2x</sup> + 3 cos x.", "img": ""}, {"y": 2005, "n": "54", "t": "Applications of derivatives", "q": "On which one of the following intervals is f(x) = x⁴ + 4x increasing?", "o": ["(−∞, −1]", "(−∞, 0]", "[−1, ∞)", "(−∞, ∞)"], "a": 2, "s": "f′ = 4x³ + 4 = 4(x³ + 1) ≥ 0 exactly when x ≥ −1. So f is increasing on [−1, ∞).", "img": ""}, {"y": 2005, "n": "55", "t": "Applications of derivatives", "q": "Suppose f is differentiable on (−∞, ∞) and the graph of its derivative y = f′(x) is as shown in the figure. Which one of the following is true about f?", "o": ["f is decreasing on (−∞, 0] ∪ [1, ∞)", "f has a local minimum at x = −2", "f is concave down on [0, ∞)", "f is concave up on (−1, 1)"], "a": 3, "s": "f′ is increasing on (−1, 1), so f″ > 0 there and f is concave up on (−1, 1). A is false (f is increasing on (−∞, −2]). At x = −2, f′ changes from + to −, so it is a local maximum, not a minimum (B false). C is false because f″ changes sign.", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAhIAAAGWCAAAAAAInzUwAAABBmlDQ1BJQ0MgUHJvZmlsZQAAeJxjYGCSYAACFgMGhty8kqIgdyeFiMgoBQYkkJhcXMCAGzAyMHy7BiIZGC7r4lGHC3CmpBYnA+kPQFxSBLQcaGQKkC2SDmFXgNhJEHYPiF0UEuQMZC8AsjXSkdhJSOzykoISIPsESH1yQRGIfQfItsnNKU1GuJuBJzUvNBhIRwCxDEMxQxCDO4MTGX7ACxDhmb+IgcHiKwMD8wSEWNJMBobtrQwMErcQYipAP/C3MDBsO1+QWJQIFmIBYqa0NAaGT8sZGHgjGRiELzAwcEVj2oGICxx+VQD71Z0hHwjTGXIYUoEingx5DMkMekCWEYMBgyGDGQCSpUCz8yM2qAAAY6FJREFUeNrt/Vd3XFmWJgh++5yrTJvBoBVBghLU7qTTna5FhIfMiMrMqsrqalW9Zlqsnl8yD/MwD/0wM2vNmq5a1dWZGZGRGVq4CPdwRZcUTi0BEFqatnvvOXserhkUIQwgSAKE3RVBBwmYwe6539nn2+rbxKhfy11M4JwvbVOAacm3FCQBAIPAoKfszo36w1/p0rmhGdncas9DgoM/hFH5GwNPHSDqkFjRRpDO3Dp/2zj2ig2uYII1M5hhyMpfNYMEEVEdEjvAQkj4A5++d0Vm+xqhRfCPJCvfzXtRAxDi6bz3OiSWNRIM5K+d+3qQdk8v8+0LxaNNixgGUx0SOwAVE99eGHIxVZz7F7+Un51xhU2Df7ajaaEKmWzRLfrxzrT9VIHiaYbEhp0BJmJ34PKtEuD6ABGDwMWBb7+9Ol6SVnby0LPHnPz5zy4P5HXo8Fun22QdEtvjeoinRMQzQ1kSmPM3GCjd+fTcNAAc2BMHsl/+9usZAKVnqX5w7ICLUMrOgLVhea5NALGWoXTcIgBI/fSveyxMX706AwAt3WmhDNopkOBN9LvnYmLEjHm/jR92Q6/IECsu4gbOGC1JDQ3mCTDNYt4SwU8YTb1777mKred+8BygM9MZYYRajr1xwHm6whOrQoI1V+J0m/GIuLoBlQ9TVuDGmokA2vQgoFZlH4YtZa0eBi24bYnMN9/MMoThT01GTYBJAM6ewzeHpkX6QCvApZzrsux+9ceHmxgST9ElHvIxMz/Eq+f/rJqNh3rDxZfyXddXGzw21NiVG0WAVW5ilgkaEGDR1rc/zTreHobSpAGOHXnr9Q7Lf7pCmKtaCRKr+tysmCFqNCM0v25SgABw8NZEC761OSFiBoGEEBCCanI8aJGRIKGnb9waLQNcmhie9GxwYDtCXXvb75UYHsDs5hR2nT5qYtMM6Va2Eqzn9u5qd6u8Uqns65pJ/NwlBFWtA4QgIlaepzY3ASeEYZpGrRHGhfepIby75+/ktDRITd7tn+WqVaN4V3dc+JN3C9Ioj47p5LGTLcrTT1kUUyy7+5XSepnFWmLyfbdUKntK17Brl4MdiAASAoAuZbNFDTARbcoCMyCkYUix/C9fnUABmQuf38rDsA3KXL804EIQA0SwW7vTljdw7grQf37IOvXywYikHZEJZQZBE9OqJldr5bFRAyLAvNTDwCKvA9orMVuCQEu/81BmYqNpCJ68enWapWUA3vDN/r2Bz0Fg ""}, {"y": 2005, "n": "59", "t": "Integration", "q": "What is an anti-derivative of f(x) = 2/(4x² + 4x + 1)?", "o": ["−1/(2x + 1)", "−2/(2x + 1)", "−2/(4x² + 4x + 1)", "ln(4x² + 4x + 1)"], "a": 0, "s": "f = 2(2x + 1)<sup>−2</sup>. ∫ = 2·(2x+1)<sup>−1</sup>/(2·(−1)) = −1/(2x + 1) + C.", "img": ""}, {"y": 2005, "n": "60", "t": "Integration", "q": "∫ (1 + x)·3^x dx is equal to:", "o": ["(1 + x)3^x − 3^x + C", "(1 + x)3^x + (ln 3)·3^x + C", "(1 + x)3^x·log₃e − (log₃e)²·3^x + C", "(1 + x)3^x·log₃e − 3x·ln 3 + C"], "a": 2, "s": "By parts with u = 1 + x, dv = 3<sup>x</sup>dx: (1 + x)3<sup>x</sup>/ln 3 − ∫3<sup>x</sup>/ln 3 dx = (1 + x)3<sup>x</sup>/ln 3 − 3<sup>x</sup>/(ln 3)² + C. Differentiating confirms it.", "img": ""}, {"y": 2005, "n": "61", "t": "Integration", "q": "Which one of the following is equal to ∫ ln(x·eˣ)/x dx ?", "o": ["ln|x| + ½eˣ + C", "½(ln x)² + x + C", "ln|x| + e^(2x) + C", "−1/x² + (ln x)² + x + C"], "a": 1, "s": "ln(x·e<sup>x</sup>) = ln x + x. So the integrand is (ln x)/x + 1. ∫ = ½(ln x)² + x + C.", "img": ""}, {"y": 2005, "n": "62", "t": "Integration", "q": "∫ 1/(x² + x) dx is equal to:", "o": ["ln|x² + x| + C", "2 ln|x + 1| + ln|x| + C", "ln|x| − ln|x + 1| + C", "ln|x| + ln|x + 1| + C"], "a": 2, "s": "Partial fractions: 1/(x(x+1)) = 1/x − 1/(x+1). So ∫ = ln|x| − ln|x + 1| + C.", "img": ""}, {"y": 2005, "n": "63", "t": "Integration", "q": "The value of ∫₀^{π/2} 2x cos x dx is equal to:", "o": ["π − 2", "π/2 + 1", "π + 2", "π/2 − 1"], "a": 0, "s": "Integration by parts with u = 2x, dv = cos x dx: 2x sin x + 2 cos x from 0 to π/2 = (π + 0) − (0 + 2) = π − 2.", "img": ""}, {"y": 2005, "n": "64", "t": "Applications of integrals", "q": "What is the area of the region between the graphs of y = x² and y = −x + 2 for 0 ≤ x ≤ 2?", "o": ["3", "2", "3/2", "2/3"], "a": 0, "s": "The curves meet at x = 1. On [0, 1] the line is above: ∫(2 − x − x²) dx = 7/6. On [1, 2] the parabola is above: ∫(x² + x − 2) dx = 11/6. Total = 3.", "img": ""}, {"y": 2006, "n": "38", "t": "Sequences", "q": "The sequence {(n − 1)(2n + 1)/(1 − n²)}, n ≥ 1, converges to:", "o": ["−∞", "−2", "0", "1"], "a": 1, "s": "Expand the numerator: (2n² − n − 1)/(1 − n²). Divide by n²: (2 − 1/n − 1/n²)/(1/n² − 1) → 2/(−1) = −2.", "img": ""}, {"y": 2006, "n": "39", "t": "Sequences", "q": "Which one of the following represents a geometric sequence?", "o": ["3, 1, 1/3, 1/9, 1/27, …", "1/2, −1/3, 1/4, −1/5, 1/6, …", "1, 3, 6, 10, 15, …", "−3, 6, −9, 12, −15, …"], "a": 0, "s": "A geometric sequence has a constant ratio. For option A, 1/3, (1/3)/1 = 1/3, (1/9)/(1/3) = 1/3, and so on, so r = 1/3. The others have no constant ratio.", "img": ""}, {"y": 2006, "n": "40", "t": "Series", "q": "What is the value of the sum Σ_{n=1}^{∞} (2ⁿ + 5ⁿ)/10ⁿ ?", "o": ["0.325", "1", "5/4", "37/9"], "a": 2, "s": "Split into two geometric series. Σ(2/10)<sup>n</sup> = (1/5)/(1 − 1/5) = 1/4. Σ(5/10)<sup>n</sup> = (1/2)/(1 − 1/2) = 1. Sum = 1/4 + 1 = 5/4.", "img": ""}, {"y": 2006, "n": "41", "t": "Series", "q": "The sum of the series Σ_{n=1}^{∞} (−1)ⁿ·3^(−2n) is equal to:", "o": ["−1/8", "−0.13", "−0.1", "1/8"], "a": 2, "s": "Terms: −1/9 + 1/81 − …, a = −1/9, r = −1/9. S = (−1/9)/(1 + 1/9) = −1/10 = −0.1.", "img": ""}, {"y": 2006, "n": "42", "t": "Sequences", "q": "Let a_n = ((n + 3)/(n + 1))ⁿ. Then lim_{n→∞} a_n is equal to:", "o": ["1", "e/2", "e²", "∞"], "a": 2, "s": "a<sub>n</sub> = (1 + 3/n)<sup>n</sup>/(1 + 1/n)<sup>n</sup> → e³/e = e².", "img": ""}, {"y": 2006, "n": "43", "t": "Limits", "q": "Given lim<sub>x→3</sub> f(x) = 5 and lim<sub>x→3</sub> g(x) = 11, what is lim<sub>x→3</sub> (f − g)(g − 2f)/(g − f)²?", "o": ["−11/16", "−1/6", "0", "does not exist"], "a": 1, "s": "(f − g)/(g − f) = −1, so the expression is −(g − 2f)/(g − f). Substitute the limits: −(11 − 10)/(11 − 5) = −1/6.", "img": ""}, {"y": 2006, "n": "44", "t": "Limits", "q": "lim_{x→∞} (x/(x + 2))^(−3x) is equal to:", "o": ["e⁶", "e⁻³", "e^(−3/2)", "e⁻⁶"], "a": 0, "s": "(x/(x + 2))<sup>−3x</sup> = [(1 + 2/x)<sup>x</sup>]<sup>3</sup> → (e²)³ = e⁶.", "img": ""}, {"y": 2006, "n": "45", "t": "Derivatives", "q": "If f(x) = x²√(2x + 12), what is the slope of the tangent line to the graph of f at x = 2?", "o": ["−4", "2", "18", "17"], "a": 3, "s": "f′(x) = 2x√(2x + 12) + x²/√(2x + 12). At x = 2: 4(4) + 4/4 = 16 + 1 = 17.", "img": ""}, {"y": 2006, "n": "46", "t": "Derivatives", "q": "Suppose g(2) = 1, g′(2) = 10 and f(x) = x²/(1 + x·g(x)). Then the value of f′(2) is equal to:", "o": ["−8", "−8/9", "4/3", "8/9"], "a": 0, "s": "Quotient rule: f′ = [2x(1 + xg) − x²(g + xg′)]/(1 + xg)². At x = 2: 1 + 2g(2) = 3, so f′(2) = [4(3) − 4(1 + 20)]/9 = (12 − 84)/9 = −8.", "img": ""}, {"y": 2006, "n": "47", "t": "Continuity", "q": "Let f(x) = a·sin x/(x − |x|) if x &lt; 0, and f(x) = e^(−x) + cos x if x ≥ 0. If f is continuous at x = 0, what is the value of a?", "o": ["4", "2", "1/2", "−4"], "a": 0, "s": "f(0) = e<sup>0</sup> + cos 0 = 2. For x < 0, x − |x| = 2x, so the left limit is a sin x/(2x) → a/2. Setting a/2 = 2 gives a = 4.", "img": ""}, {"y": 2006, "n": "48", "t": "Derivatives", "q": "The derivative of f(x) = (1 + sin x)/cos x is:", "o": ["sec x + tan x", "(1 + sin x)/cos²x", "1/(1 + tan x)", "cos x/sin²x"], "a": 1, "s": "f′ = [cos x·cos x − (1 + sin x)(−sin x)]/cos²x = (cos²x + sin x + sin²x)/cos²x = (1 + sin x)/cos²x.", "img": ""}, {"y": 2006, "n": "49", "t": "Derivatives", "q": "If F(x) = f(2x + 2)·g(1 − x²), with f(2) = −3, f′(2) = 4, g(1) = −5 and g′(1) = 1, then what is the value of F′(0)?", "o": ["−40", "−20", "0", "19"], "a": 0, "s": "F′(x) = 2f′(2x+2)g(1 − x²) + f(2x+2)g′(1 − x²)(−2x). At x = 0: 2(4)(−5) + 0 = −40.", "img": ""}, {"y": 2006, "n": "50", "t": "Derivatives", "q": "If f(x) = e^(2x)·sin x, then f″(x) is:", "o": ["3e^(2x) sin x − 4e^(2x) cos x", "4e^(2x) sin x + 2e^(2x) cos x", "e^(2x)(3 sin x + 4 cos x)", "e^(2x)(4 sin x − cos x)"], "a": 2, "s": "f′ = e<sup>2x</sup>(2 sin x + cos x). f″ = 2e<sup>2x</sup>(2 sin x + cos x) + e<sup>2x</sup>(2 cos x − sin x) = e<sup>2x</sup>(3 sin x + 4 cos x).", "img": ""}, {"y": 2006, "n": "51", "t": "Derivatives", "q": "Let y = sin(3x²). Then d²y/dx² is equal to:", "o": ["−6 sin(3x²)", "cos(6x) − 6 sin(3x)²", "6 cos(3x²) − 36x² sin(3x²)", "x² cos(3x²) + 6 sin(3x²)"], "a": 2, "s": "y′ = 6x cos(3x²). y″ = 6 cos(3x²) + 6x·(−sin(3x²))(6x) = 6 cos(3x²) − 36x² sin(3x²).", "img": ""}, {"y": 2006, "n": "52", "t": "Applications of derivatives", "q": "Which one of the following is the set of all critical numbers of f(x) = (1/3)x³ − |4x − 1| ?", "o": ["{1/4, 2}", "{−2, 1/4, 2}", "{−2, 2}", "{1/4}"], "a": 0, "s": "For x > 1/4, f′ = x² − 4 = 0 gives x = 2. For x < 1/4, f′ = x² + 4 is never 0. At x = 1/4 the derivative does not exist, so it is also critical. Critical numbers: {1/4, 2}.", "img": ""}, {"y": 2006, "n": "53", "t": "Applications of derivatives", "q": "The total cost (in Birr) of producing x iron sheets per day is C(x) = 1,000 + 100x − 0.5x², 0 ≤ x ≤ 100. What is the marginal cost (rate of change of cost) at a production level of 80 iron sheets?", "o": ["8.5", "20", "1800", "5800"], "a": 1, "s": "Marginal cost = C′(x) = 100 − x. At x = 80, C′(80) = 20.", "img": ""}, {"y": 2006, "n": "54", "t": "Optimization", "q": "If a box with a square base and open top is made from 1200 cm² of material, what is the largest volume of the box in cm³?", "o": ["4000", "8000", "15000", "3000"], "a": 0, "s": "x² + 4xh = 1200, so h = (1200 − x²)/(4x). V = x²h = 300x − x³/4. V′ = 300 − 3x²/4 = 0 gives x = 20, h = 800/80 = 10. V = 400(10) = 4000 cm³.", "img": ""}, {"y": 2006, "n": "55", "t": "Related rates", "q": "A water tank is a circular cylinder with base radius 2 m and height 3 m. If the tank is empty and water is pumped into it at a rate of 2 m³/min, how long does it take for the tank to be full?", "o": ["1.5 min", "(3/2)π min", "6π min", "12 min"], "a": 2, "s": "Volume = πr²h = π(4)(3) = 12π m³. Time = 12π/2 = 6π min.", "img": ""}, {"y": 2006, "n": "56", "t": "Optimization", "q": "Equal squares are cut from each of the four corners of a square cardboard whose sides are 72 cm long. The flaps are then folded up to form a box without a top. How long should each side of the cut-off squares be to maximize the volume of the box?", "o": ["6 cm", "12 cm", "15 cm", "24 cm"], "a": 1, "s": "V = x(72 − 2x)². V′ = (72 − 2x)(72 − 6x) = 0 gives x = 12 (x = 36 gives zero volume). V″ = 24x − 576 is negative at x = 12, so it is a maximum.", "img": ""}, {"y": 2006, "n": "57", "t": "Integration", "q": "If F(x) is an anti-derivative of f(x) = 1 − 2/x² and F(1) = 0, then F(2) is equal to:", "o": ["0", "1/2", "−1/2", "3"], "a": 0, "s": "F(x) = x + 2/x + C. F(1) = 3 + C = 0 gives C = −3. F(2) = 2 + 1 − 3 = 0.", "img": ""}, {"y": 2006, "n": "58", "t": "Integration", "q": "∫ [x + ln(x + 1)]/(x + 1)² dx is equal to:", "o": ["ln(x + 1) + x/(x + 1) + C", "(x + 1)² + 1/(x + 1) + C", "(x + 1)² − 1/(x + 1) + C", "x ln(x + 1)/(x + 1) + C"], "a": 3, "s": "Differentiate option D with the quotient rule: [(ln(x+1) + x/(x+1))(x+1) − x ln(x+1)]/(x+1)² = [x + ln(x+1)]/(x+1)². So D is the antiderivative. (It can also be found by substitution u = x + 1 and integration by parts.)", "img": ""}, {"y": 2006, "n": "59", "t": "Integration", "q": "∫₀^{π/2} (x − sin x)/sec x dx is equal to:", "o": ["(π − 3)/2", "(π − 1)/2", "(3 − π)/2", "(π + 3)/2"], "a": 0, "s": "The integrand is x cos x − sin x cos x. By parts, ∫<sub>0</sub><sup>π/2</sup> x cos x dx = [x sin x + cos x] = π/2 − 1. And ∫<sub>0</sub><sup>π/2</sup> sin x cos x dx = 1/2. Difference = π/2 − 1 − 1/2 = (π − 3)/2.", "img": ""}, {"y": 2006, "n": "60", "t": "Integration", "q": "What is the derivative of f(x) = ∫₀^{x² + π} dt/(sin t + 1) ?", "o": ["cos x/(sin(x² + π) + 1)", "2x/(sin(x² + π) + 1)", "2x cos x/(sin(x² + π) + 1)", "∫₀^{2x} dt/(sin t + 1)"], "a": 1, "s": "Fundamental Theorem with the chain rule: f′(x) = [1/(sin(x² + π) + 1)]·(2x).", "img": ""}, {"y": 2006, "n": "61", "t": "Applications of integrals", "q": "What is the area of the region between the graphs of y = −x² + 2 and y = |x| where −1 ≤ x ≤ 2?", "o": ["11/6", "25/6", "7/3", "11/3"], "a": 1, "s": "The curves meet at x = −1 and x = 1. On [−1, 1] the parabola is on top: ∫(2 − x² − |x|) dx = 7/3. On [1, 2] the line is on top: ∫(x + x² − 2) dx = 11/6. Total = 7/3 + 11/6 = 25/6.", "img": ""}, {"y": 2006, "n": "62", "t": "Applications of integrals", "q": "What is the area of the region between the graph of f(x) = −x² + 4x − 3 and the x-axis from x = 0 to x = 3?", "o": ["−2/3", "2/3", "4/3", "8/3"], "a": 3, "s": "f = −(x − 1)(x − 3) is negative on [0, 1] and positive on [1, 3]. |∫<sub>0</sub><sup>1</sup> f| = 4/3 and ∫<sub>1</sub><sup>3</sup> f = 4/3. Area = 4/3 + 4/3 = 8/3.", "img": ""}, {"y": 2007, "n": "3", "t": "Sequences", "q": "A certain meeting hall has 20 rows of seats. There are 20 seats in the first row, 22 seats in the second row, 24 seats in the third row, and so on. How many seats are there in the last (20th) row of the hall?", "o": ["46", "58", "760", "5240"], "a": 1, "s": "Arithmetic sequence with a<sub>1</sub> = 20, d = 2. a<sub>20</sub> = 20 + 19(2) = 58.", "img": ""}, {"y": 2007, "n": "5", "t": "Applications of integrals", "q": "What is the area of the region between the graph of y = sin x and the x-axis where 0 ≤ x ≤ 2π?", "o": ["4", "4π", "2", "2π"], "a": 0, "s": "sin x ≥ 0 on [0, π] and ≤ 0 on [π, 2π]. A = ∫<sub>0</sub><sup>π</sup> sin x dx + ∫<sub>π</sub><sup>2π</sup> (−sin x) dx = 2 + 2 = 4.", "img": ""}, {"y": 2007, "n": "7", "t": "Derivatives", "q": "If f(x) = ln√(x² + 1), which of the following is equal to f′(x)?", "o": ["x/√(x² + 1)", "x/(x² + 1)", "2x/√(x² + 1)", "2x/(x² + 1)"], "a": 1, "s": "f = ½ ln(x² + 1), so f′ = ½· 2x/(x² + 1) = x/(x² + 1).", "img": ""}, {"y": 2007, "n": "10", "t": "Optimization", "q": "An object is moving along the parabola y = √(2x) in the xy-plane. At what point on its path does the object become closest to the point (2, 0)?", "o": ["(3, √6)", "(1, 1)", "(1, √2)", "(2, 2)"], "a": 2, "s": "d² = (x − 2)² + 2x = x² − 2x + 4. Its derivative 2x − 2 = 0 gives x = 1, a minimum. Then y = √2, so the point is (1, √2).", "img": ""}, {"y": 2007, "n": "12", "t": "Limits", "q": "Which one of the following is equal to lim_{x→9} (x − 9)/(3 − √x) ?", "o": ["6", "−3", "−6", "∞"], "a": 2, "s": "x − 9 = (√x − 3)(√x + 3) = −(3 − √x)(√x + 3). The limit is −(√x + 3) → −6.", "img": ""}, {"y": 2007, "n": "13", "t": "Related rates", "q": "The ozone level (in ppb) on a sunny day in a metropolitan area is given by p(t) = 80 + 12t − t², where t is time in hours and t = 0 corresponds to 9 A.M. What is the rate of increase of the ozone level after 3 hours (i.e. at 12 noon)?", "o": ["6 ppb", "12 ppb", "107 ppb", "113 ppb"], "a": 0, "s": "p′(t) = 12 − 2t. At t = 3: 12 − 6 = 6 ppb per hour.", "img": ""}, {"y": 2007, "n": "15", "t": "Continuity", "q": "Let f(x) = a·sin 2x/x if x &lt; 0, and f(x) = e^(2x) − 2 if x ≥ 0. If f is continuous at x = 0, then what is the value of a?", "o": ["1/2", "2", "−1/2", "−2"], "a": 2, "s": "f(0) = e<sup>0</sup> − 2 = −1. Left limit: a sin 2x/x → 2a. So 2a = −1 and a = −1/2.", "img": ""}, {"y": 2007, "n": "16", "t": "Sequences", "q": "Which one of the following is an arithmetic sequence?", "o": ["3, 5, 7, 9, 11, …", "3, 6, 12, 24, 48, …", "−3, 6, −9, 12, −15, …", "1, 3, 6, 10, 15, 21, …"], "a": 0, "s": "An arithmetic sequence has a constant difference. Option A has d = 2. B has a constant ratio instead, and C and D have no constant difference.", "img": ""}, {"y": 2007, "n": "17", "t": "Integration", "q": "If f(x) = 2x(x² + 1)⁴, then which one of the following is an anti-derivative of f(x)?", "o": ["(2x/5)(x² + 1)⁵ + c", "(2/5)(x² + 1)⁵ + c", "(x/5)(x² + 1)⁵ + 1", "(1/5)(x² + 1)⁵ − 1"], "a": 3, "s": "Let u = x² + 1, du = 2x dx. ∫u⁴ du = u⁵/5 + c = (x² + 1)⁵/5 + c. Option D is of this form (with constant −1).", "img": ""}, {"y": 2007, "n": "18", "t": "Sequences", "q": "Which one of the following sequences is a convergent sequence?", "o": ["1, 1/2, 1, 1/3, 1, 1/4, …", "{(−1)ⁿ}", "{10¹⁰⁹ − n/100}", "{sin(1/n)}"], "a": 3, "s": "sin(1/n) → sin 0 = 0, so it converges. A keeps returning to 1, B oscillates between −1 and 1, and C decreases without bound.", "img": ""}, {"y": 2007, "n": "19", "t": "Applications of derivatives", "q": "What is the absolute maximum value of f(x) = 2x² − x⁴ − 4 on [0, 2]?", "o": ["−3", "3", "−4", "12"], "a": 0, "s": "f′ = 4x − 4x³ = 4x(1 − x²) = 0 gives x = 0, 1 in [0, 2]. f(0) = −4, f(1) = −3, f(2) = −12. The absolute maximum is −3.", "img": ""}, {"y": 2007, "n": "23", "t": "Series", "q": "What is the sum of all multiples of 3 between 20 and 200?", "o": ["7,227", "6,570", "6,150", "5,166"], "a": 1, "s": "The multiples are 21, 24, …, 198 (d = 3). 198 = 21 + (n − 1)(3) gives n = 60. S = (60/2)(21 + 198) = 30(219) = 6,570.", "img": ""}, {"y": 2007, "n": "26", "t": "Derivatives", "q": "If f(2) = −3, f′(2) = 4, g(1) = −5, g′(1) = 1 and F(x) = f(2x + 2)·g(1 − x²), then what is the value of F′(0)?", "o": ["19", "0", "−20", "−40"], "a": 3, "s": "F′(x) = 2f′(2x+2)g(1 − x²) + f(2x+2)g′(1 − x²)(−2x). At x = 0: 2(4)(−5) + 0 = −40.", "img": ""}, {"y": 2007, "n": "27", "t": "Related rates", "q": "A ladder 6 m long rests against a vertical wall. If the bottom of the ladder slides away from the wall at a rate of 1/2 m/sec, how fast is the angle between the top of the ladder and the wall changing when the angle is π/4 rad?", "o": ["√2/12 rad/sec", "√2/2 rad/sec", "√2/6 rad/sec", "√2/3 rad/sec"], "a": 0, "s": "sin θ = x/6. Differentiate: cos θ·dθ/dt = (1/6)dx/dt = 1/12. At θ = π/4, cos θ = 1/√2, so dθ/dt = √2/12 rad/s.", "img": ""}, {"y": 2007, "n": "28", "t": "Limits", "q": "The value(s) of x where the graph of y = (x² − 1)/x³ crosses its horizontal asymptote is (are):", "o": ["x = −2", "x = −1 and x = 1", "x = 1", "x = −√2 and x = 1 + √2"], "a": 1, "s": "As x → ±∞, y → 0, so the horizontal asymptote is y = 0. Setting (x² − 1)/x³ = 0 gives x = ±1.", "img": ""}, {"y": 2007, "n": "31", "t": "Series", "q": "A ball is thrown vertically from the ground up to a height of 16 m. Each time it drops h meters, it rebounds 0.80h m. Noting that the ball travels every height of h twice. What is the total vertical distance travelled by the ball before it comes to rest?", "o": ["40 m", "80 m", "160 m", "320 m"], "a": 2, "s": "The upward distances form a geometric series 16 + 12.8 + 10.24 + … = 16/(1 − 0.8) = 80. The downward distances are the same, so the total is 2(80) = 160 m.", "img": ""}, {"y": 2007, "n": "33", "t": "Integration", "q": "The derivative of the function F(x) = ∫_{−x}^{x} 1/(1 + t) dt is:", "o": ["2/(1 − x²)", "ln|1 + x|", "1/(1 + x)", "ln|(1 + x)/(1 − x)|"], "a": 0, "s": "Fundamental Theorem with chain rule: F′(x) = 1/(1 + x)·(1) − 1/(1 − x)·(−1) = 1/(1 + x) + 1/(1 − x) = 2/(1 − x²).", "img": ""}, {"y": 2007, "n": "35", "t": "Applications of derivatives", "q": "Which one of the following is necessarily true?", "o": ["If f′(x) = 0 for all x in an interval I, then f(x) = 0 for all x in I.", "If f(x) = x² sin x + 5, then there is c ∈ (0, π) such that f′(c) = 0.", "If f(x) = eˣ + x² is increasing on (−∞, ∞).", "If f′(c) = 0, then f attains its maximum or minimum value at x = c."], "a": 1, "s": "f(0) = 5 and f(π) = 5, so by Rolle’s theorem there is c in (0, π) with f′(c) = 0. The others fail: a constant need not be 0; f′ = e<sup>x</sup> + 2x is negative at x = −1; and f′(c) = 0 does not guarantee an extremum (e.g. x³ at 0).", "img": ""}, {"y": 2007, "n": "37", "t": "Integration", "q": "Which one of the following is equal to ∫ (ln x + x²eˣ)/x dx ?", "o": ["½ ln²x + eˣ(x² − 1) + c", "½ ln²x + eˣ(x − 1) + c", "(1/x²) ln x + eˣ(x − 1) + c", "(−1/x²) ln x + eˣ(x² − 1) + c"], "a": 1, "s": "Split into ∫(ln x)/x dx + ∫ x e<sup>x</sup> dx. The first is ½(ln x)². For the second, by parts: x e<sup>x</sup> − e<sup>x</sup> = e<sup>x</sup>(x − 1). Total: ½ ln²x + e<sup>x</sup>(x − 1) + c.", "img": ""}, {"y": 2007, "n": "38", "t": "Derivatives", "q": "For what values of a and b is the function f(x) = 1 − 3x² (for x ≤ 1), f(x) = ax + b (for x &gt; 1) differentiable at x = 1?", "o": ["a = 6, b = 0", "a = −3, b = 1", "a = 0, b = −2", "a = −6, b = 4"], "a": 3, "s": "Match the derivatives: f′(x) = −6x for x < 1, so a = −6. Match the values: a + b = 1 − 3 = −2, so b = −2 + 6 = 4.", "img": ""}, {"y": 2007, "n": "40", "t": "Integration", "q": "If f and g are continuous on ℝ and a, b ∈ ℝ, which one of the following is necessarily true?", "o": ["If ∫ₐᵇ f(x)dx = ∫ₐᵇ g(x)dx, then f(x) = g(x) for all x ∈ [a, b].", "If f′(x) = g′(x) for all x ∈ [a, b], then ∫ₐᵇ f(x)dx = ∫ₐᵇ g(x)dx.", "If f(x) ≥ 3 for all x ∈ [−2, 2], then ∫_{−2}^{2} f(x)dx ≥ 12.", "∫ₐᵇ f(x)dx = ∫ᵇₐ f(x)dx."], "a": 2, "s": "Equal integrals do not force equal functions (A false). f′ = g′ only gives f = g + constant (B false). Swapping limits changes the sign (D false). For C, ∫ f ≥ 3·(2 − (−2)) = 12.", "img": ""}, {"y": 2007, "n": "41", "t": "Limits", "q": "The graph of a function has exactly one vertical asymptote at x = −2, a horizontal asymptote y = 1, and a hole (removable discontinuity) at x = 2, and it crosses the x-axis at x = −3. Which of the following functions could it be?", "o": ["(x + 3)/(x + 2)", "(x² − 2x)/(x² − 4)", "(−x² − x + 6)/(x² − 4)", "(x² + x − 6)/(x² − 4)"], "a": 3, "s": "(x² + x − 6)/(x² − 4) = (x + 3)(x − 2)/((x − 2)(x + 2)) = (x + 3)/(x + 2) with x ≠ 2. So the only vertical asymptote is x = −2, there is a hole at x = 2, the horizontal asymptote is y = 1 and the x-intercept is −3. A has no hole, B = x/(x + 2) crosses the x-axis at 0, and C has horizontal asymptote y = −1.", "img": ""}, {"y": 2007, "n": "45", "t": "Applications of integrals", "q": "A company manufactures x computer sets per month. The monthly marginal profit (in Birr) is P′(x) = 165 − 0.1x, for 0 ≤ x ≤ 400. The company is currently manufacturing 10 sets per month but plans to increase production. What is the total change in the monthly profit if monthly production is increased to 60 sets?", "o": ["Birr 500", "Birr 1,865", "Birr 8,075", "Birr 18,635"], "a": 2, "s": "Change = ∫<sub>10</sub><sup>60</sup> (165 − 0.1x) dx = [165x − 0.05x²] from 10 to 60 = (9900 − 180) − (1650 − 5) = 9720 − 1645 = 8075.", "img": ""}, {"y": 2007, "n": "46", "t": "Limits", "q": "Which one of the following is equal to lim_{x→∞} (3x/(3x + 2))^(−3x) ?", "o": ["e²", "e⁻³", "e⁻²", "e³"], "a": 0, "s": "(3x/(3x + 2))<sup>−3x</sup> = (1 + 2/(3x))<sup>3x</sup> → e².", "img": ""}, {"y": 2007, "n": "47", "t": "Optimization", "q": "The total cost (in birr) of producing x radio sets per day is ¼x² + 35x + 25, and the price per set at which they may be sold is given by 50 − ½x. What should the daily output be to obtain a maximum total profit?", "o": ["50 sets per day", "23 sets per day", "10 sets per day", "7 sets per day"], "a": 2, "s": "Profit P = x(50 − x/2) − (x²/4 + 35x + 25) = 15x − (3/4)x² − 25. P′ = 15 − (3/2)x = 0 gives x = 10. P″ &lt; 0, so it is a maximum.", "img": ""}, {"y": 2008, "n": "11", "t": "Sequences", "q": "If {A_n} is an arithmetic sequence such that its 1st term A₁ = −5 and its 5th term A₅ = 15, then its 11th term A₁₁ is equal to:", "o": ["40", "50", "45", "55"], "a": 2, "s": "d = (15 − (−5))/(5 − 1) = 5. A<sub>11</sub> = −5 + 10(5) = 45.", "img": ""}, {"y": 2008, "n": "12", "t": "Series", "q": "What is the sum of all multiples of 4 that are between 30 and 301?", "o": ["12,882", "11,288", "6,288", "6,882"], "a": 1, "s": "The multiples are 32, 36, …, 300 (d = 4). 300 = 32 + (n − 1)(4) gives n = 68. S = (68/2)(32 + 300) = 34(332) = 11,288.", "img": ""}, {"y": 2008, "n": "13", "t": "Limits", "q": "The left-hand limit lim_{x→0⁻} (x·eˣ − |x|)/x is:", "o": ["0", "2", "1", "Does not exist"], "a": 1, "s": "For x &lt; 0, |x| = −x, so the expression is e<sup>x</sup> + 1 → 2.", "img": ""}, {"y": 2008, "n": "14", "t": "Limits", "q": "Which one of the following is equal to lim_{x→0} (2x + tan x)/(x sec x) ?", "o": ["2", "0", "1", "3"], "a": 3, "s": "Divide by x: (2 + tan x/x)/sec x → (2 + 1)/1 = 3.", "img": ""}, {"y": 2008, "n": "21", "t": "Optimization", "q": "A closed cylindrical can is to be made to hold 1000 cm³ of oil. What are the dimensions (radius r and height h) that will minimize the total surface area of the can?", "o": ["r = ∛(50/π), h = 2∛(50/π)", "r = ∛500/π, h = 2·∛500/π", "r = √(50/π), h = 2√(50/π)", "r = ∛(500/π), h = 2∛(500/π)"], "a": 3, "s": "h = 1000/(πr²). A = 2πr² + 2000/r. A′ = 4πr − 2000/r² = 0 gives r³ = 500/π, so r = ∛(500/π) and h = 2r.", "img": ""}, {"y": 2008, "n": "21b", "t": "Optimization", "q": "The volume of a closed cylindrical tin can is 16π cubic inches. If a minimum amount of tin is to be used to construct the can, what must be the height of the can in inches?", "o": ["2∛2", "2∛4", "4", "8"], "a": 2, "s": "h = 16/r². A = 2πr² + 32π/r. A′ = 4πr − 32π/r² = 0 gives r³ = 8, r = 2. Then h = 16/4 = 4 inches.", "img": ""}, {"y": 2008, "n": "22", "t": "Integration", "q": "If f(x) = 3x²√(x³ − 1), then which of the following is an anti-derivative of f(x)?", "o": ["(3x²/2)(x³ − 1)^(3/2) + c", "(2/3)(x³ − 1)^(3/2) + c", "(3/2)(x³ − 1)^(1/2) + c", "(3/2)(x³ − 1)^(2/3) + c"], "a": 1, "s": "Let u = x³ − 1, so du = 3x²dx. Then ∫√u du = (2/3)u<sup>3/2</sup> + c = (2/3)(x³ − 1)<sup>3/2</sup> + c.", "img": ""}, {"y": 2008, "n": "23", "t": "Integration", "q": "Which of the following is equal to ∫ [(ln x)² + x² cos x]/x dx ?", "o": ["(1/x²)ln x + x sin x − cos x + c", "(1/3)(ln x)³ + x sin x − cos x + c", "(1/3)(ln x)³ + x sin x + cos x + c", "(1/x²)ln x + x sin x + cos x + c"], "a": 2, "s": "Split: ∫(ln x)²/x dx = (ln x)³/3 (let u = ln x). ∫ x cos x dx = x sin x + cos x by parts. Total: (1/3)(ln x)³ + x sin x + cos x + c.", "img": ""}, {"y": 2008, "n": "24", "t": "Applications of integrals", "q": "The value of the solid generated when the region bounded between the graph of y = x² (0 ≤ x ≤ 2), y = 4 (2 ≤ x ≤ 3) and the x-axis is rotated about the x-axis is:", "o": ["32π/5", "112π/5", "112π/3", "64π/5"], "a": 1, "s": "V<sub>1</sub> = π∫<sub>0</sub><sup>2</sup> x⁴ dx = 32π/5. V<sub>2</sub> = π∫<sub>2</sub><sup>3</sup> 16 dx = 16π. Total = 32π/5 + 16π = 112π/5.", "img": ""}, {"y": 2008, "n": "24b", "t": "Applications of integrals", "q": "The region enclosed by the graph of y = x², the line x = 2 and the x-axis is revolved about the y-axis. The volume of the solid generated is:", "o": ["8π", "32π/5", "16π/3", "4π"], "a": 0, "s": "Shell method: V = 2π∫<sub>0</sub><sup>2</sup> x·x² dx = 2π[x⁴/4]<sub>0</sub><sup>2</sup> = 2π(4) = 8π.", "img": ""}, {"y": 2008, "n": "25", "t": "Limits", "q": "Which one of the following is true about the horizontal asymptote(s) of the graph of y = (|x| + 2)/x?", "o": ["y = 2 is the only horizontal asymptote", "y = 1 and y = −1 are horizontal asymptotes", "y = 2 and y = −2 are horizontal asymptotes", "y = 1 is the only horizontal asymptote"], "a": 1, "s": "For x &gt; 0, y = 1 + 2/x → 1 as x → ∞. For x &lt; 0, y = −1 + 2/x → −1 as x → −∞. So y = 1 and y = −1 are both horizontal asymptotes.", "img": ""}, {"y": 2008, "n": "26", "t": "Derivatives", "q": "If f(x) = 2x⁵ − 3x, then lim_{x→1} [f(x) − f(1)]/(x − 1) is equal to:", "o": ["1", "−1", "7", "∞"], "a": 2, "s": "The limit is the definition of f′(1). f′(x) = 10x⁴ − 3, so f′(1) = 7.", "img": ""}, {"y": 2008, "n": "27", "t": "Derivatives", "q": "If f(x) = e^(3x)·cos x − (x + π)/(x² + 2), then f′(0) is equal to:", "o": ["3 − π/2", "3/2", "7/4", "5/2"], "a": 3, "s": "f′ = 3e<sup>3x</sup> cos x − e<sup>3x</sup> sin x − [(x² + 2) − (x + π)(2x)]/(x² + 2)². At x = 0: 3 − 0 − 2/4 = 5/2.", "img": ""}, {"y": 2008, "n": "28", "t": "Derivatives", "q": "If f(x) = ln(√(x² − 5)), which one of the following is equal to f′(x)?", "o": ["x/(x² − 5)", "−x/√(x² − 5)", "2x/√(x² − 5)", "−x/(x² − 5)"], "a": 0, "s": "f = ½ ln(x² − 5), so f′ = ½· 2x/(x² − 5) = x/(x² − 5).", "img": ""}, {"y": 2008, "n": "29", "t": "Applications of derivatives", "q": "Let f be twice differentiable on ℝ. Which one of the following is necessarily true?", "o": ["If f′(c) = 0 at some c ∈ ℝ, then f has a relative extreme value at x = c.", "If f′(x) is increasing, then the graph of y = f(x) is concave upward.", "If f′(x) = 0 for all x ∈ ℝ, then f(x) = 0 for all x ∈ ℝ.", "If f(x) is increasing, then f″(x) ≥ 0 for all x ∈ ℝ."], "a": 1, "s": "If f′ is increasing, then f″ ≥ 0, which means f is concave upward. The others fail: f′(c) = 0 need not give an extremum, f′ = 0 only says f is constant, and an increasing f can still have f″ &lt; 0.", "img": ""}, {"y": 2008, "n": "30", "t": "Applications of derivatives", "q": "Suppose f(x) is differentiable on (−∞, ∞) and the graph of its derivative y = f′(x) is as shown in the figure. Which one of the following is true about f(x)?", "o": ["f(x) is increasing on (−∞, 0) ∪ (2, ∞).", "f(x) has a local extreme value at x = 2.", "f(x) has a local minimum value at x = −2.", "f(x) has a local maximum value at x = 0."], "a": 2, "s": "Sign of f′: − before −2 and + after, so f decreases then increases, giving a local minimum at x = −2. At x = 2 the sign does not change, so there is no extremum there.", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbgAAAC7CAAAAAAyQtR1AAABBmlDQ1BJQ0MgUHJvZmlsZQAAeJxjYGCSYAACFgMGhty8kqIgdyeFiMgoBQYkkJhcXMCAGzAyMHy7BiIZGC7r4lGHC3CmpBYnA+kPQFxSBLQcaGQKkC2SDmFXgNhJEHYPiF0UEuQMZC8AsjXSkdhJSOzykoISIPsESH1yQRGIfQfItsnNKU1GuJuBJzUvNBhIRwCxDEMxQxCDO4MTGX7ACxDhmb+IgcHiKwMD8wSEWNJMBobtrQwMErcQYipAP/C3MDBsO1+QWJQIFmIBYqa0NAaGT8sZGHgjGRiELzAwcEVj2oGICxx+VQD71Z0hHwjTGXIYUoEingx5DMkMekCWEYMBgyGDGQCSpUCz8yM2qAAAGJZJREFUeNrtXXlgVOW1/91lJrMkZLIvhiQQICCroLiAiAoqFgGXWFDbuqBWa30qtFr77LP1YX3VovW1VvHVuoBaqYIbKKCICImAIsgmIZCwhezLLJnl3u+8PyYJk2X2e2dIcn9/wMyde+dMvt93vu+c853vfBwh5qgukHjZsuReaIgcvDvmIusWeCgBza+s11o/GuL0jtgKZOC2JsKdjMp6rfWjIQ6mGEjxGY956w9n74f0d6pbEM43yA67R2OrC3GxAAdn5+ukKZ+n6mEGF9438DynsRVz4gADAKAFAJBqSoI+3N8pCLzGVqyJk4EWWzWw+qX2d+3/hAONuDgQJ+DAnTnzql0Lnj8JQADcCHvC4gWNLF+IsRHDuWzb7EedOZmdKhhb7Ekq0DQuEhT/0WhJWTP+abFDapgdhrrZpmGiefGj2lAZmfM2TNdctfK309HcLjU8uRQlcY2frmzRiItISovOeN25JYAFAODAoDCdgch+q5sABmAubmzU5riIkEFtxpt  … is:", "o": ["a_n = (−2)ⁿ", "a_n = (−1)ⁿ n²", "a_n = (−1)^(2n) n²", "a_n = (−1)^(n−1) n²"], "a": 3, "s": "The magnitudes are 1, 4, 9, 16 = n² and the signs alternate starting with +. So a<sub>n</sub> = (−1)<sup>n−1</sup> n².", "img": ""}, {"y": 2008, "n": "41", "t": "Applications of derivatives", "q": "Which one of the following is true about the function f defined by f(x) = x² + e^(2x)?", "o": ["f is decreasing for x ≥ 0", "f is increasing for x ≥ 0", "f has a relative minimum at x = 0", "f has a relative maximum at x = 0"], "a": 1, "s": "f′(x) = 2x + 2e<sup>2x</sup> &gt; 0 for all x ≥ 0, so f is increasing there. f′(0) = 2 ≠ 0, so there is no extremum at 0.", "img": ""}, {"y": 2008, "n": "42", "t": "Integration", "q": "The value of ∫₀¹ (x + 1)·e^(x² + 2x) dx is:", "o": ["e³/2", "(e⁴ − e)/2", "(e³ − 1)/2", "e³ − 1"], "a": 2, "s": "Let u = x² + 2x, so du = 2(x + 1)dx. Then ∫ = ½∫ e<sup>u</sup> du = ½e<sup>u</sup>. From x = 0 to 1 (u from 0 to 3): (e³ − 1)/2.", "img": ""}, {"y": 2008, "n": "43", "t": "Integration", "q": "∫₀³ (x + 1)^(1/2) dx = ?", "o": ["21/2", "14/3", "7", "16/3"], "a": 1, "s": "∫ = (2/3)(x + 1)<sup>3/2</sup> from 0 to 3 = (2/3)(8) − 2/3 = 16/3 − 2/3 = 14/3.", "img": ""}, {"y": 2008, "n": "44", "t": "Integration", "q": "Given f(x) = x + 1 for x &lt; 0 and f(x) = cos πx for x ≥ 0, then ∫_{−1}^{1} f(x) dx = ?", "o": ["1/2 + 1/π", "1/2 − 1/π", "1/2", "−1/2"], "a": 2, "s": "∫<sub>−1</sub><sup>0</sup> (x + 1) dx = [x²/2 + x] = 1/2. ∫<sub>0</sub><sup>1</sup> cos πx dx = [sin πx/π] = 0. Total = 1/2.", "img": ""}, {"y": 2008, "n": "45", "t": "Series", "q": "The sum of Σ_{n=0}^{∞} 5(2/3)ⁿ is:", "o": ["0", "15", "10/3", "5"], "a": 1, "s": "Geometric with first term 5 and r = 2/3 (|r| &lt; 1). S = 5/(1 − 2/3) = 15.", "img": ""}, {"y": 2008, "n": "46", "t": "Sequences", "q": "In which interval is the sequence {(−1)ⁿ/(3n)}, n ≥ 1, bounded?", "o": ["[−1/9, 1/12]", "[−1/3, 1/6]", "[−1/6, 1/3]", "[−1/12, 1/9]"], "a": 1, "s": "Terms: −1/3, 1/6, −1/9, 1/12, …. The smallest term is −1/3 (n = 1) and the largest is 1/6 (n = 2), so −1/3 ≤ a<sub>n</sub> ≤ 1/6.", "img": ""}, {"y": 2008, "n": "48", "t": "Limits", "q": "lim_{x→∞} x·sin(1/x) is equal to:", "o": ["0", "1", "∞", "−1"], "a": 1, "s": "Let u = 1/x → 0. The limit becomes lim sin u/u = 1.", "img": ""}, {"y": 2008, "n": "49", "t": "Derivatives", "q": "d/dx (ln e^(2x)) is equal to:", "o": ["1/e^(2x)", "2/e^(2x)", "2x", "2"], "a": 3, "s": "ln e<sup>2x</sup> = 2x, so the derivative is 2.", "img": ""}, {"y": 2008, "n": "50", "t": "Derivatives", "q": "If f(x) = 2 + |x − 3| for all x, then the value of the derivative f′(x) at x = 3 is:", "o": ["−1", "does not exist", "1", "2"], "a": 1, "s": "The left derivative at 3 is −1 and the right derivative is +1. They differ (a corner), so f′(3) does not exist.", "img": ""}, {"y": 2008, "n": "51", "t": "Applications of derivatives", "q": "The graph of y = 5x⁴ − x⁵ has a point of inflection at:", "o": ["(3, 162) only", "(4, 256) only", "(0, 0) only", "(0, 0) and (3, 162)"], "a": 0, "s": "y″ = 60x² − 20x³ = 20x²(3 − x) = 0 at x = 0 and x = 3. The sign of y″ changes only at x = 3 (x² does not change sign at 0), so the only inflection point is (3, 162).", "img": ""}, {"y": 2008, "n": "Tip 2", "t": "Integration", "q": "The value of ∫ x²/e<sup>x³</sup> dx is:", "o": ["−1/(3e<sup>x³</sup>) + c", "1/(3e<sup>x³</sup>) + c", "−3/e<sup>x³</sup> + c", "e<sup>−x³</sup> + c"], "a": 0, "s": "Let u = x³, so x² dx = du/3. ∫ e<sup>−u</sup> du/3 = −e<sup>−u</sup>/3 + c = −1/(3e<sup>x³</sup>) + c.", "img": ""}, {"y": 2008, "n": "Tip 5", "t": "Optimization", "q": "An object is moving along the parabola y = 2√x in the xy-plane. At what point on its path does the object become closest to the point (5, 0)?", "o": ["(4, 4)", "(1, 2)", "(3, √6)", "(3, 2√3)"], "a": 3, "s": "d² = (x − 5)² + 4x = x² − 6x + 25. Its derivative 2x − 6 = 0 gives x = 3, a minimum. Then y = 2√3, so the point is (3, 2√3).", "img": ""}, {"y": 2008, "n": "Tip 6", "t": "Applications of integrals", "q": "What is the area of the region between the graph of y = −x² + 1 and the x-axis where 0 ≤ x ≤ 2?", "o": ["2/3", "7/2", "3", "2"], "a": 3, "s": "The curve is above the axis on [0, 1] and below it on [1, 2], so add the two areas: ∫<sub>0</sub><sup>1</sup> (1 − x²) dx = 2/3 and |∫<sub>1</sub><sup>2</sup> (1 − x²) dx| = 4/3. Total = 2.", "img": ""}, {"y": 2008, "n": "Tip 7", "t": "Derivatives", "q": "What is the equation of the tangent line to the graph of f(x) = 4/x² − 2x + 4 at (2, f(2))?", "o": ["3x + y = 6", "3x + y = 7", "6x + y = 13", "−6x + y = 13"], "a": 1, "s": "f(2) = 1 − 4 + 4 = 1. f′(x) = −8/x³ − 2, so f′(2) = −1 − 2 = −3. Tangent: y − 1 = −3(x − 2), i.e. 3x + y = 7.", "img": ""}, {"y": 2008, "n": "Tip 9", "t": "Continuity", "q": "Let f(x) = sin(kx)/x for x &lt; 0 and f(x) = e<sup>2x</sup> − 2 for x ≥ 0. If f is continuous at x = 0, what is the value of k?", "o": ["2", "−1", "1", "−2"], "a": 1, "s": "Left limit: sin(kx)/x → k. Value at 0: e<sup>0</sup> − 2 = −1. So k = −1.", "img": ""}, {"y": 2009, "n": "21", "t": "Sequences", "q": "Which one of the following is a convergent sequence?", "o": ["{(5/3)ⁿ}", "{2n/(n+1)}", "{n²/(n+1)}", "{(−1)ⁿ·3}"], "a": 1, "s": "2n/(n+1) → 2, so it converges (it is bounded and increasing). (5/3)<sup>n</sup> and n²/(n+1) grow without bound, and (−1)<sup>n</sup>/3 oscillates between −1/3 and 1/3.", "img": ""}, {"y": 2009, "n": "22", "t": "Sequences", "q": "A radioactive material loses one-third of its mass per year. If its current mass is 81 g, how much will its mass be just after 7 years?", "o": ["27 g", "1/27 g", "128/27 g", "128/81 g"], "a": 2, "s": "Each year 2/3 of the mass remains: m = 81(2/3)<sup>7</sup> = 81·128/2187 = 128/27 g (worked out directly from the problem statement).", "img": ""}, {"y": 2009, "n": "23", "t": "Series", "q": "Which of the following is the sum of the series 5 − 10/3 + 20/9 − 40/27 + … ?", "o": ["−5", "−3", "3", "5"], "a": 2, "s": "Geometric with a = 5 and r = −2/3. S = 5/(1 + 2/3) = 5/(5/3) = 3.", "img": ""}, {"y": 2009, "n": "24", "t": "Series", "q": "What is the sum of Σ_{n=1}^{30} (−1)ⁿ (1/n + 1/(n+1)) ?", "o": ["−29/30", "29/30", "30/31", "−30/31"], "a": 3, "s": "The sum telescopes: S<sub>n</sub> = −1 − 1/(n+1) when n is odd and −1 + 1/(n+1) when n is even. For n = 30: −1 + 1/31 = −30/31.", "img": ""}, {"y": 2009, "n": "25", "t": "Sequences", "q": "Which of the following relations holds for the sequence −10, −3, 4, 11, …?", "o": ["a_n = a_{n−1} − 8", "a_n = a_{n−1} + 7", "a_n = a_{n−1} − 7", "a_n = a_{n−1} + 8"], "a": 1, "s": "Each term minus the previous one is 7 (−3 − (−10) = 7, 4 − (−3) = 7, …), so a<sub>n</sub> = a<sub>n−1</sub> + 7.", "img": ""}, {"y": 2009, "n": "31", "t": "Derivatives", "q": "Let f be a differentiable function with f(1) = −1 and f′(1) = 1. If g(x) = [f(2x + 1) + 2]², what is the value of g′(0)?", "o": ["4", "2", "−2", "−4"], "a": 0, "s": "g′(x) = 2[f(2x+1) + 2]·f′(2x+1)·2. At x = 0 the argument is 1: 2(−1 + 2)(1)(2) = 4.", "img": ""}, {"y": 2009, "n": "32", "t": "Derivatives", "q": "If f(x) = ln(x² + 2), then what is the value of f″(1)?", "o": ["3/2", "5/9", "2/3", "2/9"], "a": 3, "s": "f′ = 2x/(x² + 2). f″ = [2(x²+2) − 2x(2x)]/(x²+2)² = (4 − 2x²)/(x²+2)². At x = 1: 2/9.", "img": ""}, {"y": 2009, "n": "33", "t": "Derivatives", "q": "If x² + xy = 10, then what is the value of dy/dx when x = 2?", "o": ["−7/2", "2/7", "3/2", "7/2"], "a": 0, "s": "y = (10 − x²)/x, so dy/dx = (−x² − 10)/x². At x = 2: −14/4 = −7/2.", "img": ""}, {"y": 2009, "n": "34", "t": "Derivatives", "q": "What is the equation of the tangent line to the graph of f(x) = 3x² + 4x − 5 at (1, 2)?", "o": ["10x − y − 8 = 0", "−10x + y − 8 = 0", "−10x − y − 8 = 10", "10x + y − 8 = 0"], "a": 0, "s": "f′(x) = 6x + 4, so the slope at x = 1 is 10. Tangent: y − 2 = 10(x − 1), i.e. 10x − y − 8 = 0.", "img": ""}, {"y": 2009, "n": "35", "t": "Derivatives", "q": "If f(x) = π² + 1, then what is the value of f′(x)?", "o": ["2π + 1", "2π", "2", "0"], "a": 3, "s": "f is a constant function, so its derivative is 0.", "img": ""}, {"y": 2009, "n": "37", "t": "Continuity", "q": "What is the value of k so that f(x) = tan 2x / x if x &gt; 0, and f(x) = k − e^(2x) if x ≤ 0, is continuous at x = 0?", "o": ["0", "2", "3", "5"], "a": 2, "s": "Right limit: tan 2x/x → 2. Left value: k − e<sup>0</sup> = k − 1. Setting 2 = k − 1 gives k = 3.", "img": ""}, {"y": 2009, "n": "38", "t": "Limits", "q": "If f is continuous at x = 0 and g(x) = √x·(2f(x) + 3/√x) for all x &gt; 0, then what is the value of lim_{x→0⁺} g(x)?", "o": ["0", "2", "3", "5"], "a": 2, "s": "g(x) = 2√x·f(x) + 3. As x → 0⁺, √x·f(x) → 0·f(0) = 0, so g → 3.", "img": ""}, {"y": 2009, "n": "39", "t": "Limits", "q": "What is the value of lim_{x→0} (sin x · cos 2x)/(x² + 3x) ?", "o": ["1/3", "2/3", "1", "2"], "a": 0, "s": "= (sin x/x)·cos 2x/(x + 3) → 1·1/3 = 1/3.", "img": ""}, {"y": 2009, "n": "40", "t": "Limits", "q": "If a ≠ 0, then what is the value of lim_{x→a} (x² − a²)/(x⁴ − a⁴) ?", "o": ["1/a", "1/(2a²)", "1/(6a²)", "0"], "a": 1, "s": "x⁴ − a⁴ = (x² − a²)(x² + a²), so the ratio is 1/(x² + a²) → 1/(2a²).", "img": ""}, {"y": 2009, "n": "41", "t": "Integration", "q": "If f(0) = −1, f(1) = 2 and f′(x) is continuous on [0, 1], then which of the following is equal to ∫₀¹ f′(x)√(2 + f(x)) dx ?", "o": ["16/3", "14/3", "8/3", "4/3"], "a": 1, "s": "Let u = 2 + f(x), du = f′(x)dx. At x = 0, u = 1; at x = 1, u = 4. ∫<sub>1</sub><sup>4</sup> √u du = (2/3)u<sup>3/2</sup> = 16/3 − 2/3 = 14/3.", "img": ""}, {"y": 2009, "n": "42", "t": "Integration", "q": "What is the value of ∫₀^{ln√3} eˣ/(e⁻ˣ + eˣ) dx ?", "o": ["½ ln 2", "ln 4", "ln 2", "1"], "a": 0, "s": "Multiply by e<sup>x</sup>: e<sup>2x</sup>/(1 + e<sup>2x</sup>). Let u = 1 + e<sup>2x</sup>, du = 2e<sup>2x</sup>dx; u goes from 2 to 4. ∫ = ½ ln u from 2 to 4 = ½(ln 4 − ln 2) = ½ ln 2.", "img": ""}, {"y": 2009, "n": "43", "t": "Applications of integrals", "q": "What is the value of the area of the region enclosed by the graphs of f(x) = eˣ and g(x) = x between the lines x = −1 and x = 1?", "o": ["(e² − 1)/e", "e² − 1/e", "e² − 1/e + 2", "e − 1/e + 2"], "a": 0, "s": "e<sup>x</sup> is above x on [−1, 1]. A = ∫(e<sup>x</sup> − x) dx = [e<sup>x</sup> − x²/2] = (e − 1/2) − (1/e − 1/2) = e − 1/e = (e² − 1)/e.", "img": ""}, {"y": 2009, "n": "44", "t": "Applications of integrals", "q": "Which of the following is equal to the volume of the solid generated when the region bounded by the graph of y = 2√(x + 1) and the x-axis, 0 ≤ x ≤ 2, rotates about the x-axis?", "o": ["8π", "8π²", "16π", "16π²"], "a": 2, "s": "V = π∫<sub>0</sub><sup>2</sup> 4(x + 1) dx = 4π[x²/2 + x]<sub>0</sub><sup>2</sup> = 4π(4) = 16π.", "img": ""}, {"y": 2009, "n": "45", "t": "Applications of integrals", "q": "A particle moves along the x-axis with velocity v(t) = 3t² + 6t for time t ≥ 0. If the particle is at position x = 2 at time t = 0, what is the position of the particle at t = 1?", "o": ["6", "9", "11", "12"], "a": 0, "s": "x(t) = ∫(3t² + 6t)dt = t³ + 3t² + C. x(0) = 2 gives C = 2. So x(1) = 1 + 3 + 2 = 6.", "img": ""}, {"y": 2009, "n": "46", "t": "Integration", "q": "Which of the following is equal to ∫ x(eˣ + sin(x²)) dx ?", "o": ["eˣ(x + 1) + ½ sin(x²) + C", "eˣ(x − 1) − ½ sin(x²) + C", "eˣ(x − 1) − ½ cos(x²) + C", "eˣ(x − 1) + ½ cos(x²) + C"], "a": 2, "s": "∫ x e<sup>x</sup> dx = x e<sup>x</sup> − e<sup>x</sup> (by parts). ∫ x sin(x²) dx = −½ cos(x²) (let u = x²). Sum: e<sup>x</sup>(x − 1) − ½ cos(x²) + C.", "img": ""}, {"y": 2009, "n": "47", "t": "Applications of derivatives", "q": "Which one of the following is the set of critical numbers of f(x) = (4/3)x³ + |x| ?", "o": ["{1/2}", "{0, 1/2}", "{0, −1/2}", "{−1/2, 0, 1/2}"], "a": 2, "s": "For x &gt; 0, f′ = 4x² + 1, never 0. For x &lt; 0, f′ = 4x² − 1 = 0 gives x = −1/2 (x = 1/2 is not in this branch). At x = 0 the derivative does not exist. Critical numbers: {−1/2, 0}.", "img": ""}, {"y": 2009, "n": "48", "t": "Applications of derivatives", "q": "Suppose f: (−∞, ∞) → ℝ is differentiable and the graph of its derivative y = f′(x) is as shown in the figure. Which one of the following is true about f?", "o": ["f is increasing on (1, ∞)", "f is concave upward on (0, ∞)", "f has no relative maximum value", "f has a relative minimum value at x = 2"], "a": 3, "s": "f′ changes from + to − at x = 0 (relative maximum) and from − to + at x = 2 (relative minimum). f′ is negative on (0, 2), so f is decreasing on (1, 2) (A false). f′ is decreasing on (0, 1), so f is concave down there (B false). There is a relative maximum at x = 0 (C false).", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAggAAADcCAAAAAAwpwavAAABBmlDQ1BJQ0MgUHJvZmlsZQAAeJxjYGCSYAACFgMGhty8kqIgdyeFiMgoBQYkkJhcXMCAGzAyMHy7BiIZGC7r4lGHC3CmpBYnA+kPQFxSBLQcaGQKkC2SDmFXgNhJEHYPiF0UEuQMZC8AsjXSkdhJSOzykoISIPsESH1yQRGIfQfItsnNKU1GuJuBJzUvNBhIRwCxDEMxQxCDO4MTGX7ACxDhmb+IgcHiKwMD8wSEWNJMBobtrQwMErcQYipAP/C3MDBsO1+QWJQIFmIBYqa0NAaGT8sZGHgjGRiELzAwcEVj2oGICxx+VQD71Z0hHwjTGXIYUoEingx5DMkMekCWEYMBgyGDGQCSpUCz8yM2qAAAJWZJREFUeNrtnXd8XNWVx7/3vvemq1qy3CvY2GCDsY0BFzAlQABvaMmGBEKA3bRdSCEhYTdk0zawBBKyZDchLCUhQOgl9GpaAIdmY2yDbdnqlqwy0mjaK3f/GJWRLdsjaTRImnc+H1szb+6775bfO+fcc889B5U9iqV9TmZQPmoppZS13zLh1J+X5jPz1f1XpsLBuUy/s98ff7tme89n88YJtUoppeL7riyhlFK2rZRynH5+7uqcM6DRsQc5qmlPsU2llIrvXdPmW1cE8V7Q4KjWAzbB7L+IUIwKai0BJfb5s61hGmyZu+d1R6bu2l1G3Nd72TQO9LyEd58/WfqBm2trwzQOjiQa6Od6uCj12P03Tglb7aPAaAFCVsjSRH9gyGRmxzzlFRCUAKUQwnEcXaYBRIDmAiGvyFGAlsKEaWBrOEKk4cQFQp7gACQ4skvcutRD+TUYSiEBqRKgLGKgLMA0AcsFQh4BAQk4CBIIiQChgzKMLm7hAiGfKBmpw+sBic9qMQGBGQNduUDIH40IcOLRB+oQDhKev/XJ3cpWzZXbm/J93ZBfS2ihQeTS+2atnkRnAe8tKqF18r3HPnyexfLnfJ1BlyPkE22sYtd6KIBZi+Kt8tyFzNEpP8OH3xUN+USxpz+g86mtAIV3nMX0FSHmx0PnX5KX6lI+A+Gtpzq9PH8/AAsunlr5GiQpPqPctSPkF7U8+y4h6p7eBMDig3gK/szMw3GBkF/05JNJHPjwCQugeDFtzfW/YVV5nlsR8m3VwI773sFoF6rx9sJ/AjjcaLhWvXfkmfmuIeRd/6vewFtiE+KDv9QAzFvGdfexeBnku405vzadTA/AhEQr+J5ZCVB1WMf4xvpASGLLfN58zC/RsKttWrEd39ZAsMwpjyfiRRCc+mFjIOCT5PkudH4BoaLi5qXWhm9vNf/zaF0swguEjvyQE0PuhnS+KYsnGCyxo8E1M7oveI+6M3BF95akqyzmCdlEYfdmOsuhe9t5
